# Week 62 (Conflict networks and scheduling) as problem files. The order of problems is
# the file order in problems/. This is a shared-packet week: one student packet serves
# every band, so week.toml defines one band, "shared", whose packet is
# week-62-students.pdf. Each page's header range is set by \gdef\band{...} at the top of
# the page's first file (page 1 uses the template's Grades 2--5). The networks are drawn
# by figures.py, the old builder's drawing code. The band slices and page menu in
# band-views/ are cut from the built PDF by source/band-views/band_views.py from its page
# index. The adult guide is not built from these files: editable/ is the portable
# package, with editable/guide/facilitator.tex (README.md).
week = 62
topic = "Conflict networks"
packet = "W62"            # footer id W62-S-v1
version = "v2"
layout = "flow"
template = "template.tex"
prompt = '\noindent\textbf{Problem <<n>>:} <<body>>\par'
page_break = '\clearpage'
status = "Unpiloted. Card handling and timing untested."

[bands.shared]
header = "Shared packet"
tag = "S"
file = "students"

[guide]
note = "The print guide is week-62-facilitator.pdf (source editable/guide/facilitator.tex); it holds the keys, hints and routes by band."
