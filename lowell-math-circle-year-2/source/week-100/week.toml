# Week 100 (Distance in nested worlds) as problem files. The order of problems is the
# file order in problems/. Each page is one pagepicture, 250 by 180 mm, y down
# (template.tex); a problem's text sections are the TikZ drawing code of its page.
# The adult guide is not built from these files: its source is guide/facilitator.tex
# and guide/solutions.tex (see README.md).
week = 100
topic = "Distance in nested worlds"
packet = "W100"           # footer id W100-G35-v3
version = "v3"
layout = "flow"
template = "template.tex"
prompt = '\problem{<<n>>}{<<body>>}'
page_break = '''\end{pagepicture}
\newpage
\begin{pagepicture}'''
status = "Unpiloted; physically unrehearsed."

[bands."3-5"]
header = "Grades 3--5"
tag = "G35"
file = "grades-3-5"

[guide]
note = "The answer keys, proofs, preparation and launch are in the print guide, week-100-facilitator.pdf, whose source is guide/facilitator.tex and guide/solutions.tex. This view lists each problem's number, route and idea."
