# Week 61 (Triangles on a ball) as problem files. The order of problems is the file
# order in problems/. This is a shared-packet week: one student packet serves every
# band, so week.toml defines one band, "shared", whose packet is week-61-students.pdf.
# Each page's header names its grade range, set by \band{...} at the top of the page's
# first file. The sphere pictures come from editable/student/geometry.py through
# figures.py. The band slices and page menu in band-views/ are cut from the built PDF
# by source/band-views/band_views.py from its page index. The adult guide is not built
# from these files: editable/ is the portable package, with editable/guide/facilitator.tex
# (README.md).
week = 61
topic = "Triangles on a ball"
packet = "W61"            # footer id W61-S-v3
version = "v3"
layout = "flow"
template = "template.tex"
prompt = '\problem{<<n>>}{<<body>>}'
status = "Unpiloted. Ball, string, marker and meridian handling physically unrehearsed."

[bands.shared]
header = "Shared packet"
tag = "S"
file = "students"

[guide]
note = "The print guide is week-61-facilitator.pdf (source editable/guide/facilitator.tex); it holds the keys, hints and routes by band."
