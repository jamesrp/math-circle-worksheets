# Week 90 (Sliding number arrays) as problem files: one shared Grades 2–5 packet in the
# flow layout. The order of problems is the file order in problems/. Each page is one
# overlay picture in millimetres, y down (template.tex); a problem's text sections are
# the TikZ drawing code of its page. The adult guide and the materials pages are not
# built from these files: their sources are editable/guide/facilitator.tex and
# editable/student/materials.tex (README.md).
week = 90
topic = "Sliding number arrays"
packet = "W90"            # footer id W90-students-v2
version = "v2"            # v1 until the footer-version sweep for the October 23 changes
layout = "flow"
template = "template.tex"  # the old students.tex preamble, with the page frame as macros
prompt = '\problem{<<n>>}{<<body>>}'
page_break = '\pageclose\newpage\pageopen'
status = "Unpiloted. Handling, masks, resets and timing are physically unrehearsed."

[bands."2-5"]
header = "Grades 2--5"
tag = "students"
file = "students"          # print name week-90-students.pdf

[guide]
note = "This week's adult guide is week-90-facilitator.pdf, whose source is editable/guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
