# Week 79 (Numbered-ball detectives) as problem files: one shared student packet in the
# flow layout. Pages 1-3 and the card and mat pages print "Grades 2--5"; Problem 5's page
# sets \level to "Grades 4--5" in its own text. The order of problems is the file order in
# problems/. The adult guide is not built from these files: its source is
# editable/guide/facilitator.tex (README.md).
week = 79
topic = "Numbered-ball detectives"
packet = "79"             # footer id 79-ST-v2
version = "v2"
layout = "flow"
template = "template.tex"  # the old students.tex preamble, with <<body>> where the problems go
prompt = '\problem{<<n>>}{<<body>>}'
status = "Organizer-approved October 15, 2026 (v1); revised October 23 from the review card (v2), after that approval. Unpiloted; card handling and the mat are unrehearsed."

[bands."2-5"]
header = "Grades 2--5"
tag = "ST"
file = "students"         # print name week-79-students.pdf

[guide]
note = "This week's adult guide is week-79-facilitator.pdf, whose source is editable/guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
