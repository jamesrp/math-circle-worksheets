# Week 60 (Take it or pass) as problem files. The order of problems is the file order in
# problems/. This is a shared-packet week: one student packet serves every band, so
# week.toml defines one band, "shared", whose packet is week-60-students.pdf. Each page's
# header names its grade range, set by \renewcommand{\band} in the text that opens the
# page; the band slices and page menu in band-views/ are cut from the built PDF by
# source/band-views/band_views.py from its page index. The cards and diagrams are TikZ in
# the problem files, with their macros in template.tex. The adult guide is not built from
# these files: editable/ is the portable package, with editable/guide/facilitator.tex
# (README.md).
week = 60
topic = "Take it or pass"
packet = "W60"            # footer id W60-S-v3, written in template.tex
version = "v3"
layout = "flow"
template = "template.tex"
prompt = '\problem{<<n>>}{<<body>>}'
status = "Unpiloted. Drawing, mixing, counters and card scoring physically unrehearsed."

[bands.shared]
header = "Shared packet"
tag = "S"
file = "students"

[guide]
note = "The print guide is week-60-facilitator.pdf (source editable/guide/facilitator.tex); it holds the keys, hints and the timed route."
