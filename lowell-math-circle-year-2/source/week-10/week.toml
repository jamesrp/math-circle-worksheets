# Week 10 (Bridges and one-stroke drawings) as problem files, the source of the print
# packets since October 23, 2026. Problems are the files in problems/, in packet order.
# Figures are Python expressions evaluated in figures.py, which carries over the old
# builders' drawing code (src/towns.py, designs.py, pictures.py, koenigsberg.py and
# layout.py). src/check.py checks every town and picture the problem files draw. The
# adult guide is not built from these files: its source is guide-src/.
week = 10
topic = "Bridges"
packet = "F10"              # footer ids F10-K-v4, F10-M-v5, F10-U-v4
version = "v4"
layout = "flow"
template = "template.tex"   # the old builders' preamble
# Each problem is a minipage holding its statement and first figures, so they stay on
# one page; the prompt opens it and figs() in figures.py closes it.
prompt = '''\begin{minipage}{\linewidth}\raggedright
\prob{<<n>>}<<body>>'''
status = "Unpiloted."

[bands."K-1"]
header = "K--1"
tag = "K"
size = "12pt"
bodysize = '\large'

[bands."2-3"]
header = "Grades 2--3"
tag = "M"
version = "v5"           # the review card's page fixes, October 23, 2026
size = "12pt"
bodysize = ""

[bands."4-5"]
header = "Grades 4--5"
tag = "U"
size = "12pt"
bodysize = ""

[guide]
note = "The answers, hints and routes are in the adult guide, week-10-facilitator.pdf, whose source is guide-src/facilitator.tex. First route = the guide's core problems."
