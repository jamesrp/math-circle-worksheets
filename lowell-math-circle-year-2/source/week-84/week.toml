# Week 84 (Public knowledge) as problem files: one shared Grades 2--5 student packet in
# the flow layout, with its card and label pages as setup files. The order of problems
# is the file order in problems/. The adult guide is not built from these files: its
# source is editable/guide/facilitator.tex (README.md).
week = 84
topic = "Public knowledge"
packet = "W84"            # footer id W84-PK-draft-v3
version = "draft-v3"
layout = "flow"
template = "template.tex"  # the old students.tex preamble, with <<body>> where the problems go
prompt = '\problem{<<n>>}{<<body>>}'
status = "Unpiloted draft. Physical handling of the cards, dolls and reply slots is unrehearsed."

[bands."2-5"]
header = "Grades 2--5"
tag = "PK"
file = "students"         # print name week-84-students.pdf

[guide]
note = "This week's adult guide is week-84-facilitator.pdf, whose source is editable/guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
