# Week 99 (Moving piles) as problem files. The order of problems is the file order
# in problems/. Each page is one overlay picture in inches, y up from the bottom left
# (template.tex): a page's first file opens it with \portraitpage or \landscapepage,
# and \promptstyle{y}{width}{size}{leading} places the next prompt. A problem's text
# sections are the TikZ drawing code of its page. The adult guide is not built from
# these files: its source is guide/facilitator.tex and guide/solutions.tex.
week = 99
topic = "Moving piles"
packet = "W99"            # footer ids W99-23-v2, W99-45-v3
version = "v2"
layout = "flow"
template = "template.tex"
prompt = '\problem{<<n>>}{<<body>>}'
page_break = '\pageclose\newpage'
status = "Unpiloted; physically unrehearsed."

[bands."2-3"]
header = "Grades 2--3"
tag = "23"

[bands."4-5"]
header = "Grades 4--5"
tag = "45"
version = "v3"            # critic follow-up, October 23, 2026: Problem 5's third star pair is labelled extra workspace

[guide]
note = "The answer keys, proofs, preparation and launch are in the print guide, week-99-facilitator.pdf, whose source is guide/facilitator.tex and guide/solutions.tex. This view lists each problem's numbers, route and idea."
