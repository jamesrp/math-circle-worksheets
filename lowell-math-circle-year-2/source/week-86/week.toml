# Week 86 (Pursuit and escape) as problem files. The order of problems is the file order
# in problems/. Two packets are bands: the shared Grades 2-5 packet (W86-S-v1) and the
# upper Grades 4-5 packet (W86-U-v1), whose Problem 1 repeats the shared one. The
# materials pages and the adult guide are not built from these files: their sources are
# figures.py (materials_tex) and editable/guide/facilitator.tex (see README.md).
week = 86
topic = "Pursuit and escape"
packet = "W86"            # footer ids W86-S-v1 and W86-U-v1
version = "v1"
layout = "canvas"         # one TikZ overlay per page; figures.py holds the page template
status = "Unpiloted; counters, turn tiles and fold covers physically unrehearsed."

[bands."2-5"]
header = "Grades 2--5"
tag = "S"
file = "shared"

[bands."4-5"]
header = "Grades 4--5"
tag = "U"
file = "upper"

[guide]
note = "This view repeats, by problem, the answer keys of the print guide, week-86-facilitator.pdf, whose source is editable/guide/facilitator.tex; page references are to that guide. Change both together; check\\_guide\\_copy.py compares them."
overview = "guide/overview.tex"
