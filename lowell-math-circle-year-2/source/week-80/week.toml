# Week 80 (Midnight laboratory) as problem files: one shared student packet in the flow
# layout, headed Grades 2--5; Problem 3 switches the header to Grades 4--5 and the cut-out
# page switches it back. The order of problems is the file order in problems/. The adult
# guide is not built from these files: its source is editable/guide/facilitator.tex (README.md).
week = 80
topic = "Midnight laboratory"
packet = "M80"            # footer id M80-D-v1
version = "v1"
layout = "flow"
template = "template.tex"  # the old students.tex preamble, with <<body>> where the problems go
prompt = '\problem{<<n>>}{<<body>>}'
status = "Organizer-approved and promoted October 17, 2026. Unpiloted; folding, the counter and the card are unrehearsed."

[bands."2-5"]
header = "Grades 2--5"
tag = "D"
file = "students"         # print name week-80-students.pdf

[guide]
note = "This week's adult guide is week-80-facilitator.pdf, whose source is editable/guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
