# Week 3 (Shuffle machines) as problem files, the source of the print packets since
# October 23, 2026 (first made as the flow-layout example in
# experiments/atomic-problems-pilot/). Problems are the files in problems/, in packet
# order. The adult guide is not built from these files: its source is guide-src/.
week = 3
topic = "Shuffle machines"
packet = "F03"              # footer ids F03-K-v5, F03-M-v5, F03-U-v5
version = "v5"
layout = "flow"
template = "template.tex"   # the whole document, with <<body>> where the problems go
inputs = ["src"]            # preamble.tex and the figure files fig/*.tex, written by src/figures.py
# The week's \problem macro numbers with a counter. Setting the counter first keeps
# the packet's numbers in first-route and return packets.
prompt = '\setcounter{prob}{<<n>>}\addtocounter{prob}{-1}\problem{<<body>>}'
status = "Unpiloted."

[bands."K-1"]
header = "K–1"
tag = "K"
size = "14pt"
extra = '\renewcommand{\labelfont}{\large}'

[bands."2-3"]
header = "Grades 2–3"
tag = "M"
size = "12pt"
extra = ""

[bands."4-5"]
header = "Grades 4–5"
tag = "U"
size = "12pt"
extra = ""

[guide]
note = "The answers, hints and routes are in the adult guide, week-03-facilitator.pdf, whose source is guide-src/facilitator.tex. First route = the guide's core problems."
