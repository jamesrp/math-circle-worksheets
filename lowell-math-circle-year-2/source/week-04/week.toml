# Week 4 (Stars and secret wheels) as problem files, the source of the print packets
# since October 23, 2026. Problems are the files in problems/, in packet order. Figures
# are Python expressions evaluated in figures.py, which carries over the old builder's
# drawing code (src/gen.py, with src/tikzlib.py). src/check.py checks the codes, rings
# and pictures. The adult guide is not built from these files: its source is guide-src/.
week = 4
topic = "Stars and wheels"
packet = "F04"              # footer ids F04-K-v4, F04-M-v5, F04-U-v5
version = "v4"
layout = "flow"
template = "template.tex"   # the old builder's preamble
# The old builder's text(): each statement is its own paragraph, flush left.
prompt = '\par\vspace{0in}\noindent \prob{<<n>>} <<body>>\par'
# The old builder ended every page with \vfill.
page_break = '''\vfill
\newpage'''
status = "Unpiloted."

[bands."K-1"]
header = "K--1"
tag = "K"
bodysize = '\fontsize{14}{19}\selectfont'

[bands."2-3"]
header = "Grades 2--3"
tag = "M"
bodysize = ""
version = "v5"              # October 23, 2026: Problem 5's message is two or three words (review card fix 4)

[bands."4-5"]
header = "Grades 4--5"
tag = "U"
bodysize = ""
version = "v5"              # October 23, 2026: Problem 12, a dot that lands on itself "draws no line of its own" (review card fix 6)

[guide]
note = "The answers, hints and routes are in the adult guide, week-04-facilitator.pdf, whose source is guide-src/facilitator.tex. First route = the guide's core problems."
