# Week 91 (Rotor-router machines) as problem files: one shared student packet in the
# canvas layout. Each page names its grade range with head(...) in its first file. The
# order of problems is the file order in problems/. The return-visit packet, the
# materials and the adult guide are not built from these files: their sources are
# editable/student/generate.py and editable/guide/facilitator.tex (README.md).
week = 91
topic = "Rotor-router machines"
packet = "F91"            # footer id F91-S-v2
version = "v2"            # v1 until Problem 2 gained an extra-workspace board, October 23
layout = "canvas"         # one TikZ overlay per page; figures.py holds the page template
status = "Unpiloted. Printing, cutting, flipping, counter placement and timing are physically unrehearsed."

[bands."2-5"]
header = "Grades 2--5"
tag = "S"
file = "students"         # print name week-91-students.pdf
prompt_size = 14

[guide]
note = "This week's adult guide is week-91-facilitator.pdf, whose source is editable/guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
