# Week 63 (Cards away from home) as problem files. The order of problems is the file
# order in problems/. This is a shared-packet week: one student packet serves every
# band, so week.toml defines one band, "shared", whose packet is week-63-students.pdf.
# Each page's header names its grade range, set by \band in the problem files' text;
# the band slices and page menu in band-views/ are cut from the built PDF by
# source/band-views/band_views.py from its page index. The adult guide and the
# materials are not built from these files: editable/ is the portable package, with
# editable/guide/facilitator.tex and editable/student/materials.tex (README.md).
week = 63
topic = "Cards away from home"
packet = "W63"            # footer id W63-S-v4
version = "v4"
layout = "flow"
template = "template.tex"
prompt = '\problem{<<n>>}{<<body>>}'
status = "Unpiloted. Cutting, placement and the reversal rehearsal physically unperformed."

[bands.shared]
header = "Shared packet"
tag = "S"
file = "students"

[guide]
note = "The print guide is week-63-facilitator.pdf (source editable/guide/facilitator.tex); it holds the keys, hints and routes by band."
