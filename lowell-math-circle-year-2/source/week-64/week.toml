# Week 64 (Straight paths on strange surfaces) as problem files: one shared student packet
# in the canvas layout, numbered 1-9 across the packet. figures.py holds the old builder's
# page template and drawing code; each page's first figure, page_start(level), opens the
# page and prints its grade range (Grades 3--5 on pp. 1-6, Grades 4--5 on pp. 7-9). The
# order of problems is the file order in problems/. This is a shared-packet week: its band
# slices and page menu in band-views/ are cut from the built PDF by band_views.py from its
# page index. The adult guide is not built from these files: its source is
# guide/facilitator.tex (README.md).
week = 64
topic = "Straight paths on strange surfaces"
packet = "W64"            # footer id W64-G35-v1
version = "v1"
layout = "canvas"         # one picture per page, in inches from the top-left corner, y down
status = "Unpiloted. Cutting, tracing and the slanted-edge transfer are unrehearsed."

[bands.shared]
header = "Shared packet"
tag = "G35"
file = "students"         # print name week-64-students.pdf

[guide]
note = "This week's adult guide is week-64-facilitator.pdf, whose source is guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
