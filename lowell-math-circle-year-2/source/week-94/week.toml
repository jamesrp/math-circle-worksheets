# Week 94 (Calibration lab) as problem files: three band packets in the flow layout.
# The order of problems is the file order in problems/; each band prints the files
# whose grades include it. template.tex is the old common.tex preamble with each
# band's head (header, footer id and type size) as placeholders. The adult guide is
# not built from these files: its source is editable/guide/facilitator.tex (README.md).
week = 94
topic = "Calibration lab"
packet = "W94"            # footer ids W94-K-v4, W94-M-v2, W94-U-v2
version = "v2"
layout = "flow"
template = "template.tex"
prompt = '\problem{<<n>>}{<<body>>}'
status = "Unpiloted. Printing, cutting, handling and the games are unrehearsed."

[bands."K-1"]
header = "Grades K--1"
tag = "K"
version = "v4"          # v3: K-1 Problems 4-6 after the independent critic; v4: two rulers per strip in Problem 2 (October 23, 2026)
fs = "15"
bs = "19"

[bands."2-3"]
header = "Grades 2--3"
tag = "M"
fs = "13"
bs = "17"

[bands."4-5"]
header = "Grades 4--5"
tag = "U"
fs = "12.5"
bs = "16.5"

[guide]
note = "This week's adult guide is week-94-facilitator.pdf, whose source is editable/guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
