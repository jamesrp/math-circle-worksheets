# Week 98 (Growing from a few seeds) as problem files. The order of problems is the
# file order in problems/. Each page is one overlay picture in millimetres, y down
# (template.tex); a problem's text sections are the TikZ drawing code of its page.
# The adult guide is not built from these files: its source is guide/facilitator.tex
# and guide/solutions.tex (see README.md).
week = 98
topic = "Growing from a few seeds"
packet = "W98"            # footer ids W98-23-v2, W98-45-v2
version = "v2"
layout = "flow"
template = "template.tex"
prompt = '\problem{<<n>>}{<<body>>}'
page_break = '\pageclose\newpage\pageopen'
status = "Unpiloted; physically unrehearsed."

[bands."2-3"]
header = "Grades 2--3"
tag = "23"

[bands."4-5"]
header = "Grades 4--5"
tag = "45"

[guide]
note = "The answer keys, proofs, preparation and launch are in the print guide, week-98-facilitator.pdf, whose source is guide/facilitator.tex and guide/solutions.tex. This view lists each problem's numbers, route and idea."
