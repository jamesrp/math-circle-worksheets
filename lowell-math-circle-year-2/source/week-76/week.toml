# Week 76 (Substitution strips) as problem files: one shared Grades 3–5 packet in the flow
# layout. Each page is one TikZ canvas in millimetres, y down (template.tex); a problem's
# text sections are its drawing code, and \promptat{y} places its numbered prompt. The
# order of problems is the file order in problems/. The adult guide is not built from
# these files: its source is editable/guide/facilitator.tex (README.md).
week = 76
topic = "Substitution strips"
packet = "F76"            # footer id F76-35-v2
version = "v2"
layout = "flow"
template = "template.tex"  # the old students.tex preamble, with <<body>> where the problems go
prompt = '\Text{0}{\prompty}{182}{\textbf{Problem <<n>>:} <<body>>}'
page_break = '''\CanvasEnd
\newpage
\CanvasStart'''
status = "Unpiloted. Organizer-approved October 15, 2026. Tile handling is unrehearsed."

[bands."3-5"]
header = "Grades 3--5"
tag = "35"
file = "students"         # print name week-76-students.pdf

[guide]
note = "This week's adult guide is week-76-facilitator.pdf, whose source is editable/guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
