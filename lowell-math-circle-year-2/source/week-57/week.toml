# Week 57 (Area from dots) as problem files: one shared student packet in the flow
# layout, numbered 1-10 across the packet. The template is the old students.tex
# preamble; the pages' header range is \Band, which Problem 7's file changes to
# Grades 4--5. The figures are TikZ macros drawn from editable/student/assets/polygons.json
# by figures.py. The order of problems is the file order in problems/. This is a
# shared-packet week: its band slices and page menu in band-views/ are cut from the
# built PDF by band_views.py from its page index. The adult guide is not built from
# these files: its source is editable/guide/facilitator.tex (README.md).
week = 57
topic = "Area from dots"
packet = "N57"            # footer id N57-S-final-v2
version = "final-v2"
layout = "flow"
template = "template.tex"
prompt = '\Problem{<<n>>}{<<body>>}'
status = "Unpiloted. Cutting, handling and the physical rehearsal on guide p. 2 are unperformed."

[bands.shared]
header = "Shared packet"
tag = "S"
file = "students"         # print name week-57-students.pdf

[guide]
note = "This week's adult guide is week-57-facilitator.pdf, whose source is editable/guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
