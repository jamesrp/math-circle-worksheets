# Week 106 (Coloring maps) as problem files, the source of the two print packets
# (K-1 and grades 2-5, the organizer's two-level rule of November 18, 2026). Written
# through the worksheet workflow on November 20, 2026 (run notes and reviews in
# plans/drafts/weeks-101-plus/week-106-pages/), chosen by James for December 2, 2026.
# Problems are the files in problems/, in packet order; each band has its own template.
# src/ holds the shared preamble (common.tex), the figures (figs/, written by figs.py,
# which also checks every map's color count), game.py (every line of play of the
# Painter and Spoiler games) and check_torus7.py (the seven-country donut map).
# No adult guide: the answers are in plans/room-plans/2026-12-02-map-coloring.md.
week = 106
topic = "Coloring maps"
packet = "W106"
version = "v1"
layout = "flow"
prompt = '\prob{<<n>>}<<body>>'
page_break = '\newpage'
inputs = ["src"]
status = "Unpiloted."

[bands."K-1"]
header = "K--1"
tag = "k-1"
version = "v2"              # November 22, 2026: the rules say a quick scribble of color in each country is enough
template = "template-k-1.tex"

[bands."2-5"]
header = "Grades 2--5"
tag = "grades-2-5"
file = "grades-2-5"
template = "template-2-5.tex"

[guide]
note = "No adult guide. The answers, the games' outcomes and the hint ladder are in the December 2, 2026 room plan, plans/room-plans/2026-12-02-map-coloring.md."
