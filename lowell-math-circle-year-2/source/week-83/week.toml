# Week 83 (Hackenbush balances) as problem files: one shared student packet in the
# flow layout, headed Grades 2--5, whose nursery pages switch the header to Grades 4--5.
# The order of problems is the file order in problems/. The adult guide is not built
# from these files: its source is editable/guide/facilitator.tex (README.md).
week = 83
topic = "Hackenbush balances"
packet = "W83"            # footer id W83-S-v1
version = "v1"
layout = "flow"
template = "template.tex"  # the old students.tex preamble, with <<body>> where the problems go
prompt = '\problem{<<n>>}{<<body>>}'
status = "Unpiloted. Physical handling of the stalks and cards is unrehearsed."

[bands."2-5"]
header = "Grades 2--5"
tag = "S"
file = "students"         # print name week-83-students.pdf

[guide]
note = "This week's adult guide is week-83-facilitator.pdf, whose source is editable/guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
