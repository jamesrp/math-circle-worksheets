# Week 53 (Connecting networks) as problem files: one shared student packet in the
# flow layout, headed Grades K--5, whose pages 5-9 switch the header to Grades 4--5
# (\renewcommand\Band at the top of page 5). The order of problems is the file order
# in problems/. figures.py supplies the map macros, drawn by editable/student/
# diagrams.py from networks.json and defined by problems/00-diagram-macros.md. The
# adult guide is not built from these files: its source is editable/guide/
# facilitator.tex (README.md).
week = 53
topic = "Connecting networks"
packet = "W53"            # footer id W53-networks-v2
version = "v2"
layout = "flow"
template = "template.tex"  # the old students.tex preamble, with <<body>> where the problems go
prompt = '\problem{<<n>>}{<<body>>}'
status = "Unpiloted. Counters, markers and the payment tray are physically unrehearsed."

[bands."K-5"]
header = "Grades K--5"
tag = "networks"
file = "students"         # print name week-53-students.pdf

[guide]
note = "This week's adult guide is week-53-facilitator.pdf, whose source is editable/guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
