# Week 77 (Persistent holes) as problem files: one shared Grades 4–5 packet in the flow
# layout. Each page is one TikZ canvas in centimetres, y down (template.tex); a problem's
# text sections are its drawing code, and \promptat{y} places its numbered prompt. The
# order of problems is the file order in problems/. The adult guide is not built from
# these files: its source is editable/guide/facilitator.tex (README.md).
week = 77
topic = "Persistent holes"
packet = "F77"            # footer id F77-45-v3
version = "v3"
layout = "flow"
template = "template.tex"  # the old students.tex preamble, with <<body>> where the problems go
prompt = '\textat{0}{\prompty}{18.2}{\textbf{Problem <<n>>:} <<body>>}'
page_break = '''\pageend
\newpage
\pagebegin'''
status = "Unpiloted prototype awaiting organizer review. Tile, token and edge-strip handling is unrehearsed."

[bands."4-5"]
header = "Grades 4--5"
tag = "45"
file = "students"         # print name week-77-students.pdf

[guide]
note = "This week's adult guide is week-77-facilitator.pdf, whose source is editable/guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
