# Week 87 (Voting and agendas) as problem files. The order of problems is the file order
# in problems/. Three packets are bands, each numbered from 1: the card packet (Grades
# 2-5, W87-S-v2), the line packet (Grades 3-5, W87-L-v2) and the upper packet (Grades
# 4-5, W87-U-v2). The materials pages and the adult guide are not built from these
# files: their sources are figures.py (materials_tex) and editable/guide/facilitator.tex.
week = 87
topic = "Voting and agendas"
packet = "W87"            # footer ids W87-S-v2, W87-L-v2 and W87-U-v2; key W87-G-v2
version = "v2"            # v1 until the footer-version sweep for the October 23 changes
layout = "canvas"         # one TikZ overlay per page; figures.py holds the page template
status = "Unpiloted; cutting, token fit, resets and timing physically unrehearsed."

[bands."2-5"]
header = "Grades 2--5"
tag = "S"
file = "shared"

[bands."3-5"]
header = "Grades 3--5"
tag = "L"
file = "line"

[bands."4-5"]
header = "Grades 4--5"
tag = "U"
file = "upper"

[guide]
note = "This view repeats, by problem, the answer keys of the print guide, week-87-facilitator.pdf, whose source is editable/guide/facilitator.tex; page references are to that guide. Change both together; check\\_guide\\_copy.py compares them."
overview = "guide/overview.tex"
prepare = "guide/prepare.tex"
