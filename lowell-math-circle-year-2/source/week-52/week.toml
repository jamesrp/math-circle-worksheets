# Week 52 (Hinged frames and braces) as problem files: one shared student packet in
# the flow layout, numbered 1-14 across the packet. Each page names its own grade
# range: the \band{...} line at the top of the page's first file sets the header.
# The order of problems is the file order in problems/. The adult guide is not built
# from these files: its source is editable/guide/facilitator.tex (README.md).
week = 52
topic = "Hinged frames and braces"
packet = "F52"            # footer id F52-S-v2
version = "v2"
layout = "flow"
template = "template.tex"  # the old students.tex preamble, with <<body>> where the problems go
prompt = '\problem{<<n>>}{<<body>>}'
status = "Unpiloted. Kits, pin fit and pin service are physically unrehearsed."

[bands."K-5"]
header = "Grades K--5"
tag = "S"
file = "students"         # print name week-52-students.pdf

[guide]
note = "This week's adult guide is week-52-facilitator.pdf, whose source is editable/guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
