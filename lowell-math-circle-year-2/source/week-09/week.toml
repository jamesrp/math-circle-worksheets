# Week 9 (Bouncing paths) as problem files, the source of the print packets since
# October 23, 2026. Problems are the files in problems/, in packet order. Figures are
# Python expressions evaluated in figures.py, which carries over the old builder's
# drawing code (src/gen.py). src/check.py runs the old builder's checks of the
# simulation, the unfolding sheets and the targets. The adult guide is not built from
# these files: its source is guide-src/.
week = 9
topic = "Bouncing paths"
packet = "F09"              # footer ids F09-K-v4, F09-M-v4, F09-U-v4
version = "v4"
layout = "flow"
template = "template.tex"   # the old builder's preamble
# A statement runs straight into its first picture, as in the old builder: \samepar
# (defined in template.tex) swallows the blank line after the prompt.
prompt = '\prob{<<n>>} <<body>> \samepar'
status = "Unpiloted."

[bands."K-1"]
header = "K--1"
tag = "K"
size = "14pt"
cls = "extarticle"

[bands."2-3"]
header = "Grades 2--3"
tag = "M"
size = "12pt"
cls = "article"

[bands."4-5"]
header = "Grades 4--5"
tag = "U"
size = "12pt"
cls = "article"

[guide]
note = "The answers, hints and routes are in the adult guide, week-09-facilitator.pdf, whose source is guide-src/facilitator.tex. First route = the guide's core problems."
