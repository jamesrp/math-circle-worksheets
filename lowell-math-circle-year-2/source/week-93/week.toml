# ready for general reasoning. The order of problems is the file order in problems/.
# The adult guide is not built from these files: its source is
# editable/guide/facilitator.tex (README.md).
week = 93
topic = "Squaring a rectangle"
packet = "W93"            # footer id W93-S-v2
version = "v2"
layout = "flow"
template = "template.tex"  # the old students.tex preamble, with <<body>> where the problems go
prompt = '\problem{<<n>>}{<<body>>}'
status = "Unpiloted. Cutting, card fit and timing are unrehearsed."

[bands."3-5"]
header = "Grades 3--5"
tag = "S"
file = "students"         # print name week-93-students.pdf

[guide]
note = "This week's adult guide is week-93-facilitator.pdf, whose source is editable/guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
