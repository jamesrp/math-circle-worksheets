# Week 67 (Meeting on shortest roads) as problem files: one shared Grades 3–5 packet in the
# flow layout. The order of problems is the file order in problems/. template.tex is the
# old students.tex preamble, with <<body>> where the problems go.
# The adult guide is not built from these files: its source is guide/facilitator.tex.
week = 67
topic = "Meeting on shortest roads"
packet = "GGT67"          # footer id GGT67-S-v1
version = "v1"
layout = "flow"
template = "template.tex"
prompt = '\problem{<<n>>}{<<body>>}'
status = "Unpiloted. Counter placement and coloured-route legibility are unrehearsed."

[bands."3-5"]
header = "Grades 3--5"
tag = "S"
file = "students"         # print name week-67-students.pdf

[guide]
note = "This week's adult guide is week-67-facilitator.pdf, whose source is guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
