# Week 66 (Lamplighter streets) as problem files: one shared Grades 3–5 packet in the
# flow layout. The order of problems is the file order in problems/. template.tex is the
# old students.tex preamble, with <<body>> where the problems go.
# The adult guide is not built from these files: its source is guide/facilitator.tex.
week = 66
topic = "Lamplighter streets"
packet = "GGT66"          # footer id GGT66-S-v2
version = "v2"            # v2: the October 23 card fixes, with a new Problem 6
layout = "flow"
template = "template.tex"
prompt = '\problem{<<n>>}{<<body>>}'
status = "Unpiloted. Counter fit on the printed lamps and the partner roles are unrehearsed."

[bands."3-5"]
header = "Grades 3--5"
tag = "S"
file = "students"         # print name week-66-students.pdf

[guide]
note = "This week's adult guide is week-66-facilitator.pdf, whose source is guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
