# Week 58 (Fair division) as problem files. The order of problems is the file order in
# problems/. This is a shared-packet week: one student packet serves every band, so
# week.toml defines one band, "shared", whose packet is week-58-students.pdf. Each page's
# header names its grade range, set by \newband in the text that opens the page; the band
# slices and page menu in band-views/ are cut from the built PDF by
# source/band-views/band_views.py from its page index. template.tex carries the
# definitions of editable/student/common.tex, which the materials still input. The adult
# guide and the materials are not built from these files: editable/ is the portable
# package, with editable/guide/guide.tex and editable/student/materials.tex (README.md).
week = 58
topic = "Fair division"
packet = "W58"            # footer id W58-shared-v2, written in template.tex
version = "v2"
layout = "flow"
template = "template.tex"
prompt = '\prob{<<n>>}{<<body>>}'
status = "Unpiloted. Card, strip and cutting handling physically unrehearsed."

[bands.shared]
header = "Shared packet"
tag = "shared"
file = "students"

[guide]
note = "The print guide is week-58-facilitator.pdf (source editable/guide/guide.tex); it holds the keys, hints and routes by table."
