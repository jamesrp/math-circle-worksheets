# Week 78 (Three-armed lines) as problem files: one shared Grades 4-5 student packet in
# the flow layout. The folder is itself the portable package (build.py, student/, guide/,
# checks/), as Weeks 98-100: student/regenerate.py writes student/students.tex from these
# files, and figures.py draws the boards from student/data.py, which both checkers read.
# The order of problems is the file order in problems/. The adult guide is not built from
# these files: its source is guide/facilitator.tex.
week = 78
topic = "Three-armed lines"
packet = "F78"            # footer id F78-S-v2
version = "v2"
layout = "flow"
template = "template.tex"  # the old students.tex preamble, with <<body>> where the problems go
prompt = '\problem{<<n>>}{<<body>>}'
status = "Organizer-approved and promoted October 17, 2026. Unpiloted; physical preparation and handling are unrehearsed."

[bands."4-5"]
header = "Grades 4--5"
tag = "S"
file = "students"         # print name week-78-students.pdf

[guide]
note = "This week's adult guide is week-78-facilitator.pdf, whose source is guide/facilitator.tex. These problem files hold each problem's one-sentence idea; the full answers, hints and proofs are in the guide."
