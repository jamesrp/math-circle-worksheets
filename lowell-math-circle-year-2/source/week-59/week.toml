# Week 59 (Constant width) as problem files. The order of problems is the file order in
# problems/. This is a shared-packet week: one student packet serves every band, so
# week.toml defines one band, "shared", whose packet is week-59-students.pdf. Each page's
# header names its grade range, set by \renewcommand{\band} in the text that opens the
# page; the band slices and page menu in band-views/ are cut from the built PDF by
# source/band-views/band_views.py from its page index. The pictures are drawn in Python:
# figures.py takes them from editable/student/make_assets.py, which also writes the
# materials' pictures. The adult guide and the materials are not built from these files:
# editable/ is the portable package, with editable/guide/facilitator.tex and
# editable/student/materials.tex (README.md).
week = 59
topic = "Constant width"
packet = "W59"            # footer id W59-S-v3, written in template.tex
version = "v3"
layout = "flow"
template = "template.tex"
prompt = '\problem{<<n>>}{<<body>>}'
status = "Unpiloted. Cutting, rails and compass handling physically unrehearsed."

[bands.shared]
header = "Shared packet"
tag = "S"
file = "students"

[guide]
note = "The print guide is week-59-facilitator.pdf (source editable/guide/facilitator.tex); it holds the keys, hints and the timed route."
