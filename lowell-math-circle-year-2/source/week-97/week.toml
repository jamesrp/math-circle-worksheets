# Week 97 (Square remainders) as problem files: one shared Grades 3-5 packet, stored as
# one band whose file is "students". The order of problems is the file order in problems/.
# student/regenerate.py writes student/students.tex from them for the package build.
# The adult guide is not built from these files: its source is guide/facilitator.tex.
# The published views stay the band-views slices and page menu, cut from the print PDF.
week = 97
topic = "Square remainders"
packet = "W97"            # footer id W97-35-v2
version = "v2"            # v1 until the footer-version sweep for the October 23 changes
layout = "flow"
template = "template.tex"
prompt = '\problem{<<n>>}{<<body>>}'
status = "Unpiloted; kits and timing unrehearsed."

[bands."3-5"]
header = "Grades 3--5"
tag = "35"
file = "students"

[guide]
note = "The answer keys, proofs, preparation and launch are in the print guide, week-97-facilitator.pdf, whose source is guide/facilitator.tex. This view lists each problem's number, route and idea."
