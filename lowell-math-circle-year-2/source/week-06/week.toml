# Week 6 (Code breaking) as problem files, the source of the print packets since
# October 23, 2026. Problems are the files in problems/, in packet order; each band's
# problems are its own files. Each band keeps its own document head in templates/,
# which reads the shared src/common.tex (blocks, counters, boards and record tables).
# The adult guide is not built from these files: its source is guide-src/.
week = 6
topic = "Code breaking"
packet = "F06"              # footer ids F06-K-v5, F06-M-v4, F06-U-v6; key F06-G-v5
version = "v5"              # the key's id; v4 until October 23, raised because the key's text changed
layout = "flow"
engine = "xelatex"          # common.tex loads fontspec (TeX Gyre Heros)
inputs = ["src"]            # common.tex
# \problem numbers itself with a counter; setting the counter first keeps the
# packet's numbers in route packets.
prompt = '\setcounter{prob}{<<n>>}\addtocounter{prob}{-1}\problem <<body>>'
status = "Unpiloted."

[bands."K-1"]
header = "K--1"
tag = "K"
version = "v5"              # October 23, 2026: Problem 6 shortened (review card should 4)
template = "templates/k-1.tex"

[bands."2-3"]
header = "Grades 2--3"
tag = "M"
version = "v4"
template = "templates/grades-2-3.tex"

[bands."4-5"]
header = "Grades 4--5"
tag = "U"
version = "v6"              # v5: Problem 2's rules (introduction audit); v6, October 23, 2026: Problem 8 asked as questions (review card could 13)
template = "templates/grades-4-5.tex"

[guide]
note = "The answers, hints and routes are in the adult guide, week-06-facilitator.pdf, whose source is guide-src/facilitator.tex. First route = the guide's core problems."
