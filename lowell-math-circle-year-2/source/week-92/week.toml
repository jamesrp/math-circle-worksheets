# Week 92 (Fold-and-stretch predictions) as problem files. The week prints one shared
# packet, so it has one view, "shared": every file in problems/, in file order, numbered
# across the packet. Each page is one TikZ canvas drawn by figures.py (the previous
# students.tex preamble, unchanged); band(...) at the top of a page sets the grade range
# its header prints. The band slices and page menu in band-views/ are built from this
# packet by source/band-views/band_views.py and its page index. The adult guide is not
# built from these files: its source is guide/facilitator.tex.
week = 92
topic = "Fold-and-stretch predictions"
packet = "W92"            # footer id W92-S-v3
version = "v3"
layout = "canvas"
status = "Unpiloted; physical rehearsal untested."

[bands.shared]
header = "Shared packet"
tag = "S"
file = "students"         # print name week-92-students.pdf

[guide]
note = "This week's adult guide is week-92-facilitator.pdf, whose source is guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
