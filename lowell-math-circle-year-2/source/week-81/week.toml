# Week 81 (Buckets of Fish) as problem files: one shared student packet in the flow layout,
# headed Grades 2--5; the any-refill rules before Problem 4 switch the header to Grades 4--5.
# The order of problems is the file order in problems/. The adult guide is not built from
# these files: its source is editable/guide/facilitator.tex (README.md).
week = 81
topic = "Buckets of Fish"
packet = "W81"            # footer id W81-S-v2 (W81-S-draft-v1 before the October 23 card fixes)
version = "v2"
layout = "flow"
template = "template.tex"  # the old students.tex preamble, with <<body>> where the problems go
prompt = '\problem{<<n>>}{<<body>>}'
status = "Organizer-approved and promoted October 17, 2026 (draft-v1). The v2 revision of October 23, from the review card's shoulds and coulds, post-dates that approval. Unpiloted; the board, the counters and the sorting cards are unrehearsed."

[bands."2-5"]
header = "Grades 2--5"
tag = "S"
file = "students"         # print name week-81-students.pdf

[guide]
note = "This week's adult guide is week-81-facilitator.pdf, whose source is editable/guide/facilitator.tex. These problem files hold each problem's one-sentence idea, not its answers."
