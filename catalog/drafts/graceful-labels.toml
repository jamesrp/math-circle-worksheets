hook = "Label the dots of a small network with cube towers or number cards so that the differences along the links are 1, 2, 3 and so on, each exactly once."
math = "A network with m links is graceful when its dots get different labels from 0 to m whose differences along the links are exactly 1 to m. Paths and stars always are; a loop with n links can be only when n leaves remainder 0 or 3 on division by 4, because the signed differences round the loop add to zero, so 1 + 2 + … + n must be even (Rosa showed all such loops work). Four dots all joined are graceful with 0, 1, 4, 6, a ruler that measures 1 to 6 once each, but five are not, and the graceful tree conjecture is recorded as open in the 2013 edition of Gallian's survey."
discover = "Some networks can be labelled and some cannot, an odd total rules out loops of 5 and 6 links, and every small tree tried works."
gem = "A parity proof, a perfect ruler and an open conjecture that children can test with cards."
concepts = ["graphs", "parity", "trees"]
uses = []
mechanisms = ["construct", "invariant", "every-case"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 reads nothing, with an adult reading the rules and a worked picture from towers to numbers; upper bands read short tasks."
arithmetic = "K–1 compares towers of 0 to 4 cubes; Grades 2–3 subtract within 10; Grades 4–5 add 1 to n and test for evenness."
materials = ["snap cubes for the K–1 towers, about 15 per pair", "number cards 0 to 10, one set per pair", "counters for the ruler strips"]
prep = "Print the networks and the ruler strips, and cut a set of number cards 0 to 10 for each pair."
untried = "Towers and cards on the printed dots; the K–1 towers stand on 3 cm circles."

