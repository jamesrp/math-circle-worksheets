hook = "Play a quick game for each pair of animal cards, lay an arrow card from each winner to the loser, then line the animals up so that each beat the next."
math = "In every round-robin with no ties the players can be lined up so that each beat the next, by inserting players one at a time, and the number of such line-ups is always odd (Rédei, 1934). Every tournament has a king, a player who beat everyone either directly or through someone they beat, and a player with the most wins is always one (Landau, 1953); a sorted list of win counts can happen exactly when the k smallest add to at least k(k − 1)/2 for every k, with total n(n − 1)/2 (Landau's theorem)."
discover = "A line-up always exists however the games go, it is the only one exactly when the results are a strict ranking, and a top scorer reaches everyone in at most two steps."
gem = "Circles of 'beats' cannot stop a line-up: insertion always finds a place, and the number of line-ups is always odd."
concepts = ["graphs", "nontransitive", "graph-distance"]
uses = []
mechanisms = ["smaller-cases", "extremal", "construct"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 reads nothing beyond animal pictures, with an adult reading the rules; upper bands read short tasks."
arithmetic = "K–1 counts and follows arrows; Grades 4–5 add win counts and compare them with k(k − 1)/2."
materials = ["40 mm animal cards and 75 mm arrow cards from the materials file", "the K–1 big board (K–1 page 1), line-up strip and Problem 2 mats"]
prep = "Print the materials file (animal faces in colour if possible) and cut the cards and strips, about 40 minutes plus printing."
untried = "Arrow cards in the lanes; the K–1 Problem 2 flow from the frog mat to the pig mat to the strip."

