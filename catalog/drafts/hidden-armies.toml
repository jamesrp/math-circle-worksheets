mechanisms = ["construct", "counterexample", "every-case"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 reads nothing, with an adult reading the rules; upper bands read short tasks and record plans as three numbers."
arithmetic = "K–1 counts to 6 and compares towers hill by hill; upper bands compare plans written as three numbers, and Grades 4–5 rank the 28 six-soldier plans by pooling."
materials = ["6–10 cubes per child", "a folder per child as a screen", "hill mats", "win tokens"]
prep = "Print hill mats and plan strips, and count cubes and win tokens for each pair."
untried = "Plans built behind folders on the hill mats."

