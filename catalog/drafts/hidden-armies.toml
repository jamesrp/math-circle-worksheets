hook = "Split your cubes secretly over three hill mats behind a folder, reveal both plans together, and win the hills where you have more."
math = "Each player splits the same N soldiers over three hills; a hill goes to whoever has more on it, an equal hill to nobody, and more hills wins. From N = 4 on, every plan loses to some other plan: sorted as a ≥ b ≥ c, the plan a − 2, b + 1, c + 1 takes the second and third hills. Beating goes round in circles (with 6 soldiers, 0-1-5 beats 2-0-4, which beats 1-2-3, which beats 0-1-5), so good play has to be unpredictable, and the game's solution is a random mixture of plans (Borel, 1921)."
discover = "No plan is safe, because moving soldiers to win two hills beats any plan, and plans can beat each other in a circle."
gem = "A one-line counter-plan proves that no fixed choice is best, which is why games of secret choices need randomness."
concepts = ["equilibria", "nontransitive"]
