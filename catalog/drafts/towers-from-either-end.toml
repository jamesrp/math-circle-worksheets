hook = "Take turns removing a whole cube tower from either end of a row, snap your haul into one stack, and see whose stack is taller."
math = "With an even number of towers, shade the slots alternately: the two ends of an even row are different colours, so the first player can take every tower of the richer colour and never loses. The colour plan is not best play (on 2, 1, 2, 3 it only promises a tie, but the first player can win 5 to 3), odd rows can be lost (1, 5, 1), and best play comes from working backward over inner rows in a table of margins; no simple rule is known for odd rows."
discover = "The player who starts an even row can always get at least a tie, a colouring of the slots shows how, and some odd rows are traps for the starter."
gem = "A two-colouring guarantees half the prize without solving the game, and the backward table of margins carries win/lose labels over to scores."
concepts = ["backward-induction", "parity", "optimization"]
uses = []
mechanisms = ["colouring", "work-backward", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 reads nothing beyond slot numbers, with an adult reading the rules; upper bands read short tasks."
arithmetic = "K–1 counts to 10 and compares hauls by stacking, with no adding; Grades 2–3 add to 20; Grades 4–5 fill a backward table of margins."
materials = ["snap cubes, about 30 per pair", "slot strips from the materials file: plain, then coloured red and blue"]
prep = "Print the packets and the materials file (one page in colour) at 100% and cut the strips, about 35 minutes; keep the coloured strips back until children have played on plain ones."
untried = "Towers standing in the 25 mm slots; paper strips sliding on the table."

