hook = "Break a card chocolate bar into single squares one break at a time, or join dots with curves while tokens count the curve ends, and notice that the same player always wins."
math = "Every break turns one piece into two, so an m-by-n bar always takes mn − 1 breaks and the first player wins 'last break wins' exactly when mn is even; 2-Sprigs on n dots always lasts n moves, and Brussels Sprouts on n crosses 5n − 2 moves (by Euler's formula), so the winner is fixed before play. In Sprouts, lives that drop by one each move only bound a game of n spots between 2n and 3n − 1 moves, and the players' choices matter."
discover = "In some games nothing either player does changes the winner, because a count changes by the same amount at every move; in Sprouts the choices do matter."
gem = "An invariant settles the winner before anyone moves, and Euler's formula turns up as a move counter."
concepts = ["game-length", "parity", "euler-formula"]
uses = []
mechanisms = ["invariant", "monovariant"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 reads nothing, with an adult reading the rules; upper bands read short rules and tasks."
arithmetic = "K–1 counts to 12, dropping a counter in a cup for each break; Grades 2–3 predict a bar's or board's winner before playing; Grades 4–5 explain the counts and test 5n − 2."
materials = ["card chocolate bars, 5–8 per pair", "token counters", "pencils"]
prep = "Print the bar grids on card and cut out the rectangles (10–15 minutes in the outline), or snap flat cube slabs."
untried = "5–8 card bars per pair (the outline said 6); counters on the dot boards."

