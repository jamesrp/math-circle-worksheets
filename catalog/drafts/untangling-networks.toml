outline = "plans/topic-scouting/untangling-networks.md"
hook = "Move the paper dots of a pipe-cleaner network until no link lies across another, and find the networks that never come untangled."
math = "A connected network drawn without crossings satisfies V − E + F = 2; with at least three dots and no double links every region has at least three sides, so E ≤ 3V − 6, and without triangles E ≤ 2V − 4. So five dots all joined to each other (10 links, more than 9) and three houses joined to three wells (9 links, more than 8) can never be untangled; each can be drawn with one crossing, and both with none on a torus such as Week 41's portal board."
discover = "Some networks can be untangled and some cannot, counting dots, links and regions shows why, and on the portal board the stuck ones come free."
gem = "Euler's formula turns from a fact about solids into a proof that a drawing is impossible, and changing the surface removes the impossibility."
concepts = ["euler-formula", "graphs", "torus"]
uses = []
mechanisms = ["double-count", "certificate", "construct"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 reads nothing, with houses and wells drawn as pictures and an adult reading the rules; upper bands read short tasks."
arithmetic = "K–1 counts crossings; Grades 2–3 count dots, links and regions; Grades 4–5 compare link counts with 3V − 6 and 2V − 4."
materials = ["paper dots with paper clips, 6 per pair", "pipe cleaners, 15 per pair", "pencils", "the printed link-game boards and portal boards"]
prep = "Make the dot and pipe-cleaner kits: about 20 minutes the first time, and they are reusable."
untried = "Pipe cleaners twisted round the clips."

