hook = "Take turns biting a grid of cookie counters with an L-shaped bite card, eating a cookie and every cookie above and to its right; whoever has to eat the poisoned corner loses."
math = "On every rectangle bigger than one cookie the first player can win: if eating only the top-right cookie lost, the winning reply could have been played as the first move instead, because that cookie lies in every bite (strategy stealing, Gale 1974). Squares (bite diagonally next to the poison, then copy on the other arm) and two-row boards (keep the top row one shorter) have explicit strategies; on other rectangles the winning bite is found only by search, and even three-row Chomp has no known simple rule."
discover = "The first player can always win, the square trick and the two-row rule show how on special boards, and an argument can prove that a winning first bite exists without finding it."
gem = "Strategy stealing proves a win exists with no strategy in hand."
concepts = ["strategy-stealing", "backward-induction", "copying-strategies"]
uses = []
mechanisms = ["copying", "work-backward", "every-case"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 reads nothing, with an adult reading one or two sentences per problem; Grades 4–5 read a child's short argument and say which step breaks on a given board."
arithmetic = "Counting to 12; no arithmetic beyond counting cookies."
materials = ["25 mm counters, about 25 per pair, with one different poison counter", "a 15 cm L-shaped bite card per pair"]
prep = "Print the boards at 100% and cut one bite card per pair; boards are rebuilt from a cup of counters after each game."
untried = "The bite card on neighbouring boards (the build checks the spacing)."

