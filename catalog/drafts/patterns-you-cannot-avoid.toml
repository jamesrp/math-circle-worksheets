hook = "Colour strips of squares with red and blue counters, sliding a spacing comb along to check that no three equally spaced squares match, and find how long a strip you can fill."
math = "A strip of 8 squares can be coloured red and blue with no one-colour equally spaced three, but 9 cannot (van der Waerden); the numbers 1 to 4 can be coloured with no one-colour x + y = z, but 1 to 5 cannot (Schur); and colouring every link among six dots always makes a one-colour triangle, because three of one dot's five links share a colour (pigeonhole, R(3, 3) = 6), while five dots can avoid it. So the game Sim, colouring the fifteen links of six dots in turn, cannot end in a draw."
discover = "A long enough strip, list of numbers or set of dots forces a one-colour pattern, and each has a largest size that can still avoid it."
gem = "Complete disorder is impossible: three different patterns, each with a sharp threshold, and pigeonhole as the proof."
concepts = ["ramsey", "words", "graph-colouring"]
uses = []
mechanisms = ["pigeonhole", "every-case", "construct"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 reads nothing, with an adult reading the rules on landscape pages; upper bands read short tasks."
arithmetic = "K–1 counts to 9; Grades 2–3 add small numbers for the sums; Grades 4–5 follow forced colours and use pigeonhole."
materials = ["25 mm printed strips", "red, blue and green counters", "spacing combs", "number cards"]
prep = "Print the spacing combs on card and cut them (about 15 minutes for five sets in the outline)."
untried = "The combs on the K–1 page strips; the dot boards are about 6–7 cm across, not the outline's 12 cm."

