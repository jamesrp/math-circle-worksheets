hook = "Stand counters on the spots of a circle and, going round and round, flip every second standing one to sitting until one is left standing."
math = "When every second person sits, the last one standing in a circle of n = 2^m + L people (L smaller than 2^m) is number 2L + 1: in a power-of-two circle the count comes back to person 1 at the start of every lap, so person 1 survives, and once L people have sat down a power of two remain and person 2L + 1 counts next. The same halving gives J(2k) = 2J(k) − 1 and J(2k + 1) = 2J(k) + 1, and in binary the answer moves the leading 1 of n to the end; when every third person sits there is no simple closed formula, but each answer follows from the one before."
discover = "Circles of 2, 4, 8 and 16 always leave number 1, and between powers of two the survivor climbs by two."
gem = "An elimination game whose answer is the circle's size in binary with its leading digit moved to the end (Concrete Mathematics, §1.3)."
concepts = ["recurrence", "place-value", "remainders"]
uses = []
mechanisms = ["smaller-cases", "every-case"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 reads nothing, with an adult reading the rules; upper bands read short tasks and tables."
arithmetic = "K–1 counts to 16; Grades 2–3 build a table and predict larger circles; Grades 4–5 use powers of two and binary."
materials = ["two-sided counters about 25 mm (1 inch) across, up to 32 per pair"]
prep = "Print the packets: K–1 plays on its pages' circles, and the other packets end with a 16-spot mat and a 32-spot mat printed as two halves."
untried = "1-inch counters on the 26 mm spots; the two halves of the 32-spot mat laid side by side."

