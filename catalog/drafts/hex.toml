outline = "plans/topic-scouting/hex.md"
hook = "Take turns placing red and blue counters on a board of hexagons, each trying to join your own two edges with a chain."
math = "When a Hex board is full, exactly one player has a winning chain: two winning chains would have to cross, and following the boundary between the colours from a corner shows that someone has won (Gale showed the statement is equivalent to the Brouwer fixed-point theorem). Because there are no draws and an extra counter never hurts, the first player has a winning strategy on every board (Nash's strategy stealing), though nobody can describe one on large boards; on 3-by-3, 5 of the 9 first moves win."
discover = "However a board is filled, exactly one player has won, and the first player has a win that nobody can describe on big boards."
gem = "A game whose no-draw rule is a fixed-point theorem in disguise, and a cousin of Sperner's lemma."
concepts = ["strategy-stealing", "connectedness"]
uses = []
mechanisms = ["counterexample", "every-case"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 reads nothing, with an adult reading the rules; the edges are labelled RED and BLUE as well as tinted; upper bands read short tasks."
arithmetic = "Counting only; Grades 2–3 find the fewest blue counters that block a chain."
materials = ["red and blue counters no wider than 20 mm (bingo chips), about 25 of each per pair", "red and blue pencils for Grades 4–5"]
prep = "Print the boards at 100%, checking that the landscape page and the guide's launch board are not shrunk, and bag the counters."
untried = "Counters on the printed hexagons."

