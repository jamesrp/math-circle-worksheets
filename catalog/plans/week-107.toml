math = "If every wall connects to the outer wall, keeping one hand on the wall from the entrance reaches the exit, although not necessarily by the shortest route; wall islands can defeat the rule. Trémaux's marking method solves every finite maze, and Wilson's loop-erased random walks generate uniform spanning trees. Knocking down walls in random order while avoiding loops is not uniform, as the plan checks on a 2-by-3 maze."
