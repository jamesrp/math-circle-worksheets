field = "combinatorics, elementary number theory (binomial coefficients modulo a prime), probability"
hook = "Children fill rows with red and white counters (or crayons) and watch triangles inside triangles appear."
math = "Lucas's theorem says that modulo a prime p, C(n, k) is the product of the binomial coefficients of the base-p digits of n and k. For p = 2 this means C(n, k) is odd exactly when every binary 1 of k sits under a 1 of n; the first 2^k rows hold exactly 3^k odd entries. These are proved facts; observed bead counts on a real board are experiments."
concepts = ["binomial", "parity", "place-value"]
mechanisms = ["colouring", "smaller-cases", "simulate"]
