hook = "Cut a nibble from a card square, slide it to the opposite side, tape it and trace a floor of copies."
math = "Cutting a nibble from a square and translating it to the opposite side preserves a translation tiling. Beauquier–Nivat characterises hole-free polyomino translation tilings by two or three matching opposite boundary pieces. The Conway criterion allows half-turns and is sufficient, not necessary; the plan checks small counts and contrasts turned or flipped nibbles."
