field = "combinatorial topology, Borsuk–Ulam, fair division"
hook = "Cut a bead strip into pieces and share them into two cups so each colour is shared fairly."
math = "An open necklace with k colours, each present an even number of times, can be shared equally between two thieves with at most k cuts, and some necklaces need all k. For two colours, sliding a half-length window changes its red count by at most one at each step, forcing a fair window. The general cited proofs are topological and non-constructive."
