hook = "Roll pretend guests' birthdays onto a small calendar and tally whether any two counters share a box."
math = "For n independent uniform birthdays among d days, the probability of no match is d(d − 1)…(d − n + 1)/d^n. The even-chance threshold grows roughly with √d, whereas d + 1 guests guarantee a match by pigeonhole. Real birthdays are not needed: all classroom dates in this plan are rolled pretend dates."
