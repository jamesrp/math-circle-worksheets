math = "Bjorklund's construction, maximising total pairwise chord length and the cited full spacing condition give the same rhythm up to rotation, uniquely. Next-clap gaps have only the two neighbouring integer sizes, but that condition alone is insufficient. The rhythm facts are proved and exhaustively checked here for n ≤ 12; their prevalence in music is an observation."
