math = "Borromean rings are linked as a triple although every pair is unlinked; removing any loop frees the others. Pairwise linking numbers are all zero, so those counts do not prove the triple is an unlink. Three round circles cannot realise them; the cited polygon result does not settle Cook's general smooth-curve conjecture."
