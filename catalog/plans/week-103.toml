date = "2026-11"
area = "counting"
field = "combinatorics, graph theory (state graphs, Hamiltonian paths), binary and ternary codes"
hook = "With two cups on a three-spot mat, a child makes one legal move and the class finds the picture card for the new arrangement."
math = "With three pegs and n discs, the Tower of Hanoi has 3^n legal arrangements, forming a triangle of three copies of the previous state map. The shortest corner-to-corner route has 2^n − 1 moves, while the neighbour-pegs rule takes 3^n − 1 moves and visits every arrangement exactly once. These are proved facts, also checked for small n."
