hook = "Cut a paper square along a diagonal and rearrange the pieces into a triangle: did the paper get bigger or smaller?"
math = "The Wallace–Bolyai–Gerwien theorem says any two equal-area polygons can be cut into the same finite set of polygonal pieces and rearranged into each other. Equal volume is insufficient in three dimensions: Dehn's invariant distinguishes a cube from an equal-volume regular tetrahedron. The plane result assumes rigid polygonal pieces, with flips allowed."
