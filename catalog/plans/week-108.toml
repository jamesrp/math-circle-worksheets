hook = "A child pairs counters, keeps one of each pair if none is left over, or triples the pile and adds one if one is left."
math = "The Collatz map sends even n to n/2 and odd n to 3n + 1; the conjecture that every positive start reaches 1 is open. Computer verification to 2^71 is evidence, not a proof. The backward tree has an odd parent (m − 1)/3 exactly when m leaves remainder 4 modulo 6, apart from the parent 1 of m = 4."
