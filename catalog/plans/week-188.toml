math = "Random shortcuts in a ring can sharply reduce typical distances without removing local clustering. For the cited random-matching model the diameter is asymptotically about log₂ n with high probability. Milgram's incomplete letter chains and Watts–Strogatz simulations are observations, while ring formulas and the matching-model bound are mathematical results."
