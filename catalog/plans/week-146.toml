math = "An equal partition is quick to check with two sums, but finding one may require many candidate splits. Whether P = NP is open, and NP-completeness concerns worst-case growth, not computer difficulty of small child-sized examples. Greedy placement can fail, and some no-split instances lack the simple obstruction certificates the children first meet."
