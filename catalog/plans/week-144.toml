area = "logic"
field = "formal systems, invariants, decidability"
hook = "Apply picture rules to letter tiles and try to make MU from MI."
math = "MIU rules preserve a nonzero remainder modulo 3 in the I-count, so MU cannot be generated from MI. Conversely, exactly the M-followed-by-I-and-U strings with I-count not divisible by 3 are theorems. A bounded search can miss reachable strings; the invariant settles what trying forever cannot."
