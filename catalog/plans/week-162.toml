id = "162"
title = "Thirty coloured cubes"
file = "plans/drafts/weeks-101-plus/week-162-thirty-coloured-cubes.md"
status = "plan"
date = "2026-11"
area = "symmetry"
field = "group actions, orbit counting, the rotation group of the cube"
hook = "Sticker a cube with six colours, then turn it against a partner's cube to decide whether they are the same."
math = "Six distinct face colours give 6!/24 = 30 cubes up to rotation, in 15 mirror pairs. Repeated colours need orbit counting rather than simply dividing by 24: two colours give ten cubes. The plan checks MacMahon's matching-inner-face puzzle by exhaustive search."
concepts = ["group-actions", "chirality", "permutations"]
mechanisms = ["up-to-symmetry", "every-case", "double-count"]
bands = ["K-1", "2-3", "4-5"]
materials = ["40 blank 2 to 3 cm cubes", "six sticker colours, about 250 stickers", "30 sorting cards"]

