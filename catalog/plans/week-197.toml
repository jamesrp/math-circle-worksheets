math = "Hankin rays at equal contact angles turn a tiling into star patterns. In a regular n-gon, angle 180°k/n joins edge midpoints k apart and gives the star {n/k}; the plan proves and numerically checks this. A motif can have more symmetry than the whole wallpaper, and the construction does not establish how historical artists worked."
