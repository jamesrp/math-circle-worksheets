hook = "Cut the biggest squares from an A-sheet, then from each leftover strip, counting the squares in every round."
math = "No positive integer pair satisfies a² = 2b². The overlap or fold construction would produce a smaller pair of the same kind, an impossible infinite descent in positive integers. Reversing the construction gives Theon's near-miss ladder, while Euclidean square cutting never terminates on an ideal 1-by-√2 rectangle but does on rational paper dimensions."
