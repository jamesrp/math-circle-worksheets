hook = "Build every rectangle from a number of tiles, trace them for the gallery, then compare its proper-divisor tower with the number."
math = "A number is perfect when its proper divisors sum to it. The Euclid–Euler theorem characterises even perfect numbers as 2^(p−1)(2^p − 1) with the latter factor prime. Infinitely many even perfect numbers, and the existence of any odd perfect number, remain open."
