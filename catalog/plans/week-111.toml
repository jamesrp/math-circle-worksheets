area = "number"
field = "elementary number theory, partitions"
hook = "Build staircases from Cuisenaire rods or snap-cube towers: steps of heights 2, 3, 4 stand side by side and make 9."
math = "A positive whole number is a sum of two or more consecutive positive whole numbers exactly when it is not a power of 2. The number of such staircases equals the number of odd divisors greater than 1, proved by pairing steps and matching staircases to divisors."
concepts = ["divisibility", "partitions", "differences-sums"]
mechanisms = ["pair-up", "every-case", "construct"]
bands = ["K-1", "2-3", "4-5"]
materials = ["Cuisenaire rods or 100 snap cubes per table"]

