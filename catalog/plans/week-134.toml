area = "games"
field = "combinatorics (invariants and monovariants), combinatorial games"
hook = "Jump counters on small peg boards until one counter is left."
math = "A peg jump across a three-coloured line preserves the parities of the pairwise colour-count sums, restricting possible last pegs. Conway's soldiers can reach four rows beyond their starting half-plane but never five: golden-ratio weights never increase and any finite starting army weighs less than the row-5 target. The plan checks small boards and constructions; the 20-soldier minimum for row 4 needs a cited extra argument."
