math = "A rep-k tile forms a larger copy of itself from k identical smaller copies. The plan exhaustively checks finite examples such as L-tromino and sphinx doubles, and repeated four-way substitution gives 4^n pieces. A nonperiodic substitution tiling need not mean the tile itself is aperiodic; the L-tromino also tiles periodically."
