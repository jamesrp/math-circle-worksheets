hook = "Place a toy deep in a rope spiral, then walk a straight path to the wall and count rope crossings."
math = "A simple continuous closed plane curve separates a bounded inside from an unbounded outside. For polygons a ray avoiding corners has odd crossing count inside and even outside. Self-crossing loops break that two-region interpretation, and parity differs from winding number."
