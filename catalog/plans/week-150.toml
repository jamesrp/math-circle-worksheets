hook = "Pick up a string-and-bead network and lay it down in a different shape without changing who is joined."
math = "Graph isomorphism is a renaming preserving every link; a working renaming certifies sameness. Different invariant counts certify difference, but equal counts alone do not certify sameness. Polynomial-time graph isomorphism remains open; the plan checks small graph and tree-shape counts."
