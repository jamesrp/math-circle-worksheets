area = "chance"
field = "limits, squeezing between bounds, Archimedes' method"
hook = "Wrap string round a can, then mark off its diameter along the string to find three and a bit."
math = "Archimedes traps π between inscribed and circumscribed polygon perimeters, giving 223/71 < π < 22/7 at 96 sides. The area is half circumference times radius, hence πr². Rearranged wedges preserve area, but convergence to the rectangle needs an argument; appearance alone is not a proof about lengths."
