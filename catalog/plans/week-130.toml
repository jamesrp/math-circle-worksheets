status = "plan"
date = "2026-11"
area = "chance"
field = "geometric probability, expectation, integral geometry"
hook = "Drop toothpicks onto lines and sort them into touches a line and touches no line."
math = "A uniform drop of a straight needle of length L ≤ d across lines spaced d apart crosses with chance 2L/(πd). For a rigid wire of any shape and length L, expected crossings are 2L/(πd), by linearity of expectation and the comparison ring. Real drops only approximate uniform position and angle, and class averages remain noisy."
concepts = ["expected-value", "length", "equally-likely"]
mechanisms = ["double-count", "simulate", "construct"]
bands = ["K-1", "2-3", "4-5"]
materials = ["poster sheet with 6.5 cm line spacing", "50 toothpicks", "three pipe cleaners", "cup"]

