hook = "Deal counters round seven plates, trade each leftover for ten smaller counters and record what is left again."
math = "Long division of 1/p for prime p other than 2 and 5 cycles through remainders, with period the multiplicative order of 10 modulo p, dividing p − 1. Full-period primes make multiples of the repeating block into rotations. Infinitely many such primes are conjectured; Artin's conjecture is open without the stated extra hypothesis."
