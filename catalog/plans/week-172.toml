math = "Powers of two have the Benford first-digit frequencies in the limit, by irrational-rotation equidistribution. Exactly one power of two of each positive digit length starts with 1. Applying Benford's law to real data is empirical and can fail for restricted ranges; it is not a theorem about every list of numbers."
