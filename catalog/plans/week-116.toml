area = "symmetry"
field = "geometry, group theory (dihedral and reflection groups)"
hook = "Stand the hinged mirrors on a wedge, look in, and count the copies."
math = "Mirrors at angle 180°/n generate a dihedral group of order 2n, since two reflections at angle α compose to a turn of 2α. Every finite plane symmetry group is cyclic or dihedral. Consistent triangular mirror tubes have exactly the angle triples 60-60-60, 90-45-45 and 90-60-30."
concepts = ["groups", "reflection", "symmetry"]
mechanisms = ["unfold", "construct", "every-case"]
bands = ["K-1", "2-3", "4-5"]
materials = ["two acrylic craft mirrors about 10 cm square per pair, taped as a hinge", "card triangles"]

