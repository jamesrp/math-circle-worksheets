math = "Every line of n^2 + 1 distinct heights has a rising or falling subsequence of length n + 1, and descending blocks show sharpness. Labelling each endpoint by its longest rising and falling lengths gives a pigeonhole proof. Patience sorting gives another proof, and random-shuffle asymptotics must be distinguished from small checked averages."
