area = "networks"
field = "enumerative combinatorics (labelled trees, bijections, symmetry)"
hook = "Build different trees on numbered cups or pegs with one fewer straw than pegs, then sort by shape."
math = "Cayley's formula counts n^(n−2) labelled trees, proved by a bijection with Prüfer words. Counting each shape's numberings as n! divided by its symmetries gives the same small totals. This core already exists in atlas AD-04, and the source recommends a return visit centred on pegs and symmetry rather than a separate week."
