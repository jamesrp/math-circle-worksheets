hook = "Walk long and short strips along a shoreline and compare the measured totals."
math = "Coastline ruler laws are empirical fits over a range of scales, not theorems about real coasts. In the exact Koch model, replacing each segment with four of one-third the length multiplies length by 4/3 at every stage while keeping the curve bounded. Its similarity and box-counting dimension is log 4 / log 3."
