math = "A disjoint pairing that puts a complete pair in every winning line certifies a Breaker win by always answering in the partner cell. Counting can rule out such a pairing without ruling out every winning strategy. The plan checks small boards; the cited infinite-grid Maker–Breaker cases of six or seven in a row remain open."
