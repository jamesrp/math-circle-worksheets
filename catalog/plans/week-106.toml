hook = "Each child draws three or four long straight lines right across a sheet with a ruler and colours the countries."
math = "Maps made entirely of whole straight lines or whole circles need only two colours: crossing a border changes the parity of the number of lines or circles crossed. Every planar map needs at most four colours, while on a torus seven always suffice and can be needed. These are proved results, with the small torus construction checked in the plan."
