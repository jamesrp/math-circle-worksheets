hook = "Walk floor loops while a partner copies each turn on a pointer dial."
math = "A simple closed plane curve turns through one full turn in total, while self-crossing curves can have other integer turning numbers. Whitney's theorem classifies smooth regular closed curves up to cusp-free deformation by this number. For the stated repeating turtle moves, 360/gcd(A, 360) steps return both direction and position."
