field = "graph theory (2-factors of multigraphs), search and complexity"
hook = "Fold or sticker four cubes and stack them so the four long sides show every colour."
math = "The coloured-cube tower exists exactly when its opposite-face multigraph has two disjoint subgraphs using one link per cube and two link ends per colour. This shrinks the four-cube search, and the plan checks the commercial colouring's unique solution up to tower symmetry. General n-cube, n-colour solvability is NP-complete, so the small trick is not a general fast method."
