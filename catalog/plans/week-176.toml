math = "Minimax gives finite two-player zero-sum games an exact value and two random mixtures certifying neither player can improve against the other. In the unequal-prize bean game, red with probability 2/3 gives value 2/3 for prizes 1 and 2. Predictability of human choices is reported experimental evidence; the theorem does not apply to the non-zero-sum trust game."
