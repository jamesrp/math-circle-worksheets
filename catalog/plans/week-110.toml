area = "number"
field = "numeration systems, combinatorial game theory"
hook = "Children pay every amount from 1 to 20 and discover that each amount has only one legal payment under the neighbour rule."
math = "Zeckendorf's theorem gives every positive whole number exactly one sum of distinct non-neighbouring Fibonacci numbers from 1, 2, 3, 5, 8, 13, …. Fibonacci Nim's winning move can be read from the smallest coin in that representation, and the first player loses exactly on Fibonacci starting piles. The Zeckendorf game always ends in that representation; the cited second-player win for n > 2 is non-constructive."
