hook = "Drive a toy taxi past house cards and decide who should pay each cube of the road fare."
math = "The Shapley value uniquely satisfies efficiency, symmetry, the null-player rule and additivity, by averaging marginal costs over every arrival order. In the taxi game this equals sharing each road stretch among the riders who use it, and those shares lie in the core. Whether those axioms are the desired meaning of fairness is a choice, not a theorem."
