area = "chance"
field = "probability, weighted averages, statistics and causal reasoning"
hook = "Choose the better bag in each pair, then pour the A bags together and the B bags together and choose again."
math = "Two groups can each favour A over B while merging the groups favours B over A. A merged chance is a weighted average closer to the larger group, so equal group proportions prevent the reversal. Which comparison is appropriate requires a causal account, not only arithmetic."
