status = "plan"
date = "2026-11"
area = "counting"
field = "enumerative combinatorics, perfect matchings, statistical mechanics of tilings"
hook = "Children tile, then find a different tiling, then learn the flip: two dominoes side by side in a 2-by-2 block may turn together."
math = "The Aztec diamond of order n has exactly 2^(n(n+1)/2) domino tilings, and any tiling can be reached from any other by local 2-by-2 flips. The arctic circle theorem says that for large n almost every uniformly chosen tiling has frozen corners with a disordered middle approaching a circle of radius n/√2. Both general proofs are cited; the plan lists every tiling for n ≤ 4."
concepts = ["tilings", "listing-cases", "recurrence"]
mechanisms = ["every-case", "smaller-cases", "construct"]
bands = ["K-1", "2-3", "4-5"]
materials = ["card or foam dominoes, 3 cm squares", "12 per pair"]

