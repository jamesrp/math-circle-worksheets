math = "Goldbach's conjecture that every even number greater than 2 is a sum of two primes is open, despite computer checks through 4 × 10^18. Helfgott proved the three-prime statement for odd numbers greater than 5. Children can prove the odd two-prime criterion by parity and the implication from strong to weak, without turning finite evidence into a proof."
