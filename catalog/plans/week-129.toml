field = "topology, intermediate value theorem, fixed points"
hook = "Turn a rocking four-legged stool slowly on bumpy ground and watch the rocking pair of feet."
math = "A square table with equal legs on continuous, sufficiently gently sloped ground has a steady position within a quarter turn. Swapping the diagonals changes a signed height difference's sign, and continuity forces a zero in between; the theorem does not say the tabletop is level. Brouwer's theorem similarly guarantees a fixed point for a continuous map of a disk to itself."
