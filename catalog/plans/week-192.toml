hook = "Walk gap-free left-right messages from the root of a floor tree to pictures at its leaves."
math = "Prefix-free binary codes are tree leaves and satisfy Kraft's length budget Σ2^(−l) ≤ 1. Huffman's repeated joining of the two rarest groups minimises total length among letter-by-letter codes with known counts. Longer-block or arithmetic coding can do better, and Morse needs gaps because it is not prefix-free."
