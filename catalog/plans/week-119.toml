field = "combinatorics (permutations, counting), the mathematics of juggling"
hook = "From every beat a child lays the rainbow of the pattern's length, checking that no two land on the same beat."
math = "A periodic siteswap has no landing collision exactly when beat plus throw, modulo the period, is a permutation. Its ball count is the average throw, and the cited number of period-n patterns with exactly b balls is (b + 1)^n − b^n, counting rotations separately. These ignore real-hand constraints."
