hook = "A verifier calls left or right by coin flip while the prover tries to emerge from that side of a password-door cave."
math = "Repeated random border checks can make a false three-colouring claim pass with probability at most (1 − 1/m)^k for m borders and k rounds. Re-shuffling the colours makes each revealed pair a random pair of different colours, explaining zero knowledge. The proof is probabilistic, while two clock-arithmetic shares on a line recover a secret and one share reveals nothing."
