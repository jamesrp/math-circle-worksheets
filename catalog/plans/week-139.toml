hook = "Act out a two-padlock box exchange while a nosy mail carrier tries to peek."
math = "Substitution ciphers preserve letter frequencies despite their enormous key count. Two-padlock exchange needs no shared key, but numeric shift or multiplication padlocks leak the message from the public transmissions. Diffie–Hellman computes a shared clock power; its security is believed from hardness assumptions, not proved in the plan."
