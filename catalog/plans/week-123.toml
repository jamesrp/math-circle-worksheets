status = "plan"
date = "2026-11"
area = "shape"
field = "combinatorial geometry, visibility, graph colouring"
hook = "Play hide-and-seek in a taped room."
math = "A simple n-corner polygon with no holes can always be guarded by ⌊n/3⌋ guards, and combs show that many can be necessary. Fisk's proof triangulates, three-colours the corners and guards the least-used colour. This is a worst-case guarantee, not necessarily an optimum for a particular room, and holes require a different theorem."
concepts = ["graph-colouring", "convexity", "optimization"]
mechanisms = ["colouring", "certificate", "construct"]
bands = ["K-1", "2-3", "4-5"]
materials = ["masking tape", "guard counters or toy figures", "string or ruler", "three colours of dot stickers or crayons"]

