math = "Perfect out-shuffles send place i to 2i modulo 2n − 1, while in-shuffles send it to 2i + 1 modulo 2n + 1. Elmsley's binary steering code sends the top card to a chosen place by reading 1 as in and 0 as out. Both preserve mirror partners, restricting reachable orders; Week 3 already covers out-shuffle return times."
