math = "An odd prime is a sum of two squares exactly when it is 1 modulo 4, and then in only one way. A whole number works exactly when every prime factor that is 3 modulo 4 occurs to an even power. The windmill involution is a cited proof, checked here on primes through 97; grouping tiles by fours proves the elementary remainder-3 obstruction."
