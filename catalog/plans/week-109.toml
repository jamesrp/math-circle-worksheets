hook = "Share paper loaves fairly among paper workers using pieces of different unit-fraction sizes."
math = "Every fraction between 0 and 1 is a sum of different unit fractions. The greedy method always stops because the remainder's numerator strictly drops, but it need not give the shortest representation. The Erdős–Straus conjecture that every 4/n, n ≥ 2, is a sum of three positive unit fractions is open despite large computer checks."
