hook = "A turn slides every token on one ring one spot clockwise or anticlockwise."
math = "The commutator of two moves is do A, do B, undo A, undo B. If their moved spots overlap in exactly one spot, it cycles exactly three tokens and leaves all others home. Odd-length ring turns are even permutations, so they can never swap just two tokens; parity is not the only possible obstruction."
