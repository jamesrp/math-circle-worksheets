hook = "Draw a secret value card, make a sealed bid and compare pay-your-bid with pay-the-next-highest rounds."
math = "In a second-price auction with private values, bidding one's value is a dominant strategy: the highest other bid decides the price. In a first-price auction bidding one's value earns zero, so bidders shade bids. Revenue equivalence needs its stated independent-private-value assumptions, and the plan uses printed points, never real money."
