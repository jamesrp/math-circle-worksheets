# Use log: every time a theme was actually used with children.
#
# A coarse, public summary: no child names, attendance or work samples. The detailed private
# session logs stay in the local archive (LOCAL-RESOURCES.md, Private records) and out of Git.
#
# One [[use]] per meeting or home session. This is the record the readiness report
# (catalog/readiness.py), the six-year path and the worksheet copilot read to know what
# a group has met. Record only what the organizer reported; say where the report is.
# A theme's catalog status changes to "piloted" only when a classroom report exists,
# which is a separate decision from adding a line here.
#
#   date      YYYY-MM-DD, or YYYY-MM when the exact day was not recorded
#   setting   circle | home
#   weeks     catalog week ids used ("1", "1e"); [] when the session used no catalog theme
#   activity  what was done, short, in plain words
#   outcome   the organizer's judgement, in his words where possible
#   source    where the report lives (a file in this repository, or "organizer, <date>")
#   notes     optional: what to change or continue

