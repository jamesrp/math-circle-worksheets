id = "GA-22"
hook = "Place four pegs, colour each red or blue using both colours, and find a split whose red and blue stretched-band regions touch, or build an arrangement a partner cannot split."
concepts = ["convexity", "listing-cases"]
mechanisms = ["every-case", "counterexample", "construct"]
bands = ["K-1", "2-3", "4-5"]
gem = "Any four points in the plane split into two groups whose hulls meet, while three points in general position never do: Radon's theorem, whose general form follows from one linear dependence."

[[related]]
week = "22"
kind = "revisits"
note = "Week 22 already splits four dots into touching hulls (Radon's theorem); GA-22's coordinate boards, exact certificates and degenerate placements make it a return visit, not a new theme."

