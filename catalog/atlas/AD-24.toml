id = "AD-24"
hook = "Put two colours of beads round a small ring, turning but never flipping it, find every different necklace, and test why dividing the number of strings by the number of turns fails."
concepts = ["group-actions", "permutation-cycles", "gcd"]
uses = []
mechanisms = ["up-to-symmetry", "double-count", "every-case"]
bands = ["K-1", "2-3", "4-5"]
gem = "Burnside's lemma: averaging how many patterns each turn fixes counts necklaces exactly, even when dividing by the number of turns fails."

[[related]]
week = "33"
kind = "same-theorem"
note = "Orbit sizes divide the number of turns in both; Week 33's prime length makes every mixed orbit full, while composite lengths have short orbits such as 0101 that break the division."

[[related]]
week = "4"
kind = "same-theorem"
note = "A turn by j on n beads splits the positions into gcd(n, j) loops, as Week 4's hop k needs gcd(n, k) starts; a pattern the turn fixes is one colour on each loop."

[[related]]
week = "34"
kind = "same-object"
note = "The same bead rings: Week 34 colours them so that no turn or flip fixes the pattern, here they are counted up to turns."
