id = "GA-23"
hook = "Carry a paper arrow along three quarter-circle great arcs on a ball, keeping its angle to the direction of travel fixed on each leg, and compare it with the starting arrow when you get home."
concepts = ["curvature", "spherical-geometry", "angles"]
uses = ["coordinates"]
mechanisms = ["invariant", "coordinates"]
bands = ["4-5"]
gem = "Walking the octant triangle turns a carried arrow by 90°, exactly the triangle's angle excess and its area on the unit sphere: holonomy measures curvature."

[[related]]
week = "61"
kind = "same-theorem"
note = "The 90° the arrow turns around the octant triangle is that triangle's angle excess, Week 61's measure of its area on the ball."

[[related]]
week = "65"
kind = "same-theorem"
note = "Week 65 counts the extra turning an arrow needs around hyperbolic rooms, a discrete Gauss–Bonnet; the sphere's positive curvature shows up here as a turn equal to the triangle's area."

[[related]]
week = "56"
kind = "same-theorem"
note = "Week 56's missing angle at a corner of a solid is curvature concentrated at a point; an arrow carried around that corner turns by the defect, as the sphere turns it here."

[[related]]
week = "38"
kind = "contrast"
note = "An arrow carried round Week 38's Möbius band comes back reversed because of how the band is glued; here it comes back turned by 90° because the sphere is curved."
