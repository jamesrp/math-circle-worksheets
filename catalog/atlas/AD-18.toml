id = "AD-18"
hook = "Send the two unit arrows of a square to new arrows on a grid, draw the resulting parallelogram, and find maps that keep area, reverse orientation or flatten the square."
concepts = ["area", "scaling", "dissection", "linear-maps"]
uses = ["coordinates"]
mechanisms = ["invariant", "coordinates", "counterexample"]
bands = ["4-5"]
gem = "A shear slants a square without changing its area, and ad − bc records area change, orientation and collapse in one number."

[[related]]
week = "85"
kind = "same-theorem"
note = "Week 85's pantograph doubles both unit arrows, so areas multiply by 4 = det(2I); here every 2-by-2 map scales area by |ad − bc|."

[[related]]
week = "72"
kind = "same-theorem"
note = "Signed area again, positive counterclockwise: Week 72's robot accumulates it along a loop, here it is ad − bc for the image of the unit square."

[[related]]
