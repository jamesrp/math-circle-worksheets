id = "AD-13"
hook = "Mark forbidden corners on a quarter-plane grid, rule out everything up and to the right of each, and find every place that survives however far the grid extends."
concepts = ["partitions", "divisibility", "listing-cases", "quotients"]
uses = ["coordinates"]
mechanisms = ["every-case", "construct", "counterexample"]
bands = ["2-3", "4-5"]
gem = "The basis of a polynomial quotient appears as a staircase of surviving grid points: a monomial ideal drawn as a Young diagram."

[[related]]
week = "96"
kind = "same-theorem"
note = "x^a y^b divides x^i y^j exactly when i ≥ a and j ≥ b, the sub-bag test for divisors of 2^i·3^j in Week 96; the forbidden region is the multiples of the corners."

[[related]]
week = "90"
kind = "same-object"
note = "The survivors always form a Young-diagram staircase, the kind of shape Week 90 slides numbers through, and the necessary forbidden corners are exactly the cells that could be added to it."
