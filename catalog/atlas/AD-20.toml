id = "AD-20"
hook = "Multiply small matrices in both orders, use the difference AB − BA as a new operation, and test whether it is associative and what identity replaces associativity."
concepts = ["composition", "groups", "linear-maps"]
uses = []
mechanisms = ["counterexample", "pair-up", "coordinates"]
bands = []
gem = "AB − BA is not associative, yet its three cyclic double brackets always cancel: the Jacobi identity behind Lie algebras."
proposed_concepts = [
  "lie-brackets: The commutator AB − BA as a new operation, its failure of associativity and the Jacobi identity; composition covers only whether order matters",
]

[[related]]
