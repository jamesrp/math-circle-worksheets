id = "AP-21"
hook = "Spend a few battery tokens on dated job offers to earn the most points, then fill a table of the best extra score from every day and battery level, working backward."
concepts = ["backward-induction", "optimization"]
uses = ["listing-cases"]
mechanisms = ["work-backward", "counterexample", "certificate"]
bands = ["2-3", "4-5"]
gem = "Two robots with different pasts but the same day and battery face the same future, so a small table of best extra scores filled backward certifies the optimal plan: Bellman's principle."

[[related]]
