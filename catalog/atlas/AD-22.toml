id = "AD-22"
hook = "Mark edges of a small triangulated square so every corner touches an even number of marks, then flip the three edges of an available face card and ask which patterns can be erased."
concepts = ["holes", "linear-algebra-f2", "parity"]
uses = ["graphs"]
mechanisms = ["invariant", "every-case", "construct"]
bands = ["2-3", "4-5"]
gem = "First homology mod 2 by hand: closed edge patterns counted up to the boundaries of the faces you are allowed to fill."

