id = "GA-15"
hook = "Build a four-square brightness picture from weighted copies of four plus-and-minus sign patterns, then have a partner recover your hidden weights from the picture alone."
concepts = ["groups", "linear-algebra-f2", "fourier", "linear-maps"]
mechanisms = ["pair-up", "construct"]
bands = ["4-5"]
gem = "The four sign patterns are the characters of the group of two switches; dot products with them recover every hidden weight, the smallest Walsh–Hadamard (Fourier) transform."

[[related]]
