id = "GA-21"
hook = "Stretch string from A to a contact point on a mirror segment and on to B, find the contact that uses the least string, then shorten the mirror until the reflected straight line misses it."
concepts = ["reflection", "optimization", "length"]
uses = ["coordinates"]
mechanisms = ["unfold", "certificate"]
bands = ["2-3", "4-5"]
gem = "Reflecting B turns every bent route into a straight one of the same length, and when the mirror is too short the best contact moves to the end nearer the reflected line's crossing."

