id = "AP-01"
hook = "Move a token along a 0–4 track by coin tosses until it reaches a shore, then build a skyline of fair prices in which every inside place balances its two neighbours."
concepts = ["random-walks", "averaging", "expected-value"]
uses = ["equally-likely"]
mechanisms = ["simulate", "limit", "construct"]
bands = ["2-3", "4-5"]
gem = "The winning chance is a discrete harmonic function of the start, so a ferry that keeps every balance changes how long the walk lasts but not who wins."

[[related]]
week = "20"
kind = "same-theorem"
note = "Week 20's stacks must equal the average of their neighbours with the squares fixed; here the fixed values are the two shores and the averaged value is a winning chance, so the unique filling is the exact answer."

[[related]]
week = "91"
kind = "same-theorem"
note = "Week 91's rotor road 0…m sends exactly s of every m counters right from start s, the same s/m as this fair coin walk, but with no randomness."

[[related]]
week = "60"
kind = "same-theorem"
note = "Week 60 finds a best average by conditioning on the next random offer; the fair price here is found the same way, from the first coin toss."
