id = "GA-32"
hook = "Tape one strip into a plain band and one with a half-turn, trace each edge back to its start, and predict what cutting each along its middle line will make before using scissors."
concepts = ["mobius", "surfaces"]
mechanisms = ["unfold", "invariant"]
bands = ["K-1", "2-3", "4-5"]
gem = "A half-turn makes a band with one edge, and cutting it down the middle leaves one piece with two edges, all predicted from the gluing rule before the scissors come out."

