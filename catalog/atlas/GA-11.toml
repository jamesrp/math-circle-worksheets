id = "GA-11"
hook = "Use only the promise f(x + y) = f(x) + f(y) and f(1) = 3 to decide which outputs of an addition machine are forced, and find an input the promise cannot reach."
concepts = ["deduction"]
mechanisms = ["smaller-cases", "construct", "counterexample"]
bands = ["4-5"]
gem = "The addition rule pins down every fraction's output yet leaves √2 free, because √2 cannot be built from 1 by adding and splitting."

[[related]]
week = "89"
kind = "contrast"
note = "Week 89 shows that examples never force the next term; here a universal rule does force every fraction's output, but not √2's."

[[related]]
