id = "AD-11"
hook = "Multiply two-bit symbol cards under a rule where equal terms cancel and t times t is replaced, looking for a partner for each nonzero card whose product is 1."
concepts = ["linear-algebra-f2", "remainders", "finite-fields", "quotients"]
uses = ["parity"]
mechanisms = ["every-case", "counterexample"]
bands = ["4-5"]
gem = "With t² = t + 1 the four cards form a field, which arithmetic mod 4 cannot be because 2 × 2 = 0 there."

[[related]]
week = "2"
kind = "revisits"
note = "Adding cards is Week 2's toggling, where equal terms cancel in pairs; the new question is a multiplication that gives every nonzero card an inverse."

[[related]]
week = "4"
kind = "same-theorem"
note = "Week 4's hop reaches every dot exactly when multiplying by it loses nothing mod n; here multiplication by t either collides (t² = t) or permutes the four cards (t² = t + 1)."

[[related]]
week = "36"
kind = "contrast"
note = "Week 36's nine tiles are a plane over the integers mod 3, a field because 3 is prime; four symbols cannot be the integers mod 4, so this field is built from polynomials."
