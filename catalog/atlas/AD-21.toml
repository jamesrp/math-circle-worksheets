id = "AD-21"
hook = "Pair person cards with badge cards of matching colour, list every compatible pair once in a catalog, and show that any token carrying a person and a matching badge has exactly one place in it."
concepts = ["listing-cases", "multiplying-choices", "bijection"]
uses = []
mechanisms = ["every-case", "construct", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
gem = "The pullback: a catalog of matching pairs earns its name by giving every compatible token exactly one place, which fixes the catalog up to a unique bijection."
proposed_concepts = [
  "universal-properties: Constructions characterized by a unique map from every competitor, such as products and pullbacks; bijection and multiplying-choices are only the nearest ids",
]

[[related]]
week = "27"
kind = "contrast"
note = "Week 27 pairs each letter with exactly one partner; the catalog keeps every matching-colour pair, so one person can appear in many entries."

[[related]]
week = "96"
kind = "same-theorem"
note = "For each colour the catalog has (people of that colour) × (badges of that colour) entries, the product rule that counts Week 96's divisors as independent choices."
