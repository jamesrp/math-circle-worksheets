id = "AD-16"
hook = "Place counters on a five-by-five grid of remainders wherever y·y and a cubic in x leave the same remainder after dividing by 5, and find every such point without testing all 25."
concepts = ["square-remainders", "groups", "finite-fields", "diophantine-equations"]
uses = ["coordinates"]
mechanisms = ["every-case", "pair-up", "construct"]
bands = ["4-5"]
gem = "Counting points mod 5 needs only a table of squares, and the chord-and-tangent rule makes the finite set of dots a group."

[[related]]
week = "97"
kind = "same-theorem"
note = "Week 97's pairing x² = y² exactly when x = y or x + y = p is why a column whose value is a nonzero square holds exactly two points, (x, y) and (x, −y)."

[[related]]
week = "36"
kind = "same-object"
note = "Week 36's nine tiles are the plane over the integers mod 3 with its lines; here the plane mod 5 holds a curve instead of lines."

[[related]]
week = "4"
kind = "same-theorem"
note = "Adding one point again and again walks an orbit that returns, like hopping round Week 4's ring; when the orbit visits every point, point addition is clock arithmetic."
