id = "AP-24"
hook = "Make each new generation of two counters by drawing parent colours with replacement from the old generation, and watch a fair copying rule eventually erase a colour."
concepts = ["random-walks", "expected-value", "limits"]
uses = ["equally-likely", "multiplying-choices"]
mechanisms = ["simulate", "invariant", "limit"]
bands = ["2-3", "4-5"]
gem = "The expected number of red counters never changes, yet the chance of staying mixed halves every generation, so almost every history ends with one colour: a mean is not a typical history."

[[related]]
week = "44"
kind = "contrast"
note = "Week 44's copying bag adds a counter each draw and never loses a colour; redrawing a whole generation from the old one makes loss certain in the long run, though both keep the expected red share."

[[related]]
week = "46"
kind = "same-theorem"
note = "Week 46's random cards set every slot eventually, yet no fixed number of draws guarantees it; here losing a colour has probability 1, yet no finite generation makes it certain."
