id = "GA-24"
hook = "Delete single points from a loop, a segment, a Y and a figure-eight, count the pieces left, and use the counts to test whether a loop can be reshaped into a segment."
concepts = ["graphs", "holes", "connectedness"]
mechanisms = ["invariant", "every-case", "counterexample"]
bands = ["2-3", "4-5"]
gem = "Removing one point never disconnects a circle, but removing any inside point cuts a segment in two, so no stretching without cutting or gluing turns one into the other."

[[related]]
week = "68"
kind = "same-theorem"
note = "Week 68 deletes dots and counts the pieces that go on forever to tell lines, ladders, grids and trees apart; here deleting one point and counting pieces tells a loop from a segment."

[[related]]
week = "40"
kind = "same-theorem"
note = "Both prove that no allowed deformation turns one object into another by a count the deformation cannot change: colourings there, pieces after a puncture here."

[[related]]
week = "38"
kind = "contrast"
note = "Week 38 cuts surfaces along a whole line and counts pieces and edges; GA-24 removes a single point, and the count is a property every reshaping must keep."
