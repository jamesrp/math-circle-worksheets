id = "AP-07"
hook = "Apply 'new difference = old difference minus h times old difference' over and over to a cooling model and sort step sizes into ones that cool, oscillate or blow up."
concepts = ["iteration", "limits", "derivatives"]
uses = ["coordinates"]
mechanisms = ["every-case", "counterexample", "certificate"]
bands = []
gem = "Forward Euler turns y′ = −y into multiplying by 1 − h each step, so stability is a question about powers of one number, and a run can settle while still being badly inaccurate."

