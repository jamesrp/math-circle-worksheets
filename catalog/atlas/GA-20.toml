id = "GA-20"
hook = "Choose speeds for the parts of a fixed-time journey, pay each part its duration times speed squared, and test whether rushing and then resting can cost less than moving steadily."
concepts = ["optimization", "coordinates", "integrals"]
mechanisms = ["certificate", "construct"]
bands = ["4-5"]
gem = "Writing any rival as steady motion plus a detour shows its extra cost is the detour's own squared bill, a calculus-of-variations proof by completing the square."

[[related]]
week = "93"
kind = "same-theorem"
note = "Week 93's average-side square beats the rectangle by exactly ((b − a)/2)²; the same completed square shows equal speeds beat unequal ones here."

[[related]]
