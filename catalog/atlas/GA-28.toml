id = "GA-28"
hook = "Hunt for an unknown number by asking only 'which side of this number?', decide what bracket to keep after each answer, and compare with a fast tangent method that can loop forever."
concepts = ["information", "limits", "algorithms", "continuity"]
mechanisms = ["invariant", "certificate", "counterexample"]
bands = ["4-5"]
gem = "Halving keeps a guaranteed bracket, an adversary shows no comparison strategy beats width 1/2^k, and Newton's faster tangent method cycles 0 → 1 → 0 forever on x³ − 2x + 2."

[[related]]
week = "6"
kind = "same-theorem"
note = "Week 6's bound that k yes/no answers separate at most 2^k cases is the adversary proof here that four comparisons cannot guarantee a bracket narrower than 1/16."

[[related]]
week = "93"
kind = "contrast"
note = "Week 93's average-side reshaping is Heron's (Newton's) method for √A and always closes in; GA-28 shows the same tangent idea can cycle forever on a cubic, while halving never fails."
