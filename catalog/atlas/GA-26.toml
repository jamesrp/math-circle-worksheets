id = "GA-26"
hook = "Colour the sections of a knot drawing with three colours so every crossing is all one colour or all three, and use the colourings to decide which cords can become a plain loop."
concepts = ["knots", "listing-cases"]
mechanisms = ["invariant", "every-case", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
gem = "A local rule at each crossing gives a global certificate: the trefoil has 9 three-colourings and the plain loop only 3, so no wiggling unties it."

