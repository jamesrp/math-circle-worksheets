id = "AD-06"
hook = "Find the lowest tile above two tiles and the highest tile below them on small order diagrams, and test whether two calculation recipes always give the same tile."
concepts = ["posets", "subsets"]
uses = []
mechanisms = ["counterexample", "every-case"]
bands = ["2-3", "4-5"]
gem = "The five-tile diamond has every meet and join yet breaks distributivity; it is one of the two smallest lattices that do."
proposed_concepts = [
  "lattices: Meets and joins — orders in which every pair has a greatest lower and a least upper bound, and when the two operations distribute; posets covers chains and antichains but not these operations",
]

