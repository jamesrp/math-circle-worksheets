id = "GA-25"
hook = "Close roads on a grid of rooms until every room is still reachable but no loop survives, then prove that no one can manage with fewer closures."
concepts = ["trees", "holes", "euler-formula"]
mechanisms = ["certificate", "smaller-cases", "invariant"]
bands = ["K-1", "2-3", "4-5"]
gem = "However you choose them, the number of roads to close is always E − V + 1, and the closed roads themselves form a tree linking the courtyards to the outside."

[[related]]
week = "53"
kind = "revisits"
note = "Week 53 buys a cheapest spanning tree and improves it by one-road swaps; GA-25 counts the closures every spanning tree needs and finds the fewest swaps between two mazes."

[[related]]
week = "52"
kind = "same-theorem"
note = "In Week 52 a brace is removable exactly when its link lies on a loop of the row–column graph, the same loop rule that decides which roads can close here."

[[related]]
week = "56"
kind = "same-theorem"
note = "Week 56 proves Euler's formula by erasing loop edges down to a tree; GA-25's courtyard page reads the removed roads as a tree linking the faces."

