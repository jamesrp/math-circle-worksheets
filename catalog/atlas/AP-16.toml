id = "AP-16"
hook = "Make all sixteen red/blue rows of four counters, count agreeing neighbours, give each row a raffle weight of 1, 2, 4 or 8, and compare aligned rows with the more numerous mixed ones."
concepts = ["equally-likely", "bijection", "multiplying-choices"]
uses = ["listing-cases", "conditional-probability", "parity"]
mechanisms = ["every-case", "construct"]
bands = ["2-3", "4-5"]
gem = "Recording a row by its first spin and three agree/disagree links turns the 54-unit raffle into independent choices, each link agreeing with chance 2/3: an exact sampler for a tiny Ising model."

[[related]]
week = "43"
kind = "same-theorem"
note = "Week 43 builds a fair shuffle from small independent draws with exactly one story per order; here a weighted sampler comes from one story per row, a first spin and three link choices."

[[related]]
week = "2"
kind = "same-theorem"
note = "Mod-2 bookkeeping on a path versus a ring, as in Week 2: links record where neighbouring spins differ, every link record is possible on an open row, but around a ring the disagreements must be even."
