id = "AP-27"
hook = "Hide two amounts that halve or quarter each tick behind a sensor that reports only their total, and decide when the readings reveal the original split."
concepts = ["inference", "measurement-error", "linear-maps"]
uses = []
mechanisms = ["counterexample", "construct"]
bands = ["4-5"]
gem = "With equal decay rates every reading is the total halved again, so no amount of watching splits it; unequal rates turn two readings into two independent equations, though nearly equal rates make recovery very sensitive to error."

[[related]]
week = "94"
kind = "same-theorem"
note = "Week 94's repeated readings cannot separate an object from a shared offset, while a known reference can; equal decay rates hide the split the same way, and unequal rates act as the second reference."

[[related]]
week = "25"
kind = "revisits"
note = "Week 25 asks when row and column totals pin down a picture; here a stream of totals over time pins down two amounts exactly when the decay rates differ."

[[related]]
week = "6"
kind = "contrast"
note = "Week 6 chooses each question freely to locate a secret; here the questions are fixed by the system's own evolution and the sensor's design."
