id = "AP-20"
hook = "Make two kinds of products from limited red and blue counters to earn the most points, then put prices on the counters that prove no plan can earn more."
concepts = ["optimization", "listing-cases"]
uses = []
mechanisms = ["certificate", "every-case", "counterexample"]
bands = ["2-3", "4-5"]
gem = "Prices of 2/3 for red and 5/3 for blue make each recipe's ingredients worth at least its sale value and the whole stock worth exactly 10, so a few lines of arithmetic prove the 10-point plan best: weak linear-programming duality."

