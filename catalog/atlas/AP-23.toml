id = "AP-23"
hook = "Three travellers each put a counter on a crowded quick road or a steady road, switch only when it lowers their own cost, and compare where everyone stops with the cheapest arrangement for the group."
concepts = ["optimization", "equilibria"]
uses = ["listing-cases", "graphs"]
mechanisms = ["every-case", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
gem = "A switch that helps one traveller can raise the group's total, so the arrangement where nobody wants to move need not be the cheapest; once ties count as moves, travellers can circle through all six arrangements forever."

[[related]]
week = "27"
kind = "contrast"
note = "Week 27's stable pairings rule out two letters who both gain by leaving together; stability here rules out only one traveller switching alone, and again stable need not mean best."

