id = "AP-04"
hook = "Draw card numbers from a sampler that sees only some of the population, and invent two hidden worlds that no number of its readings could tell apart."
concepts = ["inference", "expected-value"]
uses = ["equally-likely"]
mechanisms = ["counterexample", "every-case"]
bands = ["4-5"]
gem = "A million readings from a restricted frame estimate the wrong number ever more precisely: repetition shrinks noise but cannot remove a systematic gap."

[[related]]
week = "95"
kind = "same-object"
note = "Week 95 also infers a hidden population from catches and finds the data give no upper bound; here the sampling frame hides part of the population, so the gap never closes."

[[related]]
week = "94"
kind = "same-theorem"
note = "Week 94's shared offset cancels from every difference of readings, so repetition cannot reveal it; a restricted frame is the same kind of unidentifiable systematic error."

