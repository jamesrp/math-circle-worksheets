id = "AP-02"
hook = "Pick a bag by coin, draw a counter, and set aside the bag-and-counter cards that a 'red' report rules out to see which bag the clue favours."
concepts = ["conditional-probability", "inference"]
uses = ["equally-likely", "listing-cases"]
mechanisms = ["every-case", "construct"]
bands = ["2-3", "4-5"]
gem = "The same word 'red' gives bag A chance 2/3 from a random draw but 1/2 from a messenger who shows red whenever one is present: a clue means nothing without the process that produced it."

