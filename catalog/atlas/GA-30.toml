id = "GA-30"
hook = "Tape a 6-by-4 rectangle into a cylinder, find string routes from a bottom-rim point to the top point halfway around, and unroll it to find every shortest route."
concepts = ["surfaces", "length", "winding"]
mechanisms = ["unfold", "certificate", "every-case"]
bands = ["2-3", "4-5"]
gem = "On a cylinder that is flat everywhere, two different straight routes tie for shortest, because unrolling gives the far point a row of copies and two are equally near."

[[related]]
week = "75"
kind = "same-object"
note = "Week 75 classifies arcs between rim marks of a paper cylinder by which copy of B a lift reaches; GA-30 uses the same copies to find the shortest arcs."

[[related]]
week = "70"
kind = "same-theorem"
note = "Week 70 unfolds a portal room into copies of T to find every shot; here unrolling gives B a row of copies, and the nearest two give the shortest routes."

[[related]]
week = "61"
kind = "contrast"
note = "On Week 61's ball, opposite points have infinitely many shortest strings because the surface curves; on the flat cylinder two routes tie because the surface wraps."
