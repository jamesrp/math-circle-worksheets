id = "GA-13"
hook = "Lay a movable line over the parabola y = x² on [−1, 1], make its worst vertical gap as small as possible, and look for a proof that no line does better."
concepts = ["optimization", "coordinates", "function-distance"]
mechanisms = ["certificate", "construct"]
bands = ["4-5"]
gem = "Three points where the error reaches its maximum with alternating signs certify the best line everywhere (Chebyshev equioscillation), and the winner y = 1/2 does not tilt at all."

[[related]]
week = "73"
kind = "same-theorem"
note = "Week 73 also minimises a worst case, the largest stretch of a map, and certifies the optimum with a forced pair; here three alternating worst errors certify the best line."

