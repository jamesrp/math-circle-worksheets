id = "AP-05"
hook = "Slide a three-point strip around each noisy reading of a hidden number and audit all five possible errors to see how often the strip catches the secret."
concepts = ["inference", "measurement-error", "equally-likely"]
uses = ["listing-cases"]
mechanisms = ["every-case", "invariant", "certificate"]
bands = ["4-5"]
gem = "Coverage is a promise about the procedure, not about one interval: a rule with honest 50% coverage can report a single point that is certainly wrong."

[[related]]
week = "51"
kind = "revisits"
note = "Week 51's ranges always contain the truth because errors are bounded; here a random error and a narrower strip trade certainty for a stated coverage fraction, and the 100% rule needs the bound."

[[related]]
week = "94"
kind = "same-object"
note = "Readings modelled as true value plus error: Week 94 asks what calibration can identify, this family what an interval rule can promise about one fixed unknown."
