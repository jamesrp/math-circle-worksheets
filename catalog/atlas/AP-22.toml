id = "AP-22"
hook = "Play a secret-choice scoring game, then design a bag of U and D slips that earns a guaranteed average even against a rival who knows the bag's recipe."
concepts = ["expected-value", "optimization", "equilibria"]
uses = ["equally-likely"]
mechanisms = ["certificate", "construct"]
bands = ["2-3", "4-5"]
gem = "A bag of one U and two D slips guarantees Row an average of 2/3 whatever Column does, and Column's bag of one L and two R holds Row to 2/3, so the two bags together certify the value of the game."

[[related]]
week = "24"
kind = "contrast"
note = "Week 24's decks beat each other in a circle, so no deck is safe to pick first; no pure choice is safe here either, but a mixture of choices has a guaranteed value."

[[related]]
week = "7"
kind = "contrast"
note = "Week 7's take-away games have open moves and a winner found by working backward; simultaneous secret choices call for randomizing instead."

