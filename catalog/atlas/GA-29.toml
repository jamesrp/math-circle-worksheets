id = "GA-29"
hook = "Erase the middle third of every surviving piece of a strip round after round, give each surviving piece an L/R address, and decide whether all the length can vanish while points remain."
concepts = ["place-value", "limits", "measure-zero", "diagonal-argument"]
mechanisms = ["limit", "every-case", "pair-up"]
bands = ["2-3", "4-5"]
gem = "After infinitely many rounds no length is left, yet the surviving points match every endless L/R address, more points than any list can hold."

[[related]]
week = "6"
kind = "same-theorem"
note = "Each L/R letter picks one of two pieces like a yes/no answer in Week 6, so four letters name exactly one of 16 pieces."

[[related]]
week = "82"
kind = "contrast"
note = "Week 82's endless lines can all be matched with the counting numbers; GA-29's surviving points cannot be listed at all, though they have no length."

[[related]]
week = "48"
kind = "contrast"
note = "Week 48 covers a shape with squares to trap its area; here the surviving pieces themselves are a cover whose total length falls below every bound."
