id = "AP-29"
hook = "Give four picture messages binary codewords at the leaves of a branching tree so a receiver can decode a string with no spaces, and beat sixteen bits when one picture is common."
concepts = ["information", "trees", "optimization"]
uses = ["listing-cases"]
mechanisms = ["every-case", "up-to-symmetry", "certificate"]
bands = ["2-3", "4-5"]
gem = "A prefix code is a set of leaves, so the best code for counts 4, 2, 1, 1 is found by checking the two full tree shapes with four leaves: lengths 1, 2, 3, 3 send 14 bits, and equal counts make the balanced tree win instead."

[[related]]
week = "6"
kind = "same-object"
note = "Week 6's yes/no question trees locate a secret in the fewest questions in the worst case; the same binary trees here are weighted by how often each leaf is used."

[[related]]
week = "12"
kind = "same-object"
note = "Week 12 counts ordered trees; here the full binary trees with four leaves matter, five with left and right distinguished and two shapes up to mirror flips."

[[related]]
week = "18"
kind = "contrast"
note = "Week 18 adds redundancy so a flipped counter can be repaired; here redundancy is removed so common messages cost fewer bits."
