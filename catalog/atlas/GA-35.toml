id = "GA-35"
hook = "Evaluate x² − y² at four equally spaced points on a circle, compare their average with the value at the centre, and move or turn the circle to try to break the pattern."
concepts = ["averaging", "coordinates"]
mechanisms = ["pair-up", "coordinates", "counterexample"]
bands = ["4-5"]
gem = "For x² − y² four samples on any circle average exactly to the centre value, and a quadratic does this exactly when its x² and y² coefficients cancel: its Laplacian is zero."

[[related]]
week = "20"
kind = "same-theorem"
note = "x² − y² at the four grid neighbours of any point averages to its centre value, so on a square grid it is one of Week 20's averaging fillings; the circle version here is its continuous counterpart."

[[related]]
week = "89"
kind = "same-theorem"
note = "Squares grow by layers whose sizes rise by 2 each time (Week 89); for x² − y² those second differences are +2 across and −2 up, which is why the four samples cancel."
