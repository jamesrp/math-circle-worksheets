id = "GA-03"
hook = "Promise a rule that gives every point an opponent names, one after another forever, a covering strip, while the strips' widths add up to less than a tiny budget."
concepts = ["infinite-processes", "limits", "length", "measure-zero"]
mechanisms = ["construct", "limit"]
bands = ["4-5"]
gem = "Infinitely many points, even every fraction between 0 and 1, fit under strips whose total length is as small as you like."

[[related]]
week = "80"
kind = "same-theorem"
note = "Week 80's counter moves halfway to END each time and never passes it; the widths ε/2, ε/4, … here stay under the budget for the same reason."

[[related]]
week = "48"
kind = "revisits"
note = "Week 48 traps an area between finitely many inside and outside squares; GA-03 covers with infinitely many intervals and finds the total can be made as small as you like."

[[related]]
week = "82"
kind = "revisits"
note = "Week 82 matches endless lines kid for kid; GA-03's continuation puts every fraction into one endless list and covers the whole list."
