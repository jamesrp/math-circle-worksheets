id = "GA-07"
hook = "Build a polynomial machine that receives only the horizontal coordinate of an angle arrow and outputs the horizontal coordinate of three times the angle, choosing test angles that could expose a wrong guess."
concepts = ["recurrence", "angles", "coordinates", "polynomials"]
mechanisms = ["smaller-cases", "counterexample"]
bands = []
gem = "cos 3θ is a polynomial in cos θ, and the angle-multiplying polynomials compose by multiplying their angles: T_m(T_n(x)) = T_mn(x)."

