id = "AP-15"
hook = "Build probability trees for a two-arrow quantum state asked a Z question and an X question in both orders, replacing the state card after each answer, and compare how often Z says e1."
concepts = ["conditional-probability", "composition", "linear-maps"]
uses = ["coordinates", "angles"]
mechanisms = ["every-case", "counterexample", "certificate"]
bands = []
gem = "A Z answer that was certain becomes a coin flip once an X question is asked in between, even if the X result is never recorded: measurement updates the state, so the two questions do not commute."

[[related]]
week = "3"
kind = "contrast"
note = "Week 3 composes deterministic rearrangements and finds that order matters; here the operations are measurements, and the order changes outcome probabilities."

[[related]]
week = "45"
kind = "contrast"
note = "Week 45 updates chances by keeping the cases consistent with a clue; a quantum answer also replaces the state, so classical filtering of cases gives the wrong branch probabilities."
