id = "AP-28"
hook = "Send one of four messages as a five-bit strip while a partner secretly flips at most one bit, design a decoding rule that always recovers it, and show four bits can never be enough."
concepts = ["codes", "information"]
uses = ["listing-cases"]
mechanisms = ["construct", "pigeonhole", "certificate"]
bands = ["K-1", "2-3", "4-5"]
gem = "Codewords three flips apart have disjoint one-flip neighbourhoods of n + 1 words, so four messages need 4(n + 1) ≤ 2ⁿ, which rules out four bits; the code 00000, 11100, 10011, 01111 works with five."

[[related]]
week = "18"
kind = "revisits"
note = "Week 18 proves the same five-counter bound with filled and empty counters; this family adds what a decoder can conclude when the one-flip promise fails, and detection with three bits."

[[related]]
week = "6"
kind = "revisits"
note = "Week 6's match scores are n minus the Hamming distance to the secret; here the same distance, between codewords, decides whether a flip can be undone."
