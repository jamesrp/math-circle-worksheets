id = "GA-33"
hook = "Compare a system obeying y′ = 1 − y from different starting values, and test whether a transform shortcut that forgets the start can be right."
concepts = ["differences-sums", "limits", "differential-equations", "fourier"]
mechanisms = ["counterexample", "construct"]
bands = []
gem = "The Laplace transform turns a rate law into algebra only because L(y′) = sY − y(0) carries the starting value; drop that term and every start gets the same wrong answer."

