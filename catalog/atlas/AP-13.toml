id = "AP-13"
hook = "Add the signed heights of two wave strips point by point and find that adding a second wave can make a detector's reading dimmer."
concepts = ["coordinates", "inference", "fourier"]
uses = ["angles"]
mechanisms = ["coordinates", "construct"]
bands = ["4-5"]
gem = "Coherent waves add amplitudes, not brightnesses, so brightness 5 + 4 cos φ ranges from 1 to 9; one reading leaves two possible phases, and a second reading with a known reference wave separates them."

[[related]]
week = "94"
kind = "same-theorem"
note = "Week 94's readings cannot separate object from offset until a known reference is used; one brightness here leaves two phases, and adding a known reference wave identifies the right one."

[[related]]
week = "2"
kind = "contrast"
note = "Week 2's presses cancel in pairs because flips add mod 2; waves add signed heights, so it takes an opposite wave of equal size to cancel."
