id = "GA-31"
hook = "Lay strips for everyone's allowed meeting interval on a number line, check that every pair overlaps, and try to make the whole group fail to share a point."
concepts = ["convexity", "listing-cases"]
mechanisms = ["extremal", "counterexample", "certificate"]
bands = ["2-3", "4-5"]
gem = "On a line, pairwise agreement forces a common point, witnessed by just the latest start and the earliest finish; in the plane every triple must agree (Helly's theorem)."

[[related]]
week = "22"
kind = "revisits"
note = "Week 22 asks when two hulls from four points must touch; the planar continuation here asks when many convex regions share a point, a step usually proved with Week 22's Radon theorem."

[[related]]
week = "51"
kind = "same-object"
note = "Week 51 also works with intervals [L, U] on a ruler, asking how they combine under addition; here the question is whether they share a point."
