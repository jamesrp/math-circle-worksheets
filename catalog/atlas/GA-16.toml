id = "GA-16"
hook = "Slide a short paper window across a long one, predict the whole graph of their overlap length against position, and choose window lengths that make the graph a triangle or a trapezoid."
concepts = ["length", "sumsets", "coordinates", "fourier"]
mechanisms = ["every-case", "construct"]
bands = ["2-3", "4-5"]
gem = "The overlap graph of two sliding windows is their convolution, a trapezoid for unequal windows and a triangle for equal ones, drawn before any integral."

[[related]]
week = "55"
kind = "same-theorem"
note = "Counting how many pairs in Week 55's addition table give each total is the whole-number version of this overlap graph (a convolution), and the totals that occur form the sumset."

[[related]]
week = "51"
kind = "same-theorem"
note = "Week 51's sum range [L + V, U + W] is exactly where this overlap graph is positive."
