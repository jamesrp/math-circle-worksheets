id = "GA-04"
hook = "Move a target arrow once around a dial while steering a root arrow whose doubled angle always points at the target, never letting it jump, and see where the root ends up."
concepts = ["winding", "parity", "continuity", "complex-numbers"]
mechanisms = ["unfold", "invariant", "counterexample"]
bands = ["4-5"]
gem = "Following a square root once around the circle brings back the opposite root, the first glimpse of a Riemann surface."

[[related]]
week = "38"
kind = "same-theorem"
note = "An arrow carried once round Week 38's Möbius band returns reversed, as the tracked root returns as its opposite: both are a two-sheeted cover of a circle that does not come apart."

[[related]]
week = "41"
kind = "same-theorem"
note = "Week 41 lifts a portal trip to copies of the board and reads its winding; here the running angle lifts the target's trip, and its number of net turns decides whether the root comes back."

[[related]]
week = "75"
kind = "same-theorem"
note = "Week 75 counts an arc's winding by signed seam crossings; the root comes back exactly when the target's winding is even."
