id = "GA-01"
hook = "Give a box with coloured faces quarter-turns about fixed room axes, reverse the order of two turns, and hunt for a short turn word that brings one face home but not the other."
concepts = ["composition", "groups", "symmetry"]
uses = ["coordinates"]
mechanisms = ["counterexample", "every-case"]
bands = ["2-3", "4-5"]
gem = "Two quarter-turns of a box already show that rotations of space, unlike turns of a plane about one centre, depend on their order."

