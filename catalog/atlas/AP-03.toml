id = "AP-03"
hook = "Keep the score cards fixed, move the 'trained' clips through every assignment the design allowed, and count how often chance alone makes a trained group look as strong as the real one."
concepts = ["inference", "equally-likely", "binomial"]
uses = ["listing-cases"]
mechanisms = ["every-case", "pair-up"]
bands = ["4-5"]
gem = "An exact test needs no bell curve: if training changed nothing, the scores stay put and only labels move, so the equally likely assignments are the whole reference distribution."

