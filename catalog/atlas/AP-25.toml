id = "AP-25"
hook = "Trade one A and two B counters for one C, or back, list every collection you can reach, and invent weighted totals that no trade can change."
concepts = ["listing-cases", "graphs", "balance-laws", "linear-maps"]
uses = []
mechanisms = ["invariant", "every-case", "construct"]
bands = ["2-3", "4-5"]
gem = "A + C and B + 2C never change although the number of counters does, and for this reaction they decide reachability; for 2A ↔ 2B a parity test is needed as well."

[[related]]
week = "25"
kind = "same-theorem"
note = "Week 25's switches keep every row and column count and connect all pictures with the same counts; trades here keep A + C and B + 2C, and those totals likewise decide which collections are reachable."

[[related]]
week = "2"
kind = "same-theorem"
note = "Week 2's lamp targets are reachable exactly when a parity count allows; here weighted totals over whole numbers play that role, and 2A ↔ 2B needs a parity invariant too."

[[related]]
week = "11"
kind = "contrast"
note = "Week 11's weighted chip score drops at every share, which proves termination; weighted totals here stay exactly fixed, which proves some collections unreachable."
