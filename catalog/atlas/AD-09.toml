id = "AD-09"
hook = "Advance two small clocks of different sizes together one step at a time and decide which pairs of readings can occur at the same moment, and when."
concepts = ["remainders", "gcd", "lcm"]
uses = ["divisibility"]
mechanisms = ["every-case", "construct"]
bands = ["2-3", "4-5"]
gem = "The Chinese remainder theorem as two clocks: two readings can occur together exactly when they agree modulo the gcd, and then they recur every lcm steps."

[[related]]
week = "4"
kind = "revisits"
note = "Week 4's hops follow one remainder orbit; here two orbits must agree at the same time."

[[related]]
week = "3"
kind = "same-theorem"
note = "Loops of 2 and 3 in Week 3 return together after 6; two clocks first read 0 together after the lcm of their sizes."

[[related]]
week = "9"
kind = "same-theorem"
note = "Week 9's ball reaches a corner when both coordinates hit walls together, after an lcm of steps, the joint return of two cycles that the clocks show."

[[related]]
week = "29"
kind = "contrast"
note = "Week 29 builds lengths ax + by with x, y ≥ 0; the general solver here needs whole numbers u, v of either sign with uM + vN = 1 (Bézout)."
