id = "GA-17"
hook = "Look for a graph whose height is a given function plus λ times its own average height, and find how turning the dial λ gives one solution, none, or infinitely many."
concepts = ["area", "averaging", "integrals"]
mechanisms = ["every-case", "construct"]
bands = []
gem = "An equation for a whole unknown graph collapses to one equation for one number, its mean, so λ = 1 decides between no solution and infinitely many: the Fredholm alternative in miniature."

[[related]]
week = "2"
kind = "same-theorem"
note = "Week 2's lamp puzzles are solvable exactly when a parity condition holds, and solutions then come in complementary pairs; here a mean condition decides solvability at λ = 1 and solutions differ by constants, both instances of the Fredholm alternative."

[[related]]
week = "20"
kind = "contrast"
note = "Week 20 ties each value to its neighbours' average; here a whole graph is tied to its own single average, which reduces the problem to one number."
