id = "AD-04"
hook = "Join four numbered cards with strings into a tree, remove the smallest leaf again and again while writing down its neighbour, and see whether a partner can rebuild the tree from the two-number message."
concepts = ["trees", "bijection", "algorithms"]
uses = ["graphs"]
mechanisms = ["pair-up", "smaller-cases"]
bands = ["2-3", "4-5"]
gem = "Prüfer's code turns Cayley's count n^(n−2) into a message: each of the 16 two-number words on four labels names exactly one tree."

[[related]]
week = "12"
kind = "same-theorem"
note = "Both prove a count with an encoding whose decoding is forced: Week 12 between Catalan families, here between labelled trees and words of length n − 2."

[[related]]
week = "53"
kind = "same-object"
note = "Trees on fixed labelled places again: Week 53 prices them to find the cheapest, here every tree on four labels gets a two-number name."

[[related]]
week = "6"
kind = "contrast"
note = "Week 6 shows k yes/no answers separate at most 2^k possibilities; here the 16 two-number messages are exactly as many as the 16 trees, and the code uses every one."
