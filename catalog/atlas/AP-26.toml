id = "AP-26"
hook = "Move a position marker by the opposite of the previous tick's report, keeping old and current cards, and find that reaching zero does not mean staying there."
concepts = ["iteration", "limits"]
uses = ["coordinates"]
mechanisms = ["counterexample", "every-case", "limit"]
bands = ["4-5"]
gem = "With a one-tick-old report, full correction turns the (old, current) pair through a six-step orbit, a rotation on a triangular grid, while halving the correction multiplies the whole pair by −1/4 every four ticks."

[[related]]
week = "3"
kind = "revisits"
note = "As with Week 3's shuffle machines, the tick rule is reversible and states return: every nonzero (old, current) pair comes back after exactly six ticks."

[[related]]
week = "49"
kind = "contrast"
note = "Week 49's four-tower difference game reaches all zeros and stays there; the delayed controller reaches zero and leaves again, because one reading is not the whole state."
