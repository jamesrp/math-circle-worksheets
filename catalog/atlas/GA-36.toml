id = "GA-36"
hook = "Feed a machine's output back in as its next input, compare a machine that homes in on its unchanged number with one that flips back and forth forever, and draw both against the diagonal of a unit square."
concepts = ["iteration", "limits", "continuity"]
mechanisms = ["limit", "counterexample", "certificate"]
bands = ["4-5"]
gem = "Every continuous machine from [0, 1] to itself has an unchanged input, yet feedback may never find it: 1 − x flips 0 and 1 forever around its fixed point 1/2."

[[related]]
week = "16"
kind = "same-theorem"
note = "Sperner's lemma is the counting proof of Brouwer's fixed-point theorem, and GA-36's endpoint sign argument is its one-dimensional case."

[[related]]
week = "49"
kind = "contrast"
note = "Week 49's four-tower rule always reaches zero while three stations can cycle; here a contraction always closes in on its fixed point and 1 − x cycles around 1/2 forever."

[[related]]
week = "93"
kind = "same-theorem"
note = "Week 93's gap more than halves at each reshaping, the same geometric shrinking of error that the contraction (x + 1)/3 gives here."
