id = "GA-19"
hook = "Design a function whose graph stays within a tiny height of zero on [0, 1] but whose slope reaches at least 1, to defeat any claimed bound on slope from height."
concepts = ["stretch-maps", "slope-limits", "function-distance", "derivatives"]
mechanisms = ["counterexample", "construct"]
bands = []
gem = "x^n/n shrinks to nothing while its slope at 1 stays exactly 1, so differentiation can magnify an arbitrarily small error."

[[related]]
week = "50"
kind = "same-theorem"
note = "Week 50's staircases hug the diagonal while their length stays 280 mm; here a graph hugs zero while its slope stays 1, so closeness of graphs controls neither length nor slope."

[[related]]
week = "73"
kind = "contrast"
note = "Week 73 finds a map's least possible worst stretch; differentiation has no finite stretch bound at all."
