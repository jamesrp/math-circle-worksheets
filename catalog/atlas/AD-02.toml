id = "AD-02"
hook = "Read a list of four-counter patterns, build a pattern that differs from every row, and find a method that beats any list a partner writes."
concepts = ["bijection", "words", "infinite-processes", "diagonal-argument"]
uses = []
mechanisms = ["construct", "pair-up", "counterexample"]
bands = ["2-3", "4-5"]
gem = "Cantor's diagonal argument with four counters: the rule that beats every finite list also shows that the endless 0/1 sequences cannot all be listed."

[[related]]
week = "6"
kind = "same-object"
note = "Week 6's rows of two-colour counters return, but here the task is to build a pattern absent from a list rather than to find a hidden one."

[[related]]
week = "18"
kind = "contrast"
note = "Week 18 needs codewords that differ in many places to survive flips; here one mismatch with each row is enough to prove a pattern is new."

[[related]]
week = "82"
kind = "contrast"
note = "Week 82 matches endless lines kid for kid; the diagonal rule shows the endless 0/1 patterns cannot be matched with the rows of any list."
