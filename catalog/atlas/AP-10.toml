id = "AP-10"
hook = "Join ideal springs end to end or side by side, decide which quantity the springs share, and predict how far a load stretches each arrangement."
concepts = ["listing-cases", "recurrence", "series-parallel"]
uses = ["bijection"]
mechanisms = ["smaller-cases", "every-case", "pair-up"]
