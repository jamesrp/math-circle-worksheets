area = "networks"
requires = ["graphs"]
about = "End-to-end parts add their stretches and side-by-side parts add their stiffness: springs, resistors and the reductions that combine them."

[concepts.fair-division]
name = "Fair division"
area = "games"
about = "Cake cutting: proportional and envy-free shares."

[concepts.voting]
name = "Voting rules"
area = "games"
about = "How the choice of rule and agenda changes the winner."

[concepts.optimal-transport]
name = "Optimal transport"
area = "games"
requires = ["matchings", "optimization"]
about = "The cheapest way to move piles to holes."

[concepts.equilibria]
name = "Equilibria"
area = "games"
requires = ["optimization"]
about = "Choices where no single player gains by switching alone, from selfish routing to mixed strategies."

# ---------------------------------------------------------------- chance: infinity
[concepts.infinite-processes]
name = "Infinite processes"
area = "chance"
about = "Tasks with infinitely many steps, and what can be said after all of them."

[concepts.limits]
name = "Limits"
area = "chance"
requires = ["infinite-processes"]
about = "Values a sequence settles toward, and sequences that never settle."

[concepts.ordinals]
name = "Ordinals"
area = "chance"
requires = ["infinite-processes"]
about = "Counting past infinity: ω, ω + 1 and order types of endless lines."

[concepts.infinite-games]
name = "Games that may run forever"
area = "chance"
requires = ["backward-induction", "ordinals"]
about = "Games where every play ends but no bound on its length exists."

[concepts.continuity]
name = "Continuity"
area = "chance"
requires = ["limits"]
about = "Quantities that change without jumps, so they pass every value in between."

[concepts.derivatives]
name = "Rates of change"
area = "chance"
requires = ["limits", "coordinates"]
about = "Slopes of curves and tangent lines: the gate for Newton steps, Euler updates and smooth optimization."

[concepts.integrals]
name = "Integrals"
area = "chance"
requires = ["area", "limits"]
about = "Adding up many thin pieces: areas under graphs and averages over regions."

[concepts.differential-equations]
name = "Differential equations"
area = "chance"
requires = ["derivatives"]
about = "Rules that give a rate of change from the current state, followed by small steps or solved exactly."

[concepts.fourier]
name = "Waves and Fourier sums"
area = "chance"
requires = ["angles"]
about = "Writing a signal as a sum of waves; signed waves can add up or cancel."

[concepts.function-distance]
name = "Distance between functions"
area = "chance"
requires = ["continuity"]
about = "How far apart two graphs are, by largest or average gap, and the best approximation in that sense."

[concepts.measure-zero]
name = "Measure zero"
area = "chance"
requires = ["limits", "length"]
about = "Sets that fit under covers of any small total length, such as any list of points."

[concepts.balance-laws]
name = "Balance laws"
area = "chance"
about = "Conserved totals in models, such as volume, energy, charge or atoms, that rule out impossible proposals."
