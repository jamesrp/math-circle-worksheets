# Collections: curated views of the library for one use each.
#
# The library (catalog/weeks, catalog/atlas) is the one store of themes, with stable ids.
# A collection picks themes from it for a purpose and says what "done" means for that
# purpose; see plans/corpus-plan.md. A collection never copies pages. Membership here is a
# proposal by Claude (November 3, 2026) unless `status` says the organizer approved it.
#
#   id, title  short id and name
#   purpose    who uses it, where, with how much adult time
#   done       the bar every member must reach for the collection to count as done
#   status     proposal | organizer-approved
#   weeks      catalog week ids, in suggested order
#   drafts     catalog/drafts ids proposed as members once approved
#   source     where the list comes from, when it is derived rather than chosen

[[collection]]
id = "circle-2026-27"
title = "Wednesday circle, 2026–27"
purpose = "The Lowell circle this school year: about eleven children, mostly grades 2–3, three or four adults, one hour after school."
done = "Every session has a room plan, printed packets, a kit a parent can prepare in under 45 minutes, and a use-log line within a week of the meeting."
status = "proposal"
source = "Year 1 of catalog/path.toml, adjusted to what was taught (catalog/use-log.toml). The organizer picks each week."
weeks = ["1", "2", "11", "3", "5", "7", "10", "4", "6", "8", "9", "42", "15", "13", "30", "24", "36", "34", "17", "16"]

[[collection]]
