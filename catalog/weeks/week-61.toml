week = "61"
title = "Triangles on a ball"
hook = "Pull a string taut between dots on a ball, build string triangles, and test their corners with a paper right angle."
math = "A taut string on a sphere follows a great circle, and opposite points have infinitely many shortest routes. A spherical triangle with corners α, β, γ in degrees covers (α + β + γ − 180)/720 of the sphere (Girard): the lune pairs at the three corners cover the triangle and its opposite copy three times and every other cell once, so the pair areas sum to 1 + 4f."
discover = "A triangle on a ball can have three right angles, and its corner sum exceeds 180° by an amount that measures its area."
gem = "Area from angles alone, by counting how often six lunes cover each piece of the ball."
concepts = ["spherical-geometry", "curvature", "angles"]
uses = []
mechanisms = ["double-count", "construct"]
bands = ["2-3", "4-5"]
reading = "An adult reads; the p. 2 hypotheses are beyond grades 2–3 and are better said aloud."
arithmetic = "Problems 1–3 need none; Problem 4 uses degree gaps and fractions of the ball; Problems 5–7 add to 300, subtract 180 and use fractions."
materials = ["firm 15–20 cm balls on stable supports, with equator and pole marks for the older tables", "80 cm strings", "reusable point dots", "narrow paper right-angle tabs"]
prep = "Mark equators, poles and meridians on the older tables' balls; forecast 60–90 minutes the first time, unrehearsed."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; the missing K–1 pages are a should, as the outline promised no K–1 packet."
app = "Ball triangles"
app_decision = "in app"

