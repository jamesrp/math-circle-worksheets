week = "59"
title = "Constant-width shapes"
hook = "Turn card shapes between two parallel rails and watch which ones keep touching both rails all the way round."
math = "The width of a convex shape in a direction is the distance between its two parallel support lines. The Reuleaux triangle, three 60° arcs each centred at the opposite corner of an equilateral triangle of side w, has width w in every direction, because one support passes through a corner and the other touches the opposite arc; the disk is the only other piece with this property among those tested. Constant width is not constant distance from a centre (25.36 to 34.64 mm from the centroid when w = 60), and the Reuleaux triangle's perimeter equals the circle's, πw (Barbier's case)."
discover = "A shape that is not a circle can spin snugly between rails, yet its centre bobs up and down."
gem = "A rounded triangle rolls like a wheel, and its perimeter is π times its width, exactly as for a circle."
concepts = ["constant-width", "convexity"]
uses = ["angles"]
mechanisms = ["every-case", "counterexample"]
bands = ["2-3", "4-5"]
reading = "An adult reads and helps align the rails; prompts are short."
arithmetic = "Nearest-millimetre ruler readings up to about 85; Problem 6 uses sixths of a circle and scaling."
materials = ["full-size card pieces from the materials PDF (disk, oval, square, triangle, Reuleaux triangle)", "a 200 mm grid mat per pair with two square-edged rails", "a compass or the printed templates", "a ruler"]
prep = "Print the materials at 100%, check the scale bar and cut the pieces from stiff card."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; the missing K–1 route is a should, as the outline records no K–1 edition."
app = "Snug spinners"
app_decision = "in app"

