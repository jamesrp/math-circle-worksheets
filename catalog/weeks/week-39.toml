week = "39"
title = "Road detours"
hook = "Move a pawn along a road map laying one tile per step, then lift out an out-and-back pair of tiles and replay the shorter trip."
math = "On a fixed road map, deleting two adjacent steps along one road in opposite directions shortens any trip to the same final form, whatever order the deletions are made in (free reduction). On a tree every trip home vanishes; on a ring a shortened trip home is whole circuits in one direction; on two rings joined at H, ab and ba shorten differently, and aba⁻¹b⁻¹ survives although it circles each ring once each way."
discover = "Shortening always ends at the same trip, trees forget every loop, and on two rings the order of the loops matters even when the counts cancel."
gem = "The free group of a graph done with a pawn: the commutator is a trip with zero net count round each ring that still cannot disappear."
concepts = ["free-groups", "trees", "composition"]
mechanisms = ["invariant", "monovariant", "extremal"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 hears the tasks while an adult records steps; upper bands read short letter-string trips."
arithmetic = "Counting to 12."
materials = ["a pawn per child", "about sixteen erasable step cards per pair, at least 30 mm long, plus spares"]
prep = "Prepare the step cards and rehearse one pawn-and-tile replay; the printed maps serve as mats."
status = "unpiloted"
verdict = "revise"
verdict_note = "K–1 Problem 7 has two readings, and the key tells the adult that the natural one, a rearrangement of the same steps, is wrong."
app = "Road detours"
app_decision = "in app"

