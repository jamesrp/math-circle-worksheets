week = "64"
title = "Straight paths on strange surfaces"
hook = "Follow straight trips across a regular octagon whose opposite sides are glued, so a path leaving one edge comes back in through its partner going the same way."
math = "Gluing opposite sides of a regular octagon by translations gives a flat surface of genus 2 on which straight trips keep their heading. Rightward trips form two families, middle loops one width long and outer loops whose two chords trade length so every outer loop has the same total, and all eight corners become one point carrying 1080°. On a three-square L, one block of a whole-number direction permutes the squares, so every such trip closes or hits a corner within three blocks."
discover = "Moving a trip's start changes its pieces but not its total length, and the eight corners meet at one point with three full turns of angle."
gem = "A door to translation surfaces: the cone point's 720° of extra angle is the flat face of Gauss–Bonnet for genus two."
concepts = ["surfaces", "curvature", "permutation-cycles"]
uses = []
mechanisms = ["unfold", "invariant", "pigeonhole"]
bands = ["2-3", "4-5"]
reading = "An adult reads the seven-sentence opening; later pages repeat one rule."
arithmetic = "None beyond counting crossings and comparing lengths with tracing strips; no degrees, fractions or square roots."
materials = ["tracing paper", "ruler", "two coloured pencils", "a small counter and a paper direction arrow", "scissors for the corner sectors"]
prep = "Print the chosen pages, with p. 9 twice per pair, and trace one working octagon; precut the p. 5 sectors if cutting would use the session."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must. The shoulds and coulds were fixed October 23, 2026, in the new problem files and the guide (W64-G35-v2): numbered ticks on the pp. 1–3 octagons and a slanted-edge crossing in the launch, an adult-led K–1 route on pp. 1 and 6 (no K–1 pages), the L rules above Problem 6, Problem 7 asking which dots each trip passes, and a print note for p. 9. A glued hexagon (could 5) is deferred."
app = "Glued squares"
app_decision = "in app"

