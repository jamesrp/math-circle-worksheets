week = "56"
title = "Corners of a solid"
hook = "Count the corners, edges and faces of paper solids, and fold fans of face corners to see how much angle is missing at each point."
math = "For every closed convex polyhedron, and every polygonal cellulation of the sphere, V − E + F = 2, and the angular defects (360° minus the face angles at each vertex) sum to 720° (Descartes). Euler's formula follows by erasing loop edges of an opened drawing down to a tree; the 720° follows by counting face angles face by face, which gives total defect 360°(V − E + F). Subdividing a face or edge changes neither total."
discover = "Different solids share the same alternating count and the same total gap of two full turns."
gem = "Descartes's 720° is the discrete Gauss–Bonnet theorem, and it falls out of Euler's formula by counting angles two ways."
concepts = ["euler-formula", "curvature", "polyhedra"]
uses = ["angles"]
mechanisms = ["invariant", "double-count"]
bands = ["2-3", "4-5"]
reading = "Short adult-read text; upper pages ask for explanations in a sentence or drawing."
arithmetic = "Counting to 24; pp. 4–6 add multiples of 60° and 90° and subtract from 360°, with support; pp. 7–9 use polygon angle sums and division."
materials = ["15 assembled paper solids from the materials PDF (cube, tetrahedron, octahedron, prism, pyramid) on cardstock", "triangle and square fan pieces with 80 mm circles", "removable tape and small counting marks"]
prep = "Reserve an evening: adults cut and close 15 nets (72 tabbed seams) and cut 80 fan pieces; folding is unrehearsed."
status = "unpiloted"
verdict = "revise"
verdict_note = "The K–1 table gets only the p. 3 fans and a fallback that repeats them, though the outline promised work with the closed solids."
app = "Corners"
app_decision = "in app"

