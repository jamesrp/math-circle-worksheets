week = "56"
title = "Corners of a solid"
hook = "Count the corners, edges and faces of paper solids, and fold fans of face corners to see how much angle is missing at each point."
math = "For every closed convex polyhedron, and every polygonal cellulation of the sphere, V − E + F = 2, and the angular defects (360° minus the face angles at each vertex) sum to 720° (Descartes). Euler's formula follows by erasing loop edges of an opened drawing down to a tree; the 720° follows by counting face angles face by face, which gives total defect 360°(V − E + F). Subdividing a face or edge changes neither total."
discover = "Different solids share the same alternating count and the same total gap of two full turns."
gem = "Descartes's 720° is the discrete Gauss–Bonnet theorem, and it falls out of Euler's formula by counting angles two ways."
concepts = ["euler-formula", "curvature", "polyhedra"]
uses = ["angles"]
mechanisms = ["invariant", "double-count"]
bands = ["K-1", "2-3", "4-5"]
reading = "Short adult-read text; upper pages ask for explanations in a sentence or drawing."
arithmetic = "K–1 counts faces and corners to 8 and gathers paper gap copies into whole circles, with no degrees; grades 2–5 count to 24; pp. 4–6 add multiples of 60° and 90° and subtract from 360°, with support; pp. 7–9 use polygon angle sums and division."
materials = ["15 assembled paper solids from the materials PDF (cube, tetrahedron, octahedron, prism, pyramid) on cardstock", "triangle and square fan pieces with 80 mm circles", "plain-paper 60 mm gap circles for copying gaps (14 per younger pair)", "removable tape and small counting marks", "optional: magnetic square and triangle tiles instead of cut models"]
prep = "Reserve an evening: adults cut and close 15 nets (72 tabbed seams) and cut 80 fan pieces; copy three sheets of gap circles per younger pair, and one more for a pair that goes on to the octahedron or prism. Folding and gap-copy cutting are unrehearsed."
status = "unpiloted"
verdict = "revised"
verdict_note = "The must, a K–1 route, was fixed October 23: Problems 1 and 4 for the cube and tetrahedron by paper gap copies, Problem 3, and Problem 5 as which corner leaves the bigger gap. A critic's same-day follow-up made the gap circles 60 mm, one face edge in radius, so the copy is cut along the two free sides. More opened drawings for Problem 7 and two small page edits are deferred."
app = "Corners"
app_decision = "in app"

