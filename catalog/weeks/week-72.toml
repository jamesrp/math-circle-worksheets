week = "72"
title = "A robot that remembers area"
hook = "Walk a robot with E, W, N, S cards on a grid; each north step adds the robot's column to a memory strip and each south step subtracts it."
math = "The states (x, y, memory) form the integer Heisenberg group: EN and NE end at the same place with memories 1 and 0, a closed simple loop's memory is its signed area (positive counterclockwise), translating a loop leaves its memory unchanged, and a unit loop changes only the memory, so every integer memory is reachable at a given position."
discover = "Order matters, a loop can change the memory without moving the robot, and the memory a loop leaves is its area."
gem = "A discrete Green's theorem: adding column × vertical step around a loop gives the enclosed area."
concepts = ["cayley-graphs", "composition", "area"]
uses = ["coordinates"]
mechanisms = ["invariant", "construct", "every-case"]
bands = ["4-5"]
reading = "Short texts and rules stated once."
arithmetic = "Sums to 4 in Problem 1; from Problem 2, adding and subtracting negative column numbers, which is beyond Grade 5 content."
materials = ["a robot counter and a small memory marker", "the p. 5 memory strip and 32 move cards, cut out", "tape"]
prep = "Precut p. 5 into the −10 to 10 strip, two extensions and the move cards; materials are unrehearsed."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must. The should-fixes and most coulds were made October 23, 2026 in the new problem files (v2): Problem 3 adds a 2-by-2 square that separates area from the rival rule \"half the cards, minus one\", Problem 2 has six answer lines, and the guide shows a negative column at launch and reads Problem 1's memories as squares left of the route; could 9, a fifth problem, is left for the organizer."
app = "Memory robot"
app_decision = "in app"

