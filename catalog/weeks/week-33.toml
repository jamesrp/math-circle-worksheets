week = "33"
title = "Prime-length necklaces"
hook = "Put A and B counters round a ring, move the start arrow to read it from every bead, and sort cards of readouts into families that are the same ring."
math = "The number of different readouts of a ring of n beads (turns allowed, flips not) is its least period, which divides n, so at a prime length p every ring using two or more colours has exactly p readouts. With c colours the c^p − c mixed readouts fall into families of p, so p divides c^p − c (Fermat's little theorem) and there are c + (c^p − c)/p rings; at composite lengths a mixed ring such as ABAB can repeat early."
discover = "The number of different readouts always divides the length, so on a prime-length ring every mixed ring has as many readouts as beads."
gem = "A counting proof of Fermat's little theorem that children carry out with counters and cards."
concepts = ["fermat", "group-actions", "primes"]
mechanisms = ["up-to-symmetry", "double-count", "every-case"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 recognises A and B, with two rule sentences and the tasks read aloud and the adult saying what a readout is; 2–3 reads lightly and need not read the cards aloud; 4–5 reads short explanation prompts."
arithmetic = "K–1 counts to 6; 2–3 counts to 32 and groups equally (30 ÷ 5); 4–5 uses products and division for the general count."
materials = ["six A and six B counters per pair (a third colour for 4–5)", "single-ring mats cut from spare pages and a sticky-note start arrow (blank boards print no start)", "K–1's eight ring cards, pre-cut", "scissors for the 2–3 eight-card sheet and the 32-card sheets"]
prep = "Print packets and the card pages, cut K–1's eight ring cards and one spare page of four- or five-bead boards into single-board mats per pair; the older bands' cards can be cut at the table (the 32 cards take ten straight cuts, about ten minutes) or colour-marked on the sheet."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must-fix. The should-fixes and coulds were made October 23, 2026 in the new problem files (v3 packets, then v4 after a critic's follow-up): six boards for the four three-bead rings, a six-, seven- and nine-bead problem before the 4–5 prime rule, K–1's six-bead problem for 2–3, method-free 4–5 card problems, and guide materials, timing and a complete four-bead argument; the bonus guide's two wrong sentences were corrected. On November 6, 2026 James adopted a kid-fit revision of the pages (v5): K–1 ring cards and two rule sentences, no printed start on blank boards, Grades 2–3's five-bead question before the 32-card sort, Grades 4–5's eight-card sort folded into Problem 1, with the guide renumbered to match; unpiloted."
app = "Bead rings"
app_decision = "in app"

