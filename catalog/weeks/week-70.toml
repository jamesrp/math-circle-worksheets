week = "70"
title = "Four shields in a portal room"
hook = "Place point shields in a square room whose edges wrap around and try to stop every straight shot from corner S to the centre T."
math = "In a 4-by-4 room with opposite edges glued by translation (a flat torus), with S = (0,0) and T = (2,2), every shot reaching T unfolds to a segment from the origin to its first copy (2 + 4m, 2 + 4n), whose midpoint folds to one of (1,1), (1,3), (3,1), (3,3); so those four shields block every shot. Conversely, the four short corner-to-centre diagonals have disjoint interiors, so three shields never suffice."
discover = "Testing shots on an unfolded map leads to a four-shield conjecture, and halfway points explain why it stops every shot."
gem = "The Lelièvre–Monteil–Weiss blocking lemma in one room: a construction and a matching reason nothing does better."
concepts = ["torus", "parity"]
uses = ["coordinates"]
mechanisms = ["unfold", "certificate", "pigeonhole"]
bands = ["4-5"]
reading = "Short rules; p. 2 names its four target copies by letter as well as by ordered pair."
arithmetic = "Locating grid points by coordinates; halves and odd/even coordinates in the final explanation."
materials = ["pencil crosses for shields (or clear counters with a centre dot)", "a straightedge", "a piece of tracing paper about 6 cm square", "spare map copies or erasable sleeves"]
prep = "Print at actual size and check that a traced room outline lines up with the page-3 room copies; no cutting."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must. The shoulds (a thin first problem, cramped maps, counters that hide the tested point, a narrating paragraph, no extension) were fixed on October 23, 2026 in GGT70-S-v2 and GGT70-FAC-v2: Problem 1 is one room with six shots, the maps are larger, and pencil-cross shields travel on a tracing square."
app = "Portal shields"
app_decision = "in app"

