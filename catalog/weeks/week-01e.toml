week = "1e"
title = "Pattern blocks II"
hook = "Take turns placing blue rhombi on a printed board until someone has no room, fill shapes with the fewest blocks, and (4–5) build the pile of cubes that a blue filling of a hexagon pictures."
math = "On a board that looks the same after a half turn, the second player wins by copying each move on the opposite side when the centre is a grid point, and the first player wins by taking the one self-symmetric blue first when the centre is an edge midpoint; triangles have no half turn. A red trapezoid covers two ups and a down or two downs and an up, so with U ups, D downs and N triangles the kinds satisfy x − y = U − D and x + y = N/3 in every filling (all 220 fillings of the side-6 triangle use 3 of the two-down kind). A blue filling of a hexagon is a pile of cubes and a flip adds or removes one cube, so no flip route returns in an odd number of moves, while re-cutting red trapezoids allows a return in 3."
discover = "Copying wins on half-turn boards, up and down counts fix the trapezoid kinds, and putting the biggest block first does not always give the fewest pieces."
gem = "One box of blocks carries a symmetry strategy, a tiling invariant and plane partitions, the cube piles in a box corner."
concepts = ["copying-strategies", "tilings", "optimization", "bipartite"]
uses = ["symmetry"]
mechanisms = ["copying", "invariant", "greedy"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none with an adult reading short problems aloud; 2–3 and 4–5 read short tasks."
arithmetic = "K–1 counts small pieces; 2–3 keeps game tallies and counts up and down triangles to 21; 4–5 counts cubes and triangles."
materials = ["pattern blocks: green triangles, blue rhombi, red trapezoids, yellow hexagons", "one set of 3× Upscale pattern blocks per K–1 pair", "about 30 snap cubes and a cut-down box corner (4–5)", "three shades of coloured pencil (4–5)", "small whiteboards for tallies"]
prep = "Sort blocks into a tray per pair, cut a box corner for the 4–5 table, and test one board and two cube piles with the real materials."
status = "unpiloted"
verdict = "keep"
app = "Rhombus duel, Fewest blocks and Red trapezoids in Rhombus gardens"
app_decision = "in app"

