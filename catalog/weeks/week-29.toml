week = "29"
title = "Two-length builders"
hook = "Lay rods of two lengths end to end to hit target lengths on a ruler strip, and find the lengths that can never be built."
math = "With unlimited rods of lengths a and b, a length n can be built exactly when n = ax + by with x, y ≥ 0. If a consecutive lengths can be built, so can every later one (add an a-rod to each), so a finite run certifies infinitely many targets; for coprime a, b > 1 the largest impossible length is ab − a − b, while a common factor leaves gaps forever."
discover = "A short run of buildable lengths settles every longer one, and two rods with a shared factor leave gaps that never end."
gem = "The Frobenius coin problem with a certificate a child can hold: a run of a consecutive trains, each of which grows by one more a-rod forever."
concepts = ["frobenius", "gcd", "listing-cases"]
mechanisms = ["certificate", "every-case", "smaller-cases"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 hears one-sentence problems and adults can record; 2–3 and 4–5 read short tasks."
arithmetic = "K–1 counts and aligns to 18; 2–3 adds to 28; 4–5 uses multiplication and remainders in the last problems."
materials = ["rods of lengths 2, 3, 4, 5 and 7 at 1 cm per unit (Cuisenaire scale), about ten of each per pair", "a few 6-rods or 6 cm paper strips for 4–5", "graph-paper strips and scissors"]
prep = "Sort five pair-kits of rods and print the starting pages; nothing printable supplies the rods."
status = "unpiloted"
verdict = "revise"
verdict_note = "The guide's K–1 Problem 6 key lists only 7 as a gap for 2- and 4-rods, though 9 and 11 fail too, so an adult may correct a right answer."
app = "Full jugs in Spring-water Jugs"
app_decision = "in app"

