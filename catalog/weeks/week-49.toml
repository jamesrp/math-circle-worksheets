week = "49"
title = "Four towers and differences"
hook = "Build four cube towers in a ring, make a new ring where each tower is the height gap to its neighbour, and repeat until every tower is gone."
math = "In Ducci's game each of four whole-number heights is replaced by its gap to the next, all computed from the same old ring, and every start reaches all zeros. The maximum never grows, four moves make every height even, and the rule commutes with scaling, so after 4k moves every height is divisible by 2^k and must be zero once 2^k exceeds the starting maximum; with three stations (1, 0, 0) falls into a nonzero cycle. Every ring that has a predecessor has an even total, which rules out some targets."
discover = "Four towers always vanish while three can cycle forever, and parity shows which rings can't be made."
gem = "A termination proof that combines a quantity that never grows, a parity invariant and scaling, with a three-station counterexample beside it."
concepts = ["iteration", "parity"]
mechanisms = ["monovariant", "invariant", "work-backward"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 hears four short rule sentences and one-line tasks, matches cubes and drops a counter in a cup each move while an adult reads and records; 2–3 and 4–5 read one- or two-sentence tasks."
arithmetic = "K–1 finds gaps up to 4 by matching towers; 2–3 subtracts within 5; 4–5 uses even and odd and repeated doubling."
materials = ["40 linking cubes per pair (Grades 4–5: the doubled start needs 36 of them)", "a cup and 10 counters per K–1 pair, kept apart from the cubes", "pencils for the record rows"]
prep = "Print the packets at actual size (the mats are on the problem pages; K–1 7 pages, Grades 2–3 and 4–5 8), count out 40 cubes per pair, making sure each Grades 4–5 pair has all 40 for the doubled start, and give each K–1 pair a cup with 10 counters; light."
status = "unpiloted"
verdict = "keep"
verdict_note = "The review card's shoulds and clear coulds were made on October 23, 2026 after the problem-file conversion: no page shows a longest order or the tallest-height example, the mats have 36 mm stations with a 9 mm gap, the three-station, predecessor and parity pages have record rows, the all-zero rule is on page 1, Grades 4-5 Problem 6 has new starts, and the guide gives 40 cubes per pair. The bonus wording followed the same day (bonus v2: “by round 5”). On November 6, 2026 James approved the kid-fit revision of all three packets (v4: K–1 rules spoken in short sentences with a counter cup, the orders problem moved before the open search, mats beside Problem 1 and a page each for the four- and three-station mats), and the guide was renumbered to match. Unpiloted; the respaced mats and the cup are physically unrehearsed."
app = "Gap rings"
app_decision = "in app"

