week = "37"
title = "Mirror twins"
hook = "Label the corners of a rigid tetrahedron A, B, C, D, build its mirror twin, and try to turn one until every corner matches the other."
math = "A rigid regular tetrahedron has 12 rotations (4 places for A, then 3 turns), so the 24 labellings by four different letters fall into two classes of 12, exchanged by reflection. Seen from A, the other three letters run one way round on a model and the opposite way on its mirror twin, and rotations keep that order, so the twins never match; make any two letters equal and the model gains a mirror symmetry, so the twins do match."
discover = "Four different letters make a model that cannot be turned into its mirror twin, the view from A proves it, and repeating a letter makes the twins match."
gem = "Chirality with a one-glance certificate: the cyclic order round a corner, which every rotation keeps and every reflection reverses."
concepts = ["chirality", "group-actions", "symmetry"]
mechanisms = ["invariant", "every-case", "up-to-symmetry"]
bands = ["K-1", "2-3", "4-5"]
reading = "Little in any band; adults read aloud at K–1."
arithmetic = "None until 4–5 counts 12 rotations and 24 ÷ 12 classes."
materials = ["printed kit week-37-materials.pdf: a card tetrahedron net with 90 mm edges per child and letter caps A, A, B, B, C, C, D per model on card stock, pose mats on copy paper", "clear tape and sticky tack"]
prep = "Heavy: about 6 minutes to cut, fold and tape each of 13 models and 30–40 minutes for the caps, then the guide's pretest of the mirror pair. The kit is physically unrehearsed."
status = "unpiloted"
verdict = "revised"
verdict_note = "Original verdict revise. Both must-fixes were fixed on October 23, 2026: the guide accepts 'A must go on A, and all three turns about A fail' as a complete proof, and a printed kit supplies the models and letter caps (physically unrehearsed); student-page should-fixes are deferred."
app = "Mirror twins"
app_decision = "in app"

