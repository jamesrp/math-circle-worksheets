week = "57"
title = "Area from dots"
hook = "Draw polygons on a dot grid, find their areas by cutting and copying paper squares, and count the dots inside and on the outline."
math = "A simple lattice polygon with I dots inside and B dots on its boundary has area I + B/2 − 1 (Pick), and each hole adds 1. The proof rests on a seam lemma: joining two polygons along a full side with k dots moves the k − 2 middle dots inside, so I + B/2 − 1 adds exactly as area does; rectangles, triangles and ear removal finish it."
discover = "Area can be read from dot counts, and the count survives gluing because seam dots move from outline to inside."
gem = "An additive invariant gives an area formula from pure counting, and the inverse question has exactly six records for area 6, since B = 14 − 2I ≥ 4."
concepts = ["pick", "area"]
uses = []
mechanisms = ["invariant", "smaller-cases", "every-case"]
bands = ["2-3", "4-5"]
reading = "An adult may read and record while the child chooses the shape and method."
arithmetic = "Counting dots (up to 49), square units and halves; upper pages compute I + B/2 − 1 and add 1 per hole."
materials = ["60 paper 20 mm squares and 120 diagonal halves for the group", "straightedges", "scissors", "two coloured pencils per kit"]
prep = "Measure and cut 120 squares, halve 60 diagonally and bag five kits; forecast 45–75 minutes once, reusable afterward."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; the missing K–1 route is a should."
app = "Geoboard"
app_decision = "in app"

