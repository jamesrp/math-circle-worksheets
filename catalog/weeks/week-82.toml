week = "82"
title = "Endless class lines"
hook = "Match two lines of kid cards with yarn, then put an extra star kid at the front or after every kid of an endless line and try to match again."
math = "Two lines can be matched kid for kid (same size) without being matched in order (same order type). A star in front of an endless line is absorbed (star → 1, n → n + 1), so 1 + ω = ω, but a star after every kid is a last kid, which the plain line lacks, so ω + 1 ≠ ω. A whole second row gives a kid with endlessly many kids before it, so ω + ω differs from an endless row of pairs (2·ω = ω), though all these lines have the same size."
discover = "Size and order are different: some endless lines match only if you may change the order."
gem = "The first facts of ordinal arithmetic, each proved by an invariant a child can point to."
concepts = ["ordinals", "bijection"]
uses = []
mechanisms = ["pair-up", "invariant", "construct"]
bands = ["2-3", "4-5"]
reading = "Brief, read aloud as needed; an adult reads Problem 2 to third graders."
arithmetic = "Only n + 1."
materials = ["24 kid cards, 4 stars and 5 'after EVERY' panels (printed, cut)", "yarn or dry-erase arrows", "blank paper for drawn endless rows"]
prep = "Cut the kid cards, stars and panels."
status = "organizer-approved"
verdict = "keep"
verdict_note = "The organizer approved the six-page packet (draft-v1) on October 17; there was no must. The October 23 revision (v2) post-dates that approval and has not been re-approved: it made the shoulds and coulds, 'complete match' in Problems 1–3, two endless rows in Problem 4 (where a star between the rows joins the second), a third panel, and Problem 4's key, a launch demonstration of a rule and a K–1 route in the guide. The approved draft-v1 PDFs are archived; show v2 to the organizer before printing it as the approved packet."
app = ""
app_decision = "not porting"

