week = "25"
title = "Row and column shadows"
hook = "Place counters on a labelled grid to match circled row and column counts, then look for a different picture with the same counts."
math = "A picture is a 0/1 grid with fixed labels; a switch trades the two occupied opposite corners of a rectangle for the two empty ones and keeps every row and column count. A picture is the only one with its counts exactly when it has no switch, that is, when its rows' occupied columns nest, and switches connect all pictures with the same counts (Ryser). On two rows the fewest switches between two such pictures is the number of wrongly chosen top-row columns, and the greatest such distance is min(k, s − k), where s columns have count 1 and k of those are on top."
discover = "Different pictures can cast the same shadows, a two-counter switch keeps every count, and counting the cells that must empty gives a lower bound on switches."
gem = "Reconstruction from projections, the idea behind CT scanning, collapses to one local move: a picture is forced exactly when no rectangle allows a switch."
concepts = ["tomography", "listing-cases"]
mechanisms = ["invariant", "certificate", "every-case"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none, with an adult reading and recording counts; 2–3 can share reading; 4–5 reads short tasks, with set and binomial notation optional."
arithmetic = "Counting to 4 at K–1 and to 6 in the upper bands; 4–5 reasons about all pairs of pictures."
materials = ["24 identical counters per table, at most 18 mm wide", "count cards 0–6"]
prep = "Print packets at 100% and draw a labelled 2-by-3 demonstration board; about 10–15 minutes."
status = "unpiloted"
verdict = "revised"
verdict_note = "Original verdict revise. The must-fix, a guide hint that rejected the natural lower-bound proof (four cells must empty and a switch empties two), was fixed on October 23, 2026, with the guide-located should-fixes. The same day the student pages moved to problem files and got the student-page shoulds: spare grids, a grades 4–5 P4 workspace page, continued headings with grades 2–3 renumbered P1–P6, a recorded switch, and clearer K–1 P6 and p. 1 wording."
app = "Hidden pictures"
app_decision = "in app"

