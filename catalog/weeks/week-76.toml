week = "76"
title = "Substitution strips"
hook = "Grow a strip of A and B tiles by replacing every A with AB and every B with BA, then undo strips to catch forgeries."
math = "Replacing A by AB and B by BA at once grows nested rows that define the Thue–Morse word. True child-pairs are unequal, so no row contains AAA, BBB, ABABA or BABAB, and every genuine piece of five or more tiles splits into replacement pairs in exactly one way. The endless word is not eventually periodic: equal neighbours rule out an odd period, and decoding halves an even one."
discover = "Equal neighbours mark hidden seams, so a strip can be decoded back to its parent and a forgery exposed."
gem = "Decoding is the proof tool at every scale, and a repeating strip that passes every local ban is still caught after two shrinks."
concepts = ["substitution", "words"]
uses = []
mechanisms = ["invariant", "work-backward", "smaller-cases"]
bands = ["2-3", "4-5"]
reading = "Read A/B strings; an adult reads Problem 4's two conventions aloud for third graders. Not a K–1 packet."
arithmetic = "None; odd/even reasoning appears only in the late proofs."
materials = ["36 reversible A/B tiles per pair, lettered on both faces", "four small divider markers per pair"]
prep = "Make lettered two-sided tiles (two-colour counters marked in pen) and print four pages per child; no cutting."
status = "organizer-approved"
verdict = "keep"
verdict_note = "No K–1 route by design, and nothing supplies the tiles; both are should-fixes."
app = "Shrink strips"
app_decision = "in app"

