week = "74"
title = "Doubling elevators"
hook = "Ride a marker up and down levels where each stride is double the one below, and find the shortest trip from 0 to a target on the ground."
math = "On the graph with states (x, h), h ≥ 0, where a horizontal move at level h covers 2^h and every move costs one, a trip of at most N moves that tops out at level H spends 2H moves climbing and descending, so it ends at most (N − 2H)·2^H from 0; the bound is attained, so 16 needs 8 moves. Stepping back can strictly win: 23 takes 10 moves via 24, against 11 with no left moves."
discover = "Climbing pays for distant targets, overshooting and stepping back can save a move, and \"best found\" differs from \"proved best\"."
gem = "Exponential distortion as in the Baumslag–Solitar group BS(1, 2): 2k moves reach 2^k."
concepts = ["cayley-graphs", "graph-distance", "optimization"]
uses = ["place-value"]
mechanisms = ["certificate", "extremal", "construct"]
bands = ["4-5"]
reading = "Short reading; the partner records one move word per trip."
arithmetic = "Adding and subtracting step sizes 1, 2, 4, 8 and 16 with signed coordinates under 25."
materials = ["a very small pointed marker", "a stride strip per pair, cut from the printed materials page"]
prep = "Print the packet and the stride-strip page at actual size, cut one strip per pair, and rehearse an R on level 2 from an odd coordinate; forecast about 10 minutes (untested)."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must. October 23, 2026: the card's shoulds and coulds fixed in the new problem files and guide: the two tied trips to 16 are named as the only ones, a printed stride strip checks each stride, and the K–1 and 2–3 tables get adult-led routes from the same pages."
