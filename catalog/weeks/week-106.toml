week = "106"
title = "Coloring maps"
hook = "Color scribble maps with two pencils and try to break the trick, find out what odd rings and a middle country need, play Painter against Spoiler on a tic-tac-toe map, and try to draw a map that needs five colors."
math = "A map made of lines running edge to edge and closed loops needs only two colors: color each country by whether a path to it crosses an even or odd number of lines. A line that stops on another line breaks it (a T needs three). A ring of countries needs 2 colors if even and 3 if odd, and a middle country adds one more; a middle with a ring of 5 needs four colors though no four of its countries all touch. Four countries can all touch on a page and five cannot, and every flat map needs at most four colors (Appel and Haken, 1976). In the Painter and Spoiler game on the 3-by-3 grid the Spoiler wins with 3 colors and the Painter with 4, whoever starts. On a donut seven countries can all touch, so some maps need 7 colors."
discover = "Two colors always work for maps of whole lines and loops, odd rings need a third, and nobody can draw a flat map that needs five."
gem = "The parity proof of two-colorability, the odd cycle as the reason for a third color, and the four color theorem as a challenge every child fails, set against the donut where the answer becomes seven."
concepts = ["graph-colouring", "parity", "torus"]
mechanisms = ["colouring", "counterexample", "construct"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1: an adult reads each prompt; children write a number or circle a word. Grades 2–5: short prompts and a few explanations to write or say."
arithmetic = "Counting to about 15 and telling even from odd (20, 25, 100, 101)."
materials = ["colored pencils, a set of at least 7 colors per pair, plus two thick pencils of very different colors per K–1 child", "construction paper: 7 red, 7 blue, 5 yellow, 5 green whole sheets", "masking tape for a 6-foot tic-tac-toe floor grid", "small whiteboards and markers"]
prep = "About 25 minutes: print and cut the opener sheet, count the paper, tape the floor grid at the room."
status = "unpiloted"
verdict = "keep"
verdict_note = "Written through the worksheet workflow on November 20, 2026 as a December 2 option (adversarial, math, kid-fit and two adult cold-read reviews; nothing blocking) and chosen by James for December 2 on November 22. Two print levels only (K–1, grades 2–5); no adult guide: the answers are in the room plan, plans/room-plans/2026-12-02-map-coloring.md. K–1 v2 (November 22) says a quick scribble of color in each country is enough."
app = ""
app_decision = "open"

