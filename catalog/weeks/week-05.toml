week = "5"
title = "Tower cities"
hook = "Build rows and grids of cube towers, put your chin on the table, and count how many towers you can see from each end."
math = "A row of different heights is a permutation and the towers seen from an end are its left-to-right records; the tallest is seen from both ends and splits the row, so (1, 1) never occurs and L + R ≤ n + 1. A city is a Latin square with these views as edge clues: a clue set can fit one, several or no cities, a 3-by-3 city's twelve numbers always total 22, the fewest clues that fix a city are 2 for 3-by-3 and 3 for 4-by-4 (by computer), and 204 of the 576 4-by-4 cities share all sixteen numbers with another."
discover = "The tallest tower is always seen, which limits the end counts, and some clue sets fix one city while others fit two or none."
gem = "Records of permutations meet Latin squares, and about a third of 4-by-4 cities have a twin that no puzzle can tell apart."
concepts = ["latin-squares", "permutations", "deduction"]
mechanisms = ["extremal", "every-case", "construct"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none with an adult reading; 2–3 reads problems of up to four sentences; 4–5 reads short tasks."
arithmetic = "K–1 counts to 4; 2–3 adds twelve small numbers (to 22); 4–5 counts rows and cities."
materials = ["3/4-inch snap cubes pre-built into towers (about 240 cubes)", "file folders as screens", "small whiteboards"]
prep = "Pre-build every tower and bag each child's set (the main job), one colour per height at the 2–3 and 4–5 tables (at most 48 cubes of a colour), and test the chin-on-the-table view the evening before."
status = "unpiloted"
verdict = "revised"
verdict_note = "Original verdict revise. The must-fix, the guide's silence about the 204 of 576 4-by-4 cities no puzzle can single out in 4–5 Problem 5, was fixed on October 23, 2026, with the guide-located should-fixes; the same day the week became problem files and the spare 2–3 grids page was headed \"Extra grids for Problem 5\", and the guide made one colour per height the default (F05-FAC-v6)."
app = "Towers in Symbol Orchard"
app_decision = "in app"

