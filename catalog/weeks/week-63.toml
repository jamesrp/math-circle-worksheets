week = "63"
title = "Cards away from home"
hook = "Place lettered cards in lettered homes and hunt for every row where no card sits in its own home."
math = "The home-free rows (derangements) number 2 for three cards, 9 for four and 44 for five. Fixing k named matches leaves (n − k)! rows, and the alternating sum counts a row with m ≥ 1 matches 1 − m + C(m, 2) − … = 0 times, so D_n = Σ (−1)^k C(n, k)(n − k)!. With one card's destination fixed, home-free rows split into a swapped-pair family and a longer-loop family, each rebuilt reversibly from a smaller home-free row, giving D_n = (n − 1)(D_{n−1} + D_{n−2})."
discover = "Subtracting overlapping groups miscounts shared rows until an alternating correction fixes them, and home-free rows can be rebuilt from smaller ones."
gem = "Two different proofs, inclusion–exclusion and a reversible construction, meet at 44."
concepts = ["derangements", "inclusion-exclusion", "recurrence"]
uses = ["permutations"]
mechanisms = ["every-case", "pair-up", "smaller-cases"]
bands = ["K-1", "2-3", "4-5"]
reading = "The p. 1 rules are read aloud, for K–1 as two sentences; card pictures let non-readers check a match; later tasks are short."
arithmetic = "K–1 counts to nine; grades 2–3 count to six, then totals to 24 with adult-written subtraction; upper pages reach 120."
materials = ["picture-and-letter cards and home strips from the materials PDF, with the pictures beside the home letters", "complete 6- and 24-card outcome decks", "open rings or hoops for grouping", "lettered sticky dots"]
prep = "Print and cut the materials pages (cards, strips, outcome decks); cutting and the reversal rehearsal are unperformed."
status = "unpiloted"
verdict = "revised"
verdict_note = "The must, a K–1 route, was fixed October 23 (guide p. 3; card pictures on the home cells and A–C outcomes), with the shoulds and all coulds but the timing one. After an independent critic's review the same day, Problem 8's letters convention reads \"A smaller row keeps its letters.\" inside the problem (W63-S-v4)."
app = "Mixed-up cups"
app_decision = "in app"

