week = "6"
title = "Code breaking"
hook = "Hide a row of red and yellow counters behind a folder and find it from scores that say how many places a test row matches."
math = "A yes-or-no answer at best halves what is left, so k answers separate at most 2^k possibilities: three questions find one of eight blocks, two never can, and 1 to 20 needs five. In the code game a score is n minus the Hamming distance from the secret; all red and then one changed counter at a time finds any n-counter secret in n tests, and for 2, 3 and 4 counters nothing does better (five need only four). Counting the n + 1 possible scores is too weak for that bound; the proof uses that changing one counter moves every score by exactly 1."
discover = "Each answer can at best halve the possibilities, and a well-chosen order of tests finds any secret in as many tests as there are counters."
gem = "Coin weighing and Mastermind at a child's scale, with a lower bound where the obvious counting argument fails."
concepts = ["information", "deduction", "listing-cases"]
mechanisms = ["pigeonhole", "construct", "invariant"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none (the adult keeps the secret and scores); 2–3 writes questions and methods, which an adult can scribe; 4–5 reads denser tasks."
arithmetic = "K–1 counts to 8; 2–3 counts to 4 and changes of one; 4–5 uses powers of two up to 32."
materials = ["two-sided red/yellow counters (about 220)", "green pattern-block triangles as scoring tokens", "two sets of the eight pattern-block shapes per pair", "file folders as screens", "small whiteboards"]
prep = "Number and cut the extra copies of the code boards each table will use into keeper and breaker strips, leaving the packet pages whole, and check that a scoring triangle fits its outline."
status = "unpiloted"
verdict = "revised"
verdict_note = "Original verdict revise. The must-fix, the guide's key for 2–3 Problem 11 (testing every place takes four tests, not five), was fixed on October 23, 2026, with the guide-located should-fixes; the same day the week became problem files, K–1 Problem 6 was shortened and 4–5 Problem 8 now asks rather than states its conclusion."
app = "Slippery secrets in Signal Lanterns"
app_decision = "in app"

