week = "4"
title = "Stars and wheels"
hook = "Hop the same number of dots around a ring, drawing a line each time and restarting at a bare dot until every dot has a line, and code messages on a turning letter wheel."
math = "Hopping k around n evenly spaced dots needs gcd(n, k) starts, and every piece is the first one turned; hops k and n − k draw the same lines, and every hop reaches every dot exactly when n is prime. The code wheel is the same ring with 26 places: shifts add, 26 − s undoes s, and hopping by s reaches all 26 letters exactly when s is odd and not 13."
discover = "The number of starts is the largest number that divides both the number of dots and the hop."
gem = "One theorem about the cyclic group of order n, reached by drawing stars and then used to predict, prove an impossibility, invert and classify generators."
concepts = ["gcd", "remainders", "primes", "composition"]
uses = ["divisibility"]
mechanisms = ["every-case", "construct", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none; 2–3 looks up letters and has one paragraph an adult can read; 4–5 reads short tasks."
arithmetic = "K–1 counts to 8; 2–3 counts to 18; 4–5 finds common factors of two-digit numbers."
materials = ["counters in two colours (K–1 hopper and landing markers)", "coloured pencils, six or more colours", "6-inch rulers", "scissors and brass fasteners for the code wheels (2–3, 4–5)", "small whiteboards"]
prep = "Check the wheel scale, pierce the wheel centres, make three spare wheels and pack K–1 counter cups; children cut their own wheels."
status = "unpiloted"
verdict = "revised"
verdict_note = "Original verdict revise. The must-fix, the guide's placing of the 4–5 times-table dents where the curve touches the circle, was fixed on October 23, 2026, with the guide-located should-fixes; student packets unchanged."
app = "Star drawing in Clockwork Gates"
app_decision = "in app"

