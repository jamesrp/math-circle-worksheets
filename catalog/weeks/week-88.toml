week = "88"
title = "Packing and kissing circles"
hook = "Place disks around a central disk so each touches it without overlapping, then pack as many as possible into a tray."
math = "At most six equal disks can touch a central disk of the same size without overlapping: neighbouring outer centres lie on a circle of radius 2r at least 2r apart, so each gap needs 60°, and six fill the turn exactly with every neighbour touching. With outer radius r around central radius R the maximum is ⌊π / arcsin(r/(R + r))⌋, nine small disks around a double-size one and four large around a small one. Eleven 40 mm disks fit a 160 mm tray in rows of 4, 3 and 4, needing height 40 + 40√3 ≈ 109.3 mm, the least for those rows."
discover = "Six fit around one, every neighbour then touches, and a seventh never fits."
gem = "The plane's kissing number with its rigid equality case, proved by sharing out 360°."
concepts = ["packing", "angles"]
uses = []
mechanisms = ["construct", "certificate"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none, with an adult reading and recording; upper pages read short tasks."
arithmetic = "Counting disks; Grades 4–5 compare centre distances and angles, with trigonometry as adult background."
materials = ["13 rigid 40 mm disks and 5 rigid 80 mm disks per pair, and one 120 mm middle per table: laser-cut metric circles, or card disks cut from week-88-materials.pdf", "ruler, nonstretch thread and centre stickers", "a desk mat at least 260 × 260 mm"]
prep = "20–35 minutes with reusable disks, or cut a printed kit once (roughly a minute a disk); measure the disks (39.7–40.0 mm for the tray problems) and the printed tray interiors (160 × 112, 110 and 108 mm) before use."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must-fix. The should-fixes were made October 23, 2026 in the new problem files and the guide: printable disk sheets with stated tolerances (39.7–40.0 mm for the trays), Problem 10 asks for the largest rings, the false Problem 5 sentence replaced, a 120 mm ring for Problem 11, a no-angle route for Problem 10, Problem 7 reworded and pages 1–5 for the Grades 4–5 trio."
app = ""
app_decision = "not porting"

