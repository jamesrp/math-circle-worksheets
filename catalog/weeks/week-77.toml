week = "77"
title = "Persistent holes"
hook = "Lay yarn edges and paper triangles on a board stage by stage, save a loop, and test with edge tokens whether filled triangles cancel it."
math = "On a growing planar triangle board, with edges cancelling in pairs (mod 2), a saved loop is gone exactly when some filled triangles have its edges as their combined boundary, and once gone it never returns. Equal hole counts at every stage do not determine when a particular loop dies, and loops that are equivalent on one board can die in either order on a fresh one only when their required-tile sets are not nested."
discover = "Hole counts alone do not tell you which loop dies, or when."
gem = "Persistent homology over the two-element field, small enough to hold in your hands."
concepts = ["persistence", "holes", "linear-algebra-f2"]
uses = ["graphs"]
mechanisms = ["invariant", "counterexample", "construct"]
bands = ["4-5"]
reading = "Follow short edge labels and a page of conventions; an adult may read Problem 1's rules."
arithmetic = "None; cancel matching pairs of edge tokens."
materials = ["the two-page materials sheet: nine tiles at board scale with their edge names and seven edge strips (page 1), 48 edge tokens and 8 stage cards (page 2)", "envelopes, scissors and removable tape"]
prep = "Print the materials sheet (page 1 twice, page 2 once for the 4–5 table; page 1 per pair at a younger table), cut the tiles, strips, tokens and stage cards (untimed, untested), and place two fan tiles before the session."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must. October 23, 2026: the card's shoulds and coulds fixed in the new problem files, guide and a printed tiles-and-tokens sheet, including a new Problem 3 and an adult-led K–1 and 2–3 route on the same pages; nothing left."
app = "Holes in Lantern Wires"
app_decision = "in app"

