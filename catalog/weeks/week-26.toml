week = "26"
title = "Same area, different boundaries"
hook = "Rearrange the same number of square tiles to make the boundary as long or as short as possible, putting a marker on every exposed edge."
math = "For n unit squares joined along e full sides the boundary is P = 4n − 2e, so it is always even, and a new tile touching k old ones changes it by 4 − 2k. Connectedness forces e ≥ n − 1, so P ≤ 2n + 2, with equality exactly for tree-like shapes; a shape spanning r rows and c columns has P ≥ 2(r + c) and n ≤ rc, which gives the least boundary 2⌈2√n⌉ and the greatest area ⌊s/2⌋⌈s/2⌉ for boundary 2s (Harary–Harborth)."
discover = "Boundaries are always even, a straight row is longest, near-square shapes are shortest, and a matching bound proves a record cannot be beaten."
gem = "A discrete isoperimetric problem with certificates on both sides, reached entirely by building."
concepts = ["polyominoes", "length", "parity", "optimization"]
uses = ["area"]
mechanisms = ["double-count", "certificate", "extremal"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 hears one- or two-sentence problems read aloud and an adult may record; upper bands read short tasks."
arithmetic = "K–1 counts to 18; 2–3 counts to 26 and small differences; 4–5 uses multiplication and products with a fixed sum."
materials = ["24 square tiles per table (about 20 mm, or 1-inch colour tiles)", "about 40 small edge markers", "square-grid paper"]
prep = "Gather tiles and markers and print packets; build on the table, since a 12-tile row is wider than a page."
status = "unpiloted"
verdict = "revised"
verdict_note = "Original verdict revise. The must-fix, Grades 4–5 Problem 2's hole question with no corner convention, was fixed on October 23, 2026 in the new problem files: the page says two tiles touching at a corner leave no gap, and the guide answers under that rule. Should 3 (a Problem 3 shape that breaks the rows-plus-columns pattern) and small Grades 2–3 and 4–5 wording and layout coulds were taken too; the K–1 packet is unchanged."
app = "Garden fences"
app_decision = "in app"

