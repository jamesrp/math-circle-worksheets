week = "90"
title = "Sliding number arrays"
hook = "Slide numbered tiles into a hole by always moving the smaller neighbour, and compare the finished arrays from different starting corners."
math = "In a skew array with rows and columns increasing, a slide from an inner corner repeatedly moves the smaller of the right and lower neighbours into the hole; it keeps the array increasing, ends, and removes one inner and one outer cell. The first fundamental theorem of jeu de taquin: sliding until no inner cell remains gives the same labelled tableau whichever inner corner starts each slide. A recorded slide can be reversed from its exit, but the final tableau alone does not determine the start."
discover = "Whichever corner you start from the finished array is the same, though different starts can share a finish."
gem = "Schützenberger's jeu de taquin: a local rule with a global independence theorem whose proof is far deeper than the play."
concepts = ["tableaux", "listing-cases"]
uses = []
mechanisms = ["invariant", "every-case", "work-backward"]
bands = ["2-3", "4-5"]
reading = "Short rules; adults may read and save final boards."
arithmetic = "Compare labels 1–5; no computation."
materials = ["a reusable 4×4 grid with 30 mm cells per kit", "numbered tiles 1–5, a ring hole marker, gray and dark mask pieces", "reset cards and board inserts (materials pages 1–11)"]
prep = "20–30 minutes with reusable boards; cut tiles, masks and reset cards."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must-fix. Should-fixes: Problem 6 relies on a B catalog no page keeps, a teaser line opens page 1, the first visit may run short for 4–5, and the guide treats the start marker as essential when only the exit matters."
app = ""
app_decision = "open"

