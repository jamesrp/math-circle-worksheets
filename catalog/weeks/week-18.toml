week = "18"
title = "Hidden changes"
hook = "Send a picture as a row of filled and empty counters while a partner secretly flips at most one, and design keys so the receiver can always name the picture."
math = "Guaranteed recovery from at most t flips is possible exactly when every two rows of the key differ in at least 2t + 1 places, because then their sets of possible received rows are disjoint. A row of n counters has n + 1 outcomes with at most one flip, so M pictures need M(n + 1) ≤ 2^n: four pictures need five counters, and three pictures fail at length four although 3 × 5 ≤ 16, since three pairwise distances of at least 3 would sum to at least 9 but can total at most 8."
discover = "A key works when every two rows differ in at least three places, and counting the possible received rows bounds how short a key can be."
gem = "Coding theory in miniature: the distance criterion, the sphere-packing bound, and a case where the bound is not enough."
concepts = ["codes", "information", "listing-cases"]
mechanisms = ["double-count", "pigeonhole", "every-case"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 hears one or two sentences per problem and uses a picture key; 2–3 reads short sentences; 4–5 reads 0/1 notation."
arithmetic = "K–1 counts to four; 2–3 compares rows place by place; 4–5 uses powers of two and a sum of distances."
materials = ["two-sided counters (about 30 per table)", "reusable five-cell counter strips, cells about an inch wide", "four picture cards per table", "opaque folders"]
prep = "Make counter strips and picture cards: about 20 minutes with an existing counter kit, 35 if making paper counters."
status = "unpiloted"
verdict = "keep"
app = "Codebooks in Signal Lanterns"
app_decision = "in app"

