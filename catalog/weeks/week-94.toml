week = "94"
title = "Calibration lab"
hook = "Measure paper strips on a ruler whose zero is missing, then play a machine that secretly adds an extra amount and work out what can and cannot be known."
math = "If every reading is the true length plus one shared offset b, differences of readings cancel b, so repeated readings cannot separate the objects from the offset, while one known reference identifies b. For a stretch-and-shift scale y = a + bx with b > 0, two distinct known references determine both a and b and one does not; if each reading is off by at most e, references D apart leave possible slopes in an interval of width at most 4e/D. Agreement at finitely many points cannot prove the scale is of that form."
discover = "A shared error cancels in differences, and one known standard pins it down."
gem = "Identifiability made tangible: some questions no amount of repetition answers, and the right reference answers them at once."
concepts = ["inference", "measurement-error", "deduction"]
uses = []
mechanisms = ["invariant", "every-case", "construct"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none with an adult reading; Grades 2–3 read short tasks; Grades 4–5 read rule-game prompts."
arithmetic = "K–1 counts spaces; Grades 2–3 add and subtract small whole numbers; Grades 4–5 use differences, ratios and fractions."
materials = ["strips A–D cut from a spare first page and an uncut 12-square row per kit", "12 unit cubes or counters and an opaque cover", "ruler and scissors for the adult"]
prep = "10–15 minutes to print, cut and check the 12 mm strips."
status = "unpiloted"
verdict = "none"
verdict_note = "No review card yet."
app = ""
app_decision = "open"

