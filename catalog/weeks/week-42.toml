week = "42"
title = "Fair results from a bag"
hook = "Draw two counters in order from a bag of three red and one blue, and invent a rule that turns each pair into a square, a circle or nothing so both shapes are equally likely."
math = "For independent draws with replacement from one bag holding both colours, RB and BR each have chance p(1 − p), so sending BR to one shape, RB to the other and skipping RR and BB is fair for every such bag (von Neumann). With three red and one blue, the 16 marked pairs fall 9, 3, 3, 1 into RR, RB, BR, BB; a rule that sees only colours cannot split a class, so that rule and its swap are the only fair ones, ten pairs must be skipped, and no fair rule always gives a shape. Draws from two different bags stay fair exactly when their red proportions match."
discover = "Reversing a mixed pair keeps its chance, so a rule that skips same-colour pairs is fair whatever the bag holds."
gem = "Von Neumann's trick makes a fair coin from any biased one, and a count of 9 against 7 shows the skipping can't be avoided."
concepts = ["fair-randomness", "equally-likely", "listing-cases"]
mechanisms = ["pair-up", "every-case", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs adult reading and colour matching; 2–3 reads a row/column grid; 4–5 reads conditions on hidden and changed bags."
arithmetic = "Counts within 16; fractions help in 4–5 but are not required."
materials = ["two opaque bags or cups per pair", "about ten red and eight blue same-feel counters per pair, three reds marked R1–R3", "paper squares and circles to record outcomes"]
prep = "Gather bags and counters and mark three reds; no cutting."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; on October 23, 2026 shoulds 1–9 and most coulds were fixed in the new problem files and the guide (v3 packets): K–1 pictures of every marked pair for Problems 4–5, blank grids for Grades 2–3 Problems 3 and 5, an open Grades 4–5 Problem 2 over a labeled grid, and corrected guide materials and keys. The bonus should was already done; the timeline could is deferred. After a critic's review the same day, the Grades 4–5 Problem 2 grid outlines its example's cell, so it shows which head is the first draw (W42-grades-4-5-v4)."
app = "Fair bags"
app_decision = "in app"

