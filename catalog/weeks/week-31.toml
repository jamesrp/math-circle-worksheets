week = "31"
title = "Hidden orchard"
hook = "Stretch a thread from a corner dot to a target dot on a grid and see whether another dot lies exactly on the thread, hiding the target."
math = "A lattice point (a, b) is visible from the origin when no other lattice point lies on the open segment to it. With d = gcd(a, b), the first point on that ray is (a/d, b/d) and the blockers are exactly its multiples k(a/d, b/d) for k = 1, …, d − 1, so a point is visible exactly when gcd(a, b) = 1. This holds for ideal points on a full grid: a nearly collinear dot does not block, and removing dots could change visibility."
discover = "The dots in one direction are multiples of the first dot, so a shared factor of the coordinates hides a dot and coprime coordinates leave it visible."
gem = "Euclid's orchard: the gcd becomes a count of lattice points on a segment, with the converse proved through lowest terms."
concepts = ["gcd", "coordinates", "divisibility"]
mechanisms = ["extremal", "every-case"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs an adult to read, and coordinates may be spoken or pointed to; 2–3 reads short tasks with across/up coordinates; 4–5 reads explanation prompts."
arithmetic = "K–1 counts to 6; 2–3 uses small equal groups and multiplication; 4–5 uses division and common factors."
materials = ["30–40 cm of thin thread per pair", "removable tape", "a clear ruler as an alternative to thread"]
prep = "Cut thread and print the dot grids; light."
