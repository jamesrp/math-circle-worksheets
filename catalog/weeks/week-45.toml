week = "45"
title = "The visible side"
hook = "A secret ticket picks one face of three two-sided cards to show; seeing red, decide whether the hidden side is more likely red or blue."
math = "With cards RR, RB and BB and one of the six faces chosen uniformly to show, a red face leaves three equally likely faces, two of which hide red, so the hidden side is red with chance 2/3, not the 1/2 of counting cards (Bertrand's box). A chooser that picks only between faces 1 and 3 gives the same red clue with hidden-red chance 1/2, so the answer depends on how the clue was produced; a red clue is fair exactly for the 16 ticket sets containing face 3 and exactly one of faces 1 and 2, and never for a choice of whole cards."
discover = "A clue keeps only the cases that could have produced it, so the way a clue was chosen changes the answer."
gem = "Bertrand's box paradox resolved with six tickets, plus a clean description of every fair chooser."
concepts = ["conditional-probability", "equally-likely"]
mechanisms = ["every-case", "counterexample", "construct"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs the rules read aloud; 2–3 reads little and counts small sets; 4–5 reads a friend's argument and works with fractions."
arithmetic = "Counts up to six; fractions are optional and used in 4–5."
materials = ["three same-size two-sided cards RR, RB, BB with numbered faces per kit", "six numbered tickets and a cup per kit", "a folder as a screen and covers for the face numbers", "five kits for eleven children, so every pair plays the opening rounds (three if pairs take turns)"]
prep = "Make five card-and-ticket kits (three if pairs take turns) and check that nothing shows through; light. Physically unrehearsed."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must-fix. The should-fixes were made October 23, 2026 in the new problem files and the guide: page 1 gives only the clue rule, page 3 says only tickets 1 and 3 are in the cup, grades 2–3 Problem 1 asks for every pair that shows alike but hides differently, grades 4–5 Problem 3 weighs three facts about the covered number, method sentences cut, spare K–1 answer slots; the guide has a 35–40 minute plan, paired opening rounds and a hint and an extension per problem; the bonus guide prints 3 × 2 × 2 = 12."
app = "Hidden sides"
app_decision = "in app"

