week = "24"
title = "Three random decks"
hook = "Draw one card from each of two small decks, the larger card wins, and compare every pair to find decks that beat each other in a circle."
math = "With A = (2, 4, 9), B = (1, 6, 8) and C = (3, 5, 7), each deck beats the next on 5 of the 9 equally likely card pairs, so 'beats' runs in a circle though every deck totals 15; copying every card equally keeps the chances, while copying only some changes them. For equal-size decks with no value in two decks a cycle needs three cards per deck, since with two cards a deck wins a majority exactly when each of its sorted cards beats the matching one, which is transitive; with cards 1–9 no cycle has all three arrows at 6/9 or more."
discover = "Winning more pairs is not transitive, deck totals do not decide it, and decks of two cards cannot make a cycle."
gem = "Nontransitive dice at their smallest size, with sharp bounds a child proves by pointing at cards."
concepts = ["nontransitive", "equally-likely", "listing-cases"]
mechanisms = ["every-case", "construct", "extremal"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none with an adult reading and every pair pictured; 2–3 and 4–5 read short tasks, with a few longer game rules (the opening pick-first game, the Grades 2–3 hidden-bag game)."
arithmetic = "K–1 uses dot cards to 9; 2–3 numbers to 12 and sums to 21; 4–5 exact chances such as 7/16 with repeated cards."
materials = ["three small paper bags per table", "58 number cards cut from index cards (originals, spares in pencil, 0 and 10–12), with ten-frame dots for K–1", "eighteen counters per table, no wider than 1/2 inch", "three removable letter slips for the Grades 2–3 bags"]
prep = "Once, about 30 minutes to write the 58 cards (spares in pencil), label the bags and make the Grades 2–3 letter slips; then 10–15 minutes before each session to print pages and check every bag."
status = "unpiloted"
verdict = "keep"
verdict_note = "Original verdict keep. On October 23, 2026 the student pages became problem files and all five shoulds and seven coulds were made (K–1 F24-K-v3: Problems 1–3 begin with the action, Problem 4 names the deck to beat, Problem 6 resets each swap; Grades 4–5 F24-45-v3: Problem 1 decks clear the prompt), with guide fixes to the four-card gate sentence, materials and time, the counters, the bags, the title and a 35–40 minute plan. On November 6, 2026 James approved the kid-fit revision (F24-K-v4, F24-23-v3, F24-45-v4; unpiloted): every band opens with a short game as Problem 1, K–1 gets ten-frame dots, a cycle triangle and a swap grid, Grades 2–3 P3 becomes a hidden-bag guessing game, and the guide (2026-11-06) says the games cannot show the 5-to-4 cycle, which appears only by counting all the card pairs. On November 7, 2026, after an adult cold read found Problem 1 unclear in every band, page 1 of each band shows the three decks before the game and the pick-first table has a shaded example row (F24-K-v5, F24-23-v4, F24-45-v5; approved by James), and a one-page adult table card was added."
app = "Three decks"
app_decision = "in app"

