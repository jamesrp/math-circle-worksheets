week = "24"
title = "Three random decks"
hook = "Draw one card from each of two small decks, the larger card wins, and compare every pair to find decks that beat each other in a circle."
math = "With A = (2, 4, 9), B = (1, 6, 8) and C = (3, 5, 7), each deck beats the next on 5 of the 9 equally likely card pairs, so 'beats' runs in a circle though every deck totals 15; copying every card equally keeps the chances, while copying only some changes them. For equal-size decks with no value in two decks a cycle needs three cards per deck, since with two cards a deck wins a majority exactly when each of its sorted cards beats the matching one, which is transitive; with cards 1–9 no cycle has all three arrows at 6/9 or more."
discover = "Winning more pairs is not transitive, deck totals do not decide it, and decks of two cards cannot make a cycle."
gem = "Nontransitive dice at their smallest size, with sharp bounds a child proves by pointing at cards."
concepts = ["nontransitive", "equally-likely", "listing-cases"]
mechanisms = ["every-case", "construct", "extremal"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none with an adult reading and every pair pictured; 2–3 and 4–5 read short tasks."
arithmetic = "K–1 uses dot cards to 9; 2–3 numbers to 12 and sums to 21; 4–5 exact chances such as 7/16 with repeated cards."
materials = ["three opaque bags or identical-backed decks per table", "number cards 1–12 with spares (about 57 cards to make)", "counters in two styles"]
prep = "Make the card decks (index cards work) and check every bag; 10–15 minutes plus card making."
status = "unpiloted"
verdict = "keep"
app = "Three decks"
