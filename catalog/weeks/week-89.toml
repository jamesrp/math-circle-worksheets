week = "89"
title = "Growing shapes and totals"
hook = "Grow a square, staircase or rectangle one layer of tiles at a time and count what each new layer adds."
math = "If a shape with a_n tiles grows by keeping its tiles, the new layer has a_(n+1) − a_n tiles: 2n + 1 for squares, n + 1 for staircases and 2n + 2 for n × (n + 1) rectangles, and two staircases make a rectangle, so 1 + … + n = n(n + 1)/2. Running totals and differences undo each other up to the starting value, and a two-stage cascade gives B_N = N·u_1 + (N − 1)·u_2 + … + u_N, so larger inputs first maximise the final total. Four pictures never force the fifth: a continuation is a rule assumed or derived, not read off a sample."
discover = "The layer added tells how the total grows, and adding up the layers gives the total back."
gem = "The fundamental theorem of calculus with tiles and trays: differences and running totals undo each other."
concepts = ["differences-sums", "recurrence"]
uses = []
mechanisms = ["double-count", "work-backward", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 grows and handles layers with adult reading and counting; older bands read short tasks."
arithmetic = "Counting and addition for totals; hidden inputs need subtraction; cascade order uses multiplication."
materials = ["up to 72 matching 20 mm square tiles per pair and two printed boards", "for machines: two receiving trays, an input tray, 40 counters and blank total cards", "a shared 64-cube kit for cube shells"]
prep = "15–25 minutes with existing tiles and trays; cut the input deck once."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must-fix. The should-fixes were made on October 23, 2026 in the new problem files and the guide: Problem 19's cubes drawn in depth order, Problem 18's worked turn moved off the task's path, a non-task opening example, Problem 2 now peels the square layer by layer, Problem 20 reworded, and a K–1 return route with adult reading."
app = ""
app_decision = "open"

