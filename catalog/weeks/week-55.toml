week = "55"
title = "Few sums and equal spacing"
hook = "Choose number cards for two sets A and B, drop a counter on a 0–18 strip for every total a + b, and see how few different totals you can make."
math = "For finite sets of integers with m and n elements, m + n − 1 ≤ |A + B| ≤ mn. When m, n ≥ 2 the minimum occurs exactly when A and B are arithmetic progressions with the same gap; a one-card set only shifts the other. Any right/up route through the sorted addition table passes m + n − 1 strictly increasing totals, which proves the bound, and swapping a route around one square forces the equal gaps."
discover = "Totals collide most when both sets are equally spaced with a common gap, and a staircase in the addition grid proves nothing does better."
gem = "The simplest inverse theorem of additive combinatorics, with a proof a child can trace with a finger."
concepts = ["sumsets", "optimization"]
uses = []
mechanisms = ["extremal", "certificate", "construct"]
bands = ["2-3", "4-5"]
reading = "An adult reads the six rules on p. 1; later problems are short questions."
arithmetic = "Adding numbers 0–9 to totals of 18; Problems 9–10 use letters for card counts and mn for pairs."
materials = ["two labelled decks of number cards 0–9 per pair (A and B)", "for each K–1 pair, A and B dot cards 0–6", "20 counters 8–10 mm per pair"]
prep = "Make paper number cards about 25 × 35 mm or label an existing deck, and 28 dot cards 0–6 for the K–1 pairs; print the landscape pages at 100%."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must. October 23, 2026: the card's shoulds and small coulds fixed, including an adult-led K–1 route on student pp. 1–3 with dot cards in the guide."
app = "Card totals"
app_decision = "in app"

