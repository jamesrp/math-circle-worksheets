week = "43"
title = "Shuffling picture cards"
hook = "Shuffle three picture cards by drawing numbered tickets from a cup and swapping slots, and check whether every order of the cards is equally likely."
math = "Left-to-right Fisher–Yates (swap slot 1 with a slot drawn from 1–3, then slot 2 with one drawn from 2–3) has six equally likely ticket stories, exactly one for each order, so it is fair from any start; for n cards it has n! stories, one per order. The tempting rule that draws from all three slots at every step has 27 equally likely stories, which cannot split evenly over six orders (the counts are 4, 5, 5, 5, 4, 4), and forbidding self-swaps reaches only BCA and CAB."
discover = "A shuffle is fair when each order has exactly one ticket story, and 27 equally likely stories can never share fairly among six orders."
gem = "The classic shuffling bug refuted by divisibility alone: 27 is not a multiple of 6."
concepts = ["fair-randomness", "permutations", "bijection"]
uses = ["equally-likely"]
mechanisms = ["pair-up", "every-case", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs positional language with an adult reading; 2–3 has each rule read once by an adult; 4–5 reads short proof prompts."
arithmetic = "None at K–1; 2–3 shares 27 into six piles; 4–5 uses division with remainder."
materials = ["a card kit per pair, plus one per adult table: picture cards A–E at 1.7 × 2.2 in, tickets 1–5 and a three-slot strip (printed in week-43-materials.pdf)", "a cup per pair"]
prep = "Print one card-stock kit sheet per pair and one per adult table at 100% and cut it out; add cups. Physically unrehearsed."
status = "unpiloted"
verdict = "revised"
verdict_note = "Original verdict revise. The must-fix, K–1 Problem 2's crossed-out cards that also read as 'this card can't be first', was fixed on October 23, 2026 in the new problem files: each card is printed as the card drawn first, and the guide key matches. K–1 should-fixes 4–5 (no chance wording, larger Problem 3 records) were taken too. Later that day shoulds 2, 3, 6, 7 and 8 followed: spare answer rows, Grades 2–3 Problem 4 now has children shuffle six times and judge the claim, method sentences moved to the guide's hints, the all-slots demonstration no longer gives away a Problem 5 answer, and week-43-materials.pdf prints the cards, tickets and strip; coulds 10, 11 (in part) and 14 too. Unpiloted; the kit is physically unrehearsed. A critic's follow-up the same day gave K–1 Problem 2 three rows per first card, enlarged K–1 Problem 3's ticket boxes and added a second 2 and 3 to the kit (W43-k-1-v4)."
app = "Ticket shuffles"
app_decision = "in app"

