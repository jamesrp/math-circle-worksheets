week = "9"
title = "Bouncing paths"
hook = "Send a ball at 45 degrees from a corner of a grid table, trace its bounces, and predict which corner it stops in."
math = "A ball leaving a corner of a w by h grid table at 45° stops at the first corner it reaches. Unfolded through mirror copies of the table its path is a straight line; with the table reduced to p wide by q high in lowest terms, it stops on the right exactly when q is odd, at the top exactly when p is odd, after p + q − 2 bounces, so scaling the table changes nothing and the ball never returns to its start."
discover = "Only the table's shape in lowest terms matters, a parity rule predicts the corner, and the ball never comes home."
gem = "Folding the copies back up turns a straight line into the bouncing path: billiards on a rectangle is a straight line on a torus in disguise."
concepts = ["reflection", "lcm", "parity", "gcd"]
mechanisms = ["unfold", "invariant", "every-case"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none with sentences read aloud; 2–3 has two problems of about 80 words; 4–5 reads short tasks."
arithmetic = "K–1 counts to 6; 2–3 halves and doubles; 4–5 uses common multiples and lowest terms."
materials = ["counters in two colours", "12-inch rulers", "crayons and coloured pencils", "fine black markers", "scissors and clear tape for the folding sheets", "masking tape (about 60 ft) for a floor grid", "a window or lamp for folding"]
prep = "Tape a 3 by 5 floor grid for the launch and test one folding sheet against a window."
status = "unpiloted"
verdict = "revise"
verdict_note = "The guide's K–1 walking rule says to keep going up after a side wall, which is wrong once the ball is coming down, so an adult may correct a child who bounced correctly."
app = "Mirror Couriers"
app_decision = "in app"

