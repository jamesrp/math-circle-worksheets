week = "16"
title = "Three-color triangles"
hook = "Label the dots of a triangulated triangle R, B or Y, following the rule for each side, and count the little triangles that get all three letters."
math = "If the big triangle's corners are R, B and Y, each side's dots use only that side's two corner letters and inside dots are free, then every edge-to-edge triangulation has an odd number of little triangles with all three letters (Sperner's lemma). Call an R–B edge a door: an all-three cell has exactly one door and every other cell zero or two, while the R…B side carries an odd number of doors, so pairing door incidences (T + 2U = b + 2I) or following door routes leaves an odd count. Relaxing one side rule can make the count zero."
discover = "However the dots are labelled, an odd number of all-three triangles appears, and breaking a side rule can make them vanish."
gem = "The door-path proof of Sperner's lemma, the combinatorial heart of Brouwer's fixed-point theorem, carried out with counters."
concepts = ["sperner", "parity"]
mechanisms = ["double-count", "pair-up", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none, with side rules spoken; 2–3 reads R/B/Y and a five-sentence definition of doors and routes; 4–5 reads short tasks."
arithmetic = "K–1 uses small counts; 2–3 tells odd from even by pairing; 4–5 counts doors and cells."
materials = ["counters lettered R, B and Y (about 45 per K–1 set)", "coloured pencils, three colours"]
prep = "Letter the K–1 counters and test their fit on the largest board."
status = "unpiloted"
verdict = "keep"
app = "Rainbow triangles"
app_decision = "in app"

