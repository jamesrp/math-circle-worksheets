week = "46"
title = "Two boards forget their starts"
hook = "Apply the same instruction cards, such as 'slot 2 becomes blue', to two rows of red and blue counters, and find stories that make any two starting rows end the same."
math = "Two three-slot boards need exactly as many shared colour-setting instructions as the slots where they differ (their Hamming distance), and a fixed story makes all eight starts agree exactly when it sets every slot; with u slots never set, 2^u finishes remain. Shared toggles permute the boards, so they never merge two, and a mixed story forgets its start exactly when every slot is set at least once. With random cards, once every slot has been set the final board is uniform whatever the start, yet no fixed number of draws guarantees that every slot is set."
discover = "Setting a slot erases what was there, toggling never does, and once every slot has been set the start is forgotten."
gem = "Coupling in miniature: covering every slot is a strong uniform time for the random walk on the cube."
concepts = ["coupling", "permutations"]
mechanisms = ["invariant", "every-case", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 hears short prompts and reads pictured cards; 2–3 needs an adult to read 'guarantee', 'toggle' and 'colour-setting'; 4–5 reads explanation prompts."
arithmetic = "Counting to three; 4–5 counts eight boards and equal-weight choices, with fractions optional."
materials = ["two three-slot strips and six reversible R/B counters per pair, counters at most 1.4 cm across to fit the printed cells", "six instruction cards 1R–3B, cut from a spare random-draw page, and a cup per pair", "three small markers per pair"]
prep = "Cut five card sets from a spare page and try a setting instruction against a toggle once; light. Physically unrehearsed."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must-fix. The should-fixes were made October 23, 2026 in the new problem files and the guide: a launch pair on no page, K–1 Problems 4 and 5 swapped so the first route is P1, P2, P4, P6, P7, \"two different starts\" in three problems, printed toggle pairs and mixed stories for Grades 4–5 Problems 4–5, and a guide with one board per child, one 40-minute plan and a counter size. After a critic's review the same day, the student pages no longer hyphenate (v4)."
app = "Paint rows"
app_decision = "in app"

