week = "13"
title = "Route packing and bottlenecks"
hook = "Draw as many Start-to-Finish routes along arrows as you can without two routes sharing an arrow, then block every route by closing the fewest arrows."
math = "In a directed network where each arrow carries one route, the greatest number of arrow-disjoint Start-to-Finish routes equals the fewest arrows whose closure blocks every route (max-flow equals min-cut), so k routes with k blocking closures prove both optima at once. A stuck collection need not be largest: a change-walk that runs backward along a used arrow reroutes and adds a route, and when none exists the dots still reachable from Start mark out a matching cut."
discover = "A matching pair of routes and roadblocks proves that neither side can do better."
gem = "A real duality theorem in which each side certifies the other, with the augmenting-path proof in reach of 4–5."
concepts = ["flows-cuts", "optimization", "graphs"]
mechanisms = ["certificate", "greedy", "construct"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none, but four rule sentences are read aloud; 2–3 reads short dot labels and lists; 4–5 reads a change-walk definition."
arithmetic = "K–1 counts to three; 2–3 organizes pairs of arrows; 4–5 counts the arrows leaving a set of dots."
materials = ["small paper closure markers (about 12 per child)", "coloured pencils, three colours", "pencil or wipe-off markers with sheet protectors, so routes can be undone"]
prep = "Cut closure markers and test one on a short printed arrow."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must. The card's seven should-fixes and its clear coulds were made on October 23, 2026, in the new problem files (v3 packets): K–1 Problem 3 and grades 4–5 Problem 2 no longer state the certificate, the grades 4–5 change-walk is tried on three boards, K–1 Problem 5 has ten recording copies, and the guide adds erasable route drawing, an illegal shared arrow in the launch, two completed keys and a clearer token proof. Could 13 (a third game board) is deferred."
app = "Routes and roadblocks"
app_decision = "in app"

