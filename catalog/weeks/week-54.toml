week = "54"
title = "Partitions and rebuilding"
hook = "Build every collection of cube strips with a fixed total, then join equal pairs and halve even strips to turn all-odd collections into all-different ones and back."
math = "For every n, partitions of n into odd parts and into distinct parts are equinumerous (Euler). Joining equal pairs maps the odd side to the distinct side, halving even parts inverts it, and the result does not depend on the order of moves, because each odd size u keeps its own family u, 2u, 4u, … and the number of u's has a unique expression as a sum of distinct powers of two. Separately, exchanging rows and columns of a left-aligned diagram is an involution matching partitions with at most k parts to those with all parts at most k."
discover = "The only-odd and all-different catalogs have equal counts for every total, and joining and halving undo each other in any order."
gem = "A bijective proof of Euler's odd-equals-distinct theorem done with cubes, with the uniqueness of binary hidden inside."
concepts = ["partitions", "bijection", "listing-cases"]
uses = []
mechanisms = ["pair-up", "invariant", "every-case"]
bands = ["2-3", "4-5"]
reading = "Grade 3 readers may need an adult to read the three short rules or record sizes; no binary notation."
arithmetic = "Counting to 24, comparing sizes, halving to 12, and recognizing odd and even by pairing."
materials = ["linking cubes, about 24 per kit (2 cm cubes fit; loose squares make joins invisible)", "two paper lanes per kit for the before record and working collection"]
prep = "Count and bag the cube kits and label the lanes; no cutting."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; the missing K–1 route is a should, as the outline recommended no K–1 packet."
app = "Joining strips"
app_decision = "in app"

