week = "79"
title = "Numbered-ball detectives"
hook = "Each day put the next two numbered cards in bowl A and move one card to bowl B, then follow where a chosen card ends up."
math = "Each day two new cards enter bowl A and one moves to B, so both bowls hold n cards after day n under any such rule. Moving A's smallest card sends card k to B on day k, so every card eventually settles in B and A settles empty, though card N + 1 is in A on every day N; moving the larger new card keeps the same counts but leaves every odd card in A forever. The limit of the counts is not the count of the limiting sets (Ross–Littlewood)."
discover = "'Each card leaves by some day' differs from 'all cards leave by one day', and equal counts can hide different limits."
gem = "The Ross–Littlewood paradox with a control rule whose counts match exactly but whose limit is the odd numbers."
concepts = ["infinite-processes", "limits"]
uses = []
mechanisms = ["limit", "invariant", "smaller-cases"]
bands = ["2-3", "4-5"]
reading = "An adult reads the short rule if needed."
arithmetic = "Compare labels and count to 24; add two and remove one each day."
materials = ["cards 1–24 and an A/B mat (printed, cut) or two shallow bowls per pair"]
prep = "Print and cut one card sheet and mat per pair, plus one extra of each per table so two rules can run side by side."
status = "organizer-approved"
verdict = "revised"
verdict_note = "The organizer approved the five-page packet (v1) on October 15; the must, a guide hint false under Problem 3's rule, was corrected October 17. The October 23 revision (v2) post-dates that approval and has not been re-approved: it made the shoulds and coulds, a new chosen-moves Problem 4 for Grades 2–5, entry and move days in Problem 2, both rules side by side, a K–1 route and Problem 5's changed-rule answer in the guide. The approved v1 PDFs are archived; show v2 to the organizer before printing it as the approved packet."
