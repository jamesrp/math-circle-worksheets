week = "41"
title = "Portals"
hook = "Move a pawn on a 3-by-3 board where stepping off one edge brings you back on the opposite edge, and replay the trip on a map of repeated copies."
math = "A square board with opposite edges glued by translation is a torus; a trip from H lifts to the tiled plane and ends in some copy (m, n) of H, its winding pair. Two trips home can be changed into each other by cancelling step-and-reverse pairs and sliding across squares exactly when they end in the same copy, so loops are classified by integer pairs (the fundamental group Z²). On the 3-by-3 board every cell can be reached from H in exactly two steps, and any trip home of odd length must lap the board."
discover = "The copy a trip ends in on the repeated map decides which trips can be changed into each other, and no allowed move changes it."
gem = "The fundamental group of the torus read off as the copy where a pawn's unrolled trail ends."
concepts = ["torus", "winding", "coordinates"]
mechanisms = ["unfold", "invariant"]
bands = ["K-1", "2-3", "4-5"]
reading = "None needed at K–1, with arrows read aloud; 2–3 uses arrow words; 4–5 reads four rule sentences for square slides."
arithmetic = "Counting steps; 4–5 adds signed displacements and divides by 3."
materials = ["two pawns per child; the packets print the portal maps", "tracing paper and an erasable marker", "a 3-by-3 array of 90 mm copies per table, with spares (printed in week-41-materials.pdf, four per sheet)"]
prep = "Print packets at 100% and check that the seam marks match without reversal; print week-41-materials.pdf four times per table, cut the copies apart and lay nine as the array. Physically unrehearsed."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; on October 23, 2026 all eight shoulds and both coulds were fixed in the new problem files and the guide (v3 packets): named maps on page 1, a smaller Grades 2–3 map with lines and a third trip to compare, Grades 4–5 Problems 2 and 3 swapped with pictured moves and Problem 5 on its own page, an open Problem 6, and a printed sheet of 90 mm table copies."
app = "Portal rooms"
app_decision = "in app"

