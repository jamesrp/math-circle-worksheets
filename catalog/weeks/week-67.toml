week = "67"
title = "Meeting on shortest roads"
hook = "Put three home counters on a road map and find a dot that some shortest route for each pair of homes passes through."
math = "A meeting dot m for homes A, B, C satisfies d(A, m) + d(m, B) = d(A, B) for all three pairs. On a full grid there is exactly one, the middle x with the middle y, because a detour-free route between two points stays within their coordinate ranges; on a tree it is the centre of the tripod, on the cube the label with the majority digit in each place, and on a triangle no dot works."
discover = "On grids, trees and cubes three homes always have exactly one meeting dot, but some maps have none."
gem = "These are medians in median graphs: uniqueness is proved one coordinate at a time, and the cube's majority vote is the same middle-value rule."
concepts = ["graph-distance", "distance-rules", "trees"]
uses = []
mechanisms = ["coordinates", "counterexample", "every-case"]
bands = ["2-3", "4-5"]
reading = "An adult reads p. 1's eight sentences; later prompts are short."
arithmetic = "Counting and adding road lengths within 8; three-digit 0/1 labels on the cube page."
materials = ["three home counters marked A, B, C and a smaller meeting counter", "three coloured pencils"]
prep = "Print single-sided at 100%; a clear or ring-shaped meeting counter keeps junctions visible."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; Problem 5 reuses cube maps Problem 4 has already marked, and K–1 has no route by design."
app = "Meeting roads"
app_decision = "in app"

