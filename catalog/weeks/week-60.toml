week = "60"
title = "Take it or pass"
hook = "Roll a stickered die or draw tickets from a bag one offer at a time and decide on the spot whether to keep the offer or give it up for good before the turn counters run out."
math = "With offers drawn independently with replacement from a known bag, a fixed number of offers and no recall, the best average V_m obeys V_1 = E[X] and V_m = E[max(X, V_{m−1})]: take the current offer exactly when it beats V_{m−1}. For tickets 0, 4, 6 this gives 10/3, 40/9 and 134/27, so a 4 is taken with two offers left and passed with three; no plan, even one remembering passed offers, does better, and an extra offer strictly raises the optimum unless every ticket is equal."
discover = "Whether to keep a 4 depends on how many offers remain, and the right comparison is with the best remaining plan, not the next draw."
gem = "The same ticket flips from take to pass as the horizon grows, and backward induction proves a threshold rule beats every plan."
concepts = ["optimal-stopping", "backward-induction", "expected-value"]
uses = ["equally-likely"]
mechanisms = ["work-backward", "every-case"]
bands = ["K-1", "2-3", "4-5"]
reading = "An adult reads p. 1's rules (about ten sentences); later prompts are short. K–1 children follow an adult-led route on pp. 1, 2 and 6: two-offer rounds, then take and pass cube towers by first-offer row."
arithmetic = "Group totals within 18 over the nine or 27 equally likely cases; upper pages compare averages and fractions such as 40/9."
materials = ["a blank die stickered 0, 0, 4, 4, 6, 6 per kit (or an opaque bag of three identical tickets 0, 4, 6 with an offer display)", "four turn counters", "case cards from pp. 2, 3, 6 and 7, scored on the sheet or cut from cardstock", "30 linking cubes for the K–1 towers"]
prep = "Sticker four blank dice and print the case-card pages; cutting the 126 cards is optional (about 15–25 minutes, untested). Rolling, scoring and the towers are unrehearsed."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must. The shoulds were fixed on October 23, 2026: pages 1, 2 and 6 are headed Grades K–5 with an adult-led K–1 route and plain-words key in the guide, page 1 puts out one counter per offer, the page 2 practice rule takes any first offer, Problem 4's cards have A and B lines, Problem 5 asks take or pass with average scores, Problem 7 adds the bag 0, 2, 6, and a stickered die is the default draw. Unpiloted."
app = "Take it or pass"
app_decision = "in app"

