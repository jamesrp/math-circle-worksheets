week = "60"
title = "Take it or pass"
hook = "Draw tickets from a bag one at a time and decide on the spot whether to keep the offer or give it up for good before the turn counters run out."
math = "With offers drawn independently with replacement from a known bag, a fixed number of offers and no recall, the best average V_m obeys V_1 = E[X] and V_m = E[max(X, V_{m−1})]: take the current offer exactly when it beats V_{m−1}. For tickets 0, 4, 6 this gives 10/3, 40/9 and 134/27, so a 4 is taken with two offers left and passed with three; no plan, even one remembering passed offers, does better, and an extra offer strictly raises the optimum unless every ticket is equal."
discover = "Whether to keep a 4 depends on how many offers remain, and the right comparison is with the best remaining plan, not the next draw."
gem = "The same ticket flips from take to pass as the horizon grows, and backward induction proves a threshold rule beats every plan."
concepts = ["optimal-stopping", "backward-induction", "expected-value"]
uses = ["equally-likely"]
mechanisms = ["work-backward", "every-case"]
bands = ["2-3", "4-5"]
reading = "An adult reads p. 1's rules (about ten sentences); later prompts are short."
arithmetic = "Group totals within 18 over the nine or 27 equally likely cases; upper pages compare averages and fractions such as 40/9."
materials = ["an opaque bag with three identical tickets 0, 4, 6 per kit (later 0, 3, 6 and 0, 5, 6)", "four turn counters", "an offer display and Take/Pass places", "cut case cards from pp. 2, 3 and 6 on cardstock"]
prep = "Make indistinguishable tickets and cut 108 case cards; forecast 15–25 minutes; the return-and-mix ritual is unrehearsed."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; the missing K–1 band is a should, since the week is routed to Grades 3–5."
app = "Take it or pass"
app_decision = "in app"

