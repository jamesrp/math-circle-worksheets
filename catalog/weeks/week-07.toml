week = "7"
title = "Take-away games"
hook = "Take turns removing 1 or 2 counters (or another allowed amount) from a pile, last counter wins, and find the piles you want to hand your opponent."
math = "Label 0 as a pile to hand over and work up: a pile is one to hand over exactly when every allowed move from it reaches a pile that is not. With moves 1 to k these are the multiples of k + 1, with 1, 3 or 4 they are the piles that leave 0 or 2 on division by 7, and for any finite menu the labels eventually repeat, since each depends only on finitely many below it (pigeonhole). Equal piles lose by copying, and with moves 1 or 2 two piles lose exactly when their remainders mod 3 agree, the smallest case of Sprague–Grundy."
discover = "Working back from 0 sorts every pile into win or lose, and the pattern repeats in a way that depends on the menu."
gem = "Backward induction with a pigeonhole proof that every finite menu becomes periodic, and a first glimpse of Sprague–Grundy in two-pile remainders."
concepts = ["take-away-games", "backward-induction", "remainders", "copying-strategies"]
uses = ["divisibility"]
mechanisms = ["work-backward", "pigeonhole", "copying"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 hears one or two sentences per problem; 2–3 reads short tasks with two named players' claims to test; 4–5 has one dense problem (Kai)."
arithmetic = "K–1 counts to 10; 2–3 counts to 20 and uses sevens in one problem; 4–5 uses remainders and repeats up to period 11."
materials = ["counters (about 100)", "small tokens for the number track", "light coloured pencils", "small whiteboards (2–3, 4–5)"]
prep = "Count counters into table cups and check that a token fits the 0.68-inch track squares; nothing to cut."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; the guide's claim that the last-counter-loses shift is special to moves 1 to k, and its reply table, were corrected on October 23, 2026. After the problem-file conversion the same day, the pages carry the card's wording for K–1 Problems 3, 8 and 9 and label the extra 2–3 track. A critic's follow-up the same day made K–1 Problems 6–7 say \"taking turns going first\", trimmed K–1 Problem 8 and completed its key (F07-K-v6, F07-FAC-v6)."
app = "Move menus in Pebble Duel"
app_decision = "in app"

