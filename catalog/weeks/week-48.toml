week = "48"
title = "Inside and outside covers"
hook = "Cover a grey shape with paper squares, count the squares wholly inside and those touching any grey, then split squares into four to trap the area more tightly."
math = "The cells wholly inside a polygon bound its area from below and the cells containing any part of it bound it from above; splitting a cell into four can only raise the first bound and lower the second (inner and outer Jordan content). A marking with w whole and p partial cells allows exactly the areas strictly between w and w + p, and a split removes at most its own cell's uncertainty, so a limited budget of splits belongs to cells whose children are all whole or outside."
discover = "Two counts trap the area, refining never loosens the trap, and shapes with the same marking can have different areas."
gem = "Jordan content made physical, with a sharp open interval and a budget problem whose best splits are certified cell by cell."
concepts = ["area-bounds", "area"]
mechanisms = ["monovariant", "certificate", "construct"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 makes visual whole/partial/outside decisions while an adult reads and counts; upper bands read short tasks."
arithmetic = "K–1 counts tiles; 2–3 counts to 40 and groups fours; 4–5 works in quarters, with fraction symbols optional."
materials = ["16 paper squares of 30 mm and 12 of 15 mm per pair, cut from spare blank boards", "tracing paper or sleeves and two colours"]
prep = "Cut the paper squares from spare copies of the blank board and print boards at actual size."
status = "unpiloted"
verdict = "keep"
app = "Area traps"
app_decision = "in app"

