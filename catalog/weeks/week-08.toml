week = "8"
title = "Rook race and Nim"
hook = "Take turns sliding a token left or down toward a star in the corner, and discover that the board is two piles of counters in disguise."
math = "A start is a second-player win when every move leads to a first-player win. The rook race at (a, b) is two-pile Nim, so the second-player squares are the diagonal and copying keeps the token there; with any number of piles the second player wins exactly when every stack size 1, 2, 4, 8, … occurs an even number of times (Bouton), since a move breaks a pair and rebuilding the pile with the largest unpaired stack restores them. The queen game's second-player squares are Wythoff's pairs (1, 2), (3, 5), (4, 7), … with differences 1, 2, 3."
discover = "Equal piles are the positions to leave, copying keeps them equal, and with three piles the stacks of 1, 2, 4, 8 must pair up."
gem = "Bouton's theorem, whose proof a 4–5 child can give with stacks of counters, with Wythoff's pairs as a coda."
concepts = ["nim", "copying-strategies", "place-value", "backward-induction"]
uses = ["take-away-games"]
mechanisms = ["copying", "invariant", "work-backward"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 hears one or two sentences per problem; 2–3 reads short tasks; 4–5 has one denser reading problem."
arithmetic = "K–1 counts to 7; 2–3 subtracts two-digit numbers such as 52 − 37; 4–5 builds stacks of 1, 2, 4, 8, 16 up to 21."
materials = ["tokens (a small triangle or counter)", "counters (about 200)", "printed 8-by-8 and 5-by-5 game boards with 1-inch squares (or a checkerboard with a star sticker)", "green and red pencils", "small whiteboards"]
prep = "Print the game boards at 100% after checking the 10 cm line on one sheet (seven 8-by-8, three 5-by-5) and count counters into cups."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; the separate game boards became a printable PDF on October 23, 2026 (physically unrehearsed), with the guide's should-fixes. The K–1 Problem 7 wording waits for the problem-file conversion."
app = "Pebble Duel"
app_decision = "in app"

