week = "100"
title = "Distance in nested worlds"
hook = "Put cards inside nested labelled loops, read each pair's distance from the smallest loop holding both, and test which triangles of distances can happen."
math = "If cards sit in nested groups whose labels increase outward and the distance of two cards is the label of their smallest common group, then d(A, C) ≤ max(d(A, B), d(B, C)): in every triangle the largest distance occurs at least twice, so 2, 4, 4 and 4, 4, 4 occur but 2, 2, 4 cannot. Every card in a ball is a centre of it, two balls never partly overlap, and a complete valid distance table rebuilds the groups. The 2-adic distance on 0–7, set by the power of 2 dividing a − b, is an example."
discover = "In nested worlds the two longest sides of every triangle are equal, and any card in a ball can be its centre."
gem = "Ultrametric geometry, home of the p-adic numbers, built from loops of cord: every triangle is isosceles and every point is a centre."
concepts = ["distance-rules", "trees"]
uses = ["remainders"]
mechanisms = ["construct", "counterexample"]
bands = ["2-3", "4-5"]
reading = "Compare labels and read short clue cards; adult reading supports a ready younger child. Recommended Grades 3–5, with no K–1 packet."
arithmetic = "Comparing numbers; the optional number route needs parity and remainders mod 2, 4 and 8."
materials = ["six letter-and-shape cards A–F per pair", "transparent frames or cord loops with labels 2, 4 and 8", "pair-distance clue cards and number cards 0–7 cut from extra copies of pages 1, 4, 5 and 7", "a large workmat"]
prep = "About 20 minutes by hand for three kits and a demonstration board."
status = "unpiloted"
verdict = "none"
verdict_note = "No review card yet."
app = ""
app_decision = "open"

