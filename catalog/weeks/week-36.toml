week = "36"
title = "Making threes"
hook = "Sort nine shape-and-fill tiles into threes where each feature is all the same or all different, and find the most tiles you can hold with no such three."
math = "The nine tiles are the plane over the integers mod 3 and the allowed threes are its 12 lines: any two tiles have exactly one completing tile, four threes pass through each tile, and the threes fall into exactly four splits of the nine tiles. At most four tiles avoid a three (five tiles have ten pairs, but each of the four leftover tiles can complete at most two), and every three-free set of three extends in exactly three ways, so the adding game always lasts four moves and the second player wins."
discover = "Every pair has one completing tile, the nine tiles split into threes in exactly four ways, and four is the most with no three however you choose."
gem = "The smallest cap set, the affine plane AG(2,3), with a pigeonhole proof children can act out using ten pair markers in four dishes."
concepts = ["finite-geometry", "listing-cases"]
mechanisms = ["pigeonhole", "every-case", "construct"]
bands = ["K-1", "2-3", "4-5"]
reading = "None needed at K–1, where adults read; 2–3 reads short sentences; 4–5 writes explanations."
arithmetic = "None; judging two attributes at once is the demand."
materials = ["a set of nine 60 mm shape-and-fill tiles per child, cut from the packet's tile page on card stock", "selection counters and a tray", "ten pair markers and four dishes for the optional 4–5 proof"]
prep = "Print and cut tile sets and rehearse the two-attribute check; the guide estimates 20–35 minutes the first time."
status = "unpiloted"
verdict = "keep"
app = "Trios"
app_decision = "in app"

