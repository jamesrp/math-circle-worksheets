week = "36"
title = "Making threes"
hook = "Sort nine shape-and-fill tiles into threes where each feature is all the same or all different, and find the most tiles you can hold with no such three."
math = "The nine tiles are the plane over the integers mod 3 and the allowed threes are its 12 lines: any two tiles have exactly one completing tile, four threes pass through each tile, and the threes fall into exactly four splits of the nine tiles. At most four tiles avoid a three (five tiles have ten pairs, but each of the four leftover tiles can complete at most two), and every three-free set of three extends in exactly three ways, so the adding game always lasts four moves and the second player wins."
discover = "Every pair has one completing tile, the nine tiles split into threes in exactly four ways, and four is the most with no three however you choose."
gem = "The smallest cap set, the affine plane AG(2,3), with a pigeonhole proof children can act out using ten pair markers in four dishes."
concepts = ["finite-geometry", "listing-cases"]
mechanisms = ["pigeonhole", "every-case", "construct"]
bands = ["K-1", "2-3", "4-5"]
reading = "None needed at K–1, where adults read; 2–3 reads short sentences; 4–5 reads a short game rule and writes explanations."
arithmetic = "None; judging two attributes at once is the demand."
materials = ["a set of nine 60 mm shape-and-fill tiles per K–1 child and per older pair, cut from the packet's tile page on card stock", "counters to mark chosen tiles", "coloured pencils, three colours per child, for recording splits and threes", "ten pair markers and four dishes for the optional 4–5 proof"]
prep = "Print K–1 page 5 on card stock once per child, plus one, and cut nine 60 mm tiles from each; rehearse the two-attribute check. The guide estimates 20–35 minutes the first time."
status = "unpiloted"
verdict = "keep"
verdict_note = "Keep. The card's shoulds and clear coulds were made October 23 (v3): tiles printed from the packet, record-board facts and a shapes-only fallback in the guide, six split boards and open questions in Grades 4–5 Problems 1 and 4. After a critic's review the same day, the guide's straight-line warning names every printed nine-tile grid. On November 6 James approved the kid-fit revision (v4, 5 pages per band): partners or a third player check the threes, K–1 places real tiles in Problem 1 and meets the middle-tile problem before the most-tiles search, Grades 2–3 gets split boards and a game page, and Grades 4–5 plays Problem 5 as a refereed game; the guide was updated to match. On November 17 an adult cold read of the v4 pages found the rule clear but the tile handling vague, so v5 (wording only, same pages) says where tiles go (K–1 big boxes, mat rows, the middle square with every line through it an allowed three), marks choices with counters and records splits and threes in colours; only the guide's footer changed. On November 18, for the two-level print rule, a Grades 2–5 packet (6 pages) joined the three: the 2–3 problems with the 4–5 every-split problem, no wording changed. Room plan for the December 9 circle, with Blokus and Genius Square as free-choice tables: plans/room-plans/2026-12-09-set.md."
app = "Trios"
app_decision = "in app"

