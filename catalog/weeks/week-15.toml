week = "15"
title = "Nearest-site regions"
hook = "Use string to decide which printed dot each place is closest to, draw the dividing lines, then place new dots to make a region of a given shape."
math = "Each site owns the closed set of points at least as near to it as to any other site; two sites split the plane along their perpendicular bisector, and a cell is an intersection of half-planes, hence convex. A third site can erase part of a bisector, four sites on a circle meet at one point, adding a site only shrinks old cells, and reflecting a site across each edge of a convex polygon (with no other sites present) makes that polygon its cell."
discover = "The line of ties between two dots is straight, every region is convex, and a new dot only takes territory away."
gem = "Voronoi cells, with an inverse construction by reflection and a convexity proof that some targets are impossible."
concepts = ["nearest-regions", "convexity", "reflection"]
uses = ["length"]
mechanisms = ["construct", "unfold", "certificate"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none with an adult reading; 2–3 reads little; 4–5 reads short proof questions."
arithmetic = "None required: lengths are compared with string, and coordinates are adult checks."
materials = ["non-stretch string, about 12 inches per child", "straightedges", "translucent foldable paper"]
prep = "Pre-cut string and try one fold before the meeting."
status = "piloted"
verdict = "keep"
app = "Nearest dots"
app_decision = "in app"

