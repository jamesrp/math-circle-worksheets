week = "40"
title = "Loop colors"
hook = "Colour each arc of a knot drawing red, blue or green so every crossing is all one colour or all three, and try to untangle real closed cords."
math = "Colour each arc of a knot diagram with three colours so that at every crossing the three arcs meeting there are all the same or all different. Reidemeister moves match colourings one to one, so the number of colourings is a knot invariant: the trefoil has 9 and a plain loop 3, so a closed overhand knot can never become a plain loop. The certificate works one way only: the figure-eight knot also has 3 colourings and is still knotted."
discover = "Counting colourings proves a loop can't be untangled, while equal counts prove nothing."
gem = "Fox tricolouring, the first knot invariant, gives a nine-against-three certificate children can hold."
concepts = ["knots", "listing-cases"]
mechanisms = ["invariant", "every-case", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs little reading but steady adult help tracing arcs; 2–3 reads little; 4–5 writes explanations."
arithmetic = "None; no modular arithmetic is required."
materials = ["four thick closed cords per table, 400–600 mm, tagged A–D: a plain loop (A), a trefoil (C) and two tangled unknots (B, D), adult-made with overlapped, taped ends", "red, blue and green markers", "tracing paper"]
prep = "Make and check the cord models (tie the trefoil the right way round, overlap and tape the ends, tag them A–D) and test the markers on the diagrams; the cord pretest has not been done."
status = "unpiloted"
verdict = "keep"
verdict_note = "Keep. The card's shoulds and coulds were made October 23 (v3): Problem 1 counts the figure-eight's arcs, K–1 completes crossings before the trefoil, the end dot R is S, a nine-row table for the two-crossing move, a curl, a slide and a drawn figure-eight in grades 4–5, and one 40-minute route per band with taped cords and crossing referees in the guide."
app = "Knot colours"
app_decision = "in app"

