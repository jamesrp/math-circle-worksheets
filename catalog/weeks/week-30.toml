week = "30"
title = "Two-pan weight kits"
hook = "Put weight cards beside a target, opposite it or off the balance to make the pans equal, and choose the next weight so no target in a run is missed."
math = "With one copy of each weight, each placed beside the target, opposite it or off, the kit 1, 3, 9, …, 3^(m−1) balances every target from 1 to (3^m − 1)/2 in exactly one way (balanced ternary). No m weights balance more distinct targets, even with gaps, because the 3^m placements pair each positive difference with a negative one around the all-off zero; adding 2S + 1 to a kit with total S extends its run with no gap or overlap."
discover = "Putting a weight beside the target helps, and the best next weight is twice the total so far plus one."
gem = "Balanced ternary appears as the unique best answer to a shopping question, with a counting bound that matches it exactly."
concepts = ["balanced-ternary", "place-value", "optimization"]
mechanisms = ["certificate", "pair-up", "smaller-cases"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 hears one- or two-sentence problems; upper bands read short tasks."
arithmetic = "K–1 totals to 6, and 13 with support in the last problem; 2–3 adds to 13, then reasons about runs to 40; 4–5 reaches 121, with powers as repeated groups of three."
materials = ["linking-cube sticks of 1, 2, 3, 4, 7, 8, 9 and 10 units per pair (44 cubes), or Cuisenaire rods", "target sticks in another colour", "a two-pan mat per pair on which each pan's sticks lie end to end, so equal row lengths balance", "paper cards for 27, 81 and big targets, plus blanks"]
prep = "About 15 minutes to snap five pair-kits of sticks (about 220 cubes) and set out target cubes; deal only the current kit, since two 1-sticks break the rules. The stick kit is unrehearsed."
status = "unpiloted"
verdict = "keep"
verdict_note = "Original verdict keep. On October 23, 2026 the student pages became problem files and all seven shoulds and five coulds were made (v3 packets: three boards per kit in Grades 2–3 Problem 4, the most any three-weight kit can balance in Grades 4–5 Problem 5, two labelled rows in K–1 Problem 3, target boxes 1–14 and blank boards in Grades 2–3, a new launch example), with self-checking cube-stick weights, a 35–40 minute plan and two bonus-guide wording fixes. After a critic's review the same day, Grades 4–5 Problem 5 asks for the largest number of different positive targets any three-weight kit can balance (F30-45-v4)."
app = "Weight kits in the Odd-pebble Balance"
app_decision = "in app"

