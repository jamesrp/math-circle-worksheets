week = "27"
title = "Stable pairings"
hook = "Pair circle letters with square letters using each letter's ranked preference strip, then hunt for two letters who would both rather be with each other."
math = "Take two sides of n letters, each ranking the whole other side with no ties; a pairing is stable when no two letters in different pairs both prefer each other to their partners. Deferred acceptance (askers propose down their lists, receivers hold their best offer so far) stops within n² requests at a stable pairing, because a receiver's held choice only improves. Stable pairings can be several, need not give everyone a first choice, and depend on which side asks; in a stable three-pair market at most three letters get their last choice."
discover = "A blocking pair needs both letters to want the switch, a stable pairing always exists, and which side asks can change it."
gem = "Gale–Shapley: a naive proposal process provably ends in a stable pairing, and the proof is one improving-hold argument."
concepts = ["stable-matching", "algorithms", "listing-cases"]
mechanisms = ["monovariant", "every-case", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 recognises four labels while an adult reads the strips; 2–3 tracks three or four pairs and an adult may read every strip; 4–5 tracks holds and a request record."
arithmetic = "None beyond comparing ranks; 4–5 bounds the number of requests."
materials = ["tokens A–D and W–Z, four links and a dashed link per table (printed in week-27-materials.pdf)", "a printed card for every case's preference strips, ready to cut", "K–1 letter tiles and Grades 4–5 'already asked' markers (in the kit)"]
prep = "Print three card-stock sheets per table band at 100% and cut the tokens, links and case cards: about 10 minutes per table. Physically unrehearsed."
status = "unpiloted"
verdict = "revised"
verdict_note = "Original verdict revise. The must-fix, a full-size kit of tokens, strips, links and markers that nothing supplied, was fixed on October 23, 2026 with week-27-materials.pdf, which prints every case's strips ready to cut, together with should-fix 2 (a launch profile printed in no packet). The same day the student pages moved to problem files and got the card's other shoulds and clear coulds: a blocking-pair wording for Grades 2–3 Problem 1, six boards for Problem 4, labelled Grades 4–5 record boxes, and in the guide a start in P1 instead of a gate, a two-voice check, a sufficient request bound with the sharper 13 and held notes. The kit is physically unrehearsed."
app = "Pairs that stay"
app_decision = "in app"

