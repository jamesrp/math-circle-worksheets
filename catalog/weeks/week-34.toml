week = "34"
title = "Hidden turns"
hook = "Colour the spots of a ring with counters so that a partner turning or flipping a tracing copy can never find a matching position."
math = "A colouring of the n spots of a regular ring is distinguishing when no rotation or reflection but the identity carries it to itself. With two kinds on 3, 4 or 5 spots the smaller kind has at most two spots and some flip fixes them, so three kinds are needed; from six spots on, one kind at spots 0, 1, 3 makes the gaps 1, 2, n − 3 all different, so two kinds suffice, and any two-kind distinguishing ring needs at least three of each kind (the distinguishing number of a cycle, Albertson–Collins)."
discover = "Small rings need three kinds, every ring from six spots needs only two, and unequal gaps are what rule out every move."
gem = "The distinguishing number drops from 3 to 2 at six spots, and one set of three unequal gaps is the whole reason."
concepts = ["symmetry", "group-actions"]
mechanisms = ["construct", "certificate", "every-case"]
bands = ["K-1", "2-3", "4-5"]
reading = "Adults read aloud at K–1; 2–3 has little reading; 4–5 reads short tasks and writes explanations."
arithmetic = "None beyond counting small collections."
materials = ["about 24 counters per pair, eight each of three kinds, at least 20 mm", "tracing paper, about ten sheets per pair, and coloured pencils in the counters' colours"]
prep = "Print the ring pages and make one coloured tracing copy at home to check that a flipped sheet still shows its circles and colours; the launch copy is made in front of the children. About 15–20 minutes."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must-fix. The should-fixes and coulds were made October 23, 2026 in the new problem files (v3 packets): page 1 shows a flip over a drawn axis, every problem asks for a pattern that no turn or flip can match, Grades 4–5 get seven- and nine-ring workspace for the general construction, and the guide says how to make a coloured tracing copy, plans eleven children and keys the kind swap; could 11 (the route-note page) is left for the organizer."
app = "Hidden turns in Bead rings"
app_decision = "in app"

