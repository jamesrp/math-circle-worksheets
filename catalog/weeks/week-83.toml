week = "83"
title = "Hackenbush balances"
hook = "Take turns cutting red or blue segments from stalks on a ground line, removing whatever falls, and build boards where whoever moves second wins."
math = "In red–blue Hackenbush on grounded stalks under normal play, every position has a dyadic number value: reading bottom to top, B = 1, R = −1, BR = 1/2, BRR = 1/4, and separate stalks add. A zero position is a second-player win whichever colour starts, so BR + BR + R and BRR + BRR + RB balance, while a positive value means Blue wins whoever starts. The optional nursery names the earliest-born number strictly between left and right bounds, so {0 | 3} = 1, not the midpoint."
discover = "A stalk's worth is not its number of segments: BR is worth half a blue move, and two halves balance one red."
gem = "Conway's numbers grow out of a cutting game: fractions like 1/2 and 1/4 are forced by who wins."
concepts = ["partizan-games", "backward-induction"]
uses = []
mechanisms = ["every-case", "construct"]
bands = ["2-3", "4-5"]
reading = "Short rules read aloud if needed; the optional nursery needs reading birthday cards."
arithmetic = "None to start; the optional nursery needs signed numbers, halves and quarters, and strict inequalities."
materials = ["ground-line boards in sleeves with red and blue erasable pens, or at least 12 removable segments of each colour marked B/R", "15 birthday-number cards cut from page 6 (optional nursery)"]
prep = "Sleeve the printed boards; cut the birthday cards only for the nursery."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must-fix. Should-fixes: Problem 4 can be answered by copying earlier boards, Problem 3 repeats Problem 2's pattern, nothing makes cut segments disappear, and the 4–5 nursery is not connected to the stalks."
app = ""
app_decision = "open"

