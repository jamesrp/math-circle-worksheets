week = "51"
title = "Honest measurement ranges"
hook = "Choose paper strips whose ends land inside printed bands, join them on a ruler, and try to break a partner's promise about where the join ends."
math = "If a lies anywhere in [L, U] and b anywhere in [V, W], independently, then a + b fills exactly [L+V, U+W] and a − b fills [L−W, U−V], with both endpoints attained, so no narrower promise is safe and widths add. When one strip is used twice or the lengths are tied by a fixed total, the pieces cancel or constrain each other: the same formulas still enclose the answer but are no longer tight (the dependency problem of interval arithmetic)."
discover = "Extreme settings decide every guarantee, and a repeated strip cancels where a separate strip widens the range."
gem = "Interval arithmetic's dependency problem in a strip game: (A + 4) − (A + 1) is exactly 3, while (A + 4) − (B + 1) spreads from 1 to 5."
concepts = ["measurement-error", "length"]
uses = []
mechanisms = ["extremal", "counterexample", "certificate"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs an adult reading; older bands read short tasks, and \"tightest guaranteed range\" needs an adult to explain."
arithmetic = "K–1 compares small lengths on a printed 0–16 ruler; older bands add and subtract within 20 and compare intervals; no negative numbers."
materials = ["a strip set per pair or trio: two strips of each whole length 1–15 at 10 mm per unit (printed in week-51-materials.pdf)", "white 4-unit and 1-unit add-ons (in the kit)"]
prep = "Print one card-stock strip sheet per pair or trio at 100% and cut it: about 10 minutes per set, then reusable. Physically unrehearsed."
status = "unpiloted"
verdict = "revised"
verdict_note = "Original verdict revise. Both musts are fixed: the strips came on October 23, 2026 with week-51-materials.pdf and a guide without sleeves, and after the problem-file conversion the same day K–1's shared-A problem (now Problem 6) says the two A's in the top picture are the same length and each try may use new lengths. Shoulds 3, 5, 6 and 7 and coulds 9–10 were taken too: the gap page now precedes the shared-A page (problems renumbered), the fill-9 page has A from 3 to 7 and four boards, and the launch draws one join from the ruler's 0; should 8 re-timed the guide's hour to 35 to 40 minutes at the tables. Unpiloted; the changed pages are physically unrehearsed."
app = "Ruler strips"
app_decision = "in app"

