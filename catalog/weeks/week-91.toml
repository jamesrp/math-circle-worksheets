week = "91"
title = "Rotor-router machines"
hook = "Send counters down a tree of arrow cards, following each arrow and then flipping it, and try to program the order in which the exits fill."
math = "At an alternating switch any run of consecutive visits splits as evenly as possible, so a complete binary tree of depth d sends every block of 2^d consecutive counters once to each leaf from any starting cards, and the cards then return. On an absorbing road 0…m with every counter starting at s, counter position plus the number of right-pointing cards is conserved, so every m consecutive launches send exactly s counters right, with no warm-up. Rotors match a random walk's exit frequency s/m but not its randomness: a switch never sends two counters in a row the same way."
discover = "Flipping arrows share counters out perfectly evenly, yet only some exit orders are possible."
gem = "A deterministic machine that reproduces the gambler's-ruin probability exactly in every block, proved by one conserved score."
concepts = ["rotor-routing", "trees", "random-walks"]
uses = []
mechanisms = ["pair-up", "invariant", "smaller-cases"]
bands = ["2-3", "4-5"]
reading = "Short rules; adults may read or record while children choose and move."
arithmetic = "Count to 12 and follow arrows; the road visit needs supported addition and subtraction."
materials = ["16 counters at most 12 mm wide per kit", "7 fold-and-glue tree cards and 4 road cards", "entry marker, arrival strips and a coin", "printed switch, tree and road boards (materials pages 1–7)"]
prep = "Cut, fold and glue the reversible cards; rehearse flipping and an eight-exit run with the actual kit."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must-fix. The should-fixes were made on October 23, 2026 in the new problem files and the guide: the return key's 0004 corrected to 0040 with the first-block rule, pages 1–3 headed Grades 2–5 for both older tables, Problem 4's target words level with their own trees, Problem 5 now asks how many orders the eight-exit tree can make (128), the DABC key reworded, and a K–1 route with adult reading."
app = ""
app_decision = "open"

