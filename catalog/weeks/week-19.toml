week = "19"
title = "No card inside another"
hook = "Choose picture cards from a deck so that no chosen card's pictures all appear on another chosen card, and find the largest such collection."
math = "Cards are the subsets of up to four symbols ordered by 'fits inside', so a legal collection is an antichain; it takes at most one card from each nested row, so r rows covering the deck together with an r-card collection prove the optimum. The maxima are 2, 3 and 6 for two, three and four symbols, the six two-symbol cards are the only six-card collection on four symbols (Sperner's theorem in small cases), and a collection that cannot be extended need not be largest."
discover = "Sorting every card into nested rows bounds every legal collection, and a collection you cannot add to is not always the biggest."
gem = "A hand-built case of Dilworth's theorem: the fewest nested rows equals the largest collection, each certifying the other."
concepts = ["posets", "subsets", "optimization"]
mechanisms = ["certificate", "pigeonhole", "greedy"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 uses pictures while an adult reads a four-sentence rule; 2–3 reads little; 4–5 reads short proof tasks."
arithmetic = "Counting to about six; no factorials, binomial coefficients or set notation."
materials = ["two 16-card picture decks per table, cards about 5 cm with symbols in fixed corners (no template is printed)", "selection counters", "paper strips for nested rows"]
prep = "Make six 16-card decks with fixed symbol corners: 30–45 minutes with a printed template and cutter, about an hour by hand."
status = "unpiloted"
verdict = "keep"
app = "Nesting cards"
app_decision = "in app"

