week = "35"
title = "Footprint borders"
hook = "Lay notched footprint cards in an endless border, then slide, flip, glide or turn a tracing copy to see which moves land every footprint on a matching one."
math = "For a border along a strip with shortest slide P, a glide (flip in the middle line, then slide a) done twice is the slide 2a, so when the flip alone fails the shortest glide is P/2. Flips in two perpendicular lines compose to a half-turn about their crossing, and any composition of symmetries is a symmetry; because the footprint itself has no symmetry, where one footprint lands decides a move, so a complete symmetry list can be proved."
discover = "A glide done twice is a slide, the shortest glide is half the shortest slide when the flip fails, and two crossing flips force a half-turn."
gem = "Composition of rigid motions made physical: one asymmetric motif lets a child check the frieze symmetries footprint by footprint."
concepts = ["frieze-patterns", "composition", "symmetry"]
mechanisms = ["construct", "every-case", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 hears four short rule sentences and short prompts, with three more rules said at the launch; 2–3 has little reading; 4–5 writes explanations."
arithmetic = "None at K–1, where slide lengths are compared directly; upper bands measure in centimetres and halve."
materials = ["footprint cards, 12 A and 12 mirror A per pair or trio, 29 by 26 mm (printed in week-35-materials.pdf, one sheet per table)", "tracing paper strips", "long paper strips, a ruler and removable tape"]
prep = "Print one card-stock sheet per table at 100% and cut 24 cards per group: about 25 minutes for five sets (two K–1 pairs, two 2–3 pairs, the 4–5 trio), then reusable. Have removable tape and tracing strips ready. Physically unrehearsed."
status = "unpiloted"
verdict = "revised"
verdict_note = "Original verdict revise. The must-fix, footprint pieces in four forms that nothing printed, was fixed on October 23, 2026 with week-35-materials.pdf (A and mirror-A cards; turning gives the other two forms). Later that day, after a conversion to problem files, the deferred shoulds and coulds and the second card run's extra shoulds were made (v4 packets: build each border in its box, shorter K-1 rules, a longer-slide K-1 P4, two glide borders in 2-3 P2, a 3 cm glide in 4-5 P3, a completeness question with its own page in 4-5 P6, extra-workspace labels; an eight-page guide with boards, tape and tracing, a 35-40 minute plan and the witnesses drawn). Nothing is deferred. After a critic's review the same day, K–1 P4 asks for a longer shortest slide, 4–5 P3 names its move for the return view and the guide counts five card sets (K–1 and 4–5 v5). The kit and new pages are physically unrehearsed."
app = "Footprint borders"
app_decision = "in app"

