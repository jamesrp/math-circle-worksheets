week = "97"
title = "Square remainders"
hook = "Build a square of counters, take away equal bundles, and from the leftover alone try to name every side length your partner might have used."
math = "Squaring a side length and removing bundles of m leaves a remainder that depends only on the side's remainder mod m, so sides 0 to m − 1 show every possible output. For an odd prime p, x² and y² leave the same remainder exactly when x = y or x + y = p, because p divides (x − y)(x + y); so each nonzero output has exactly two inputs and there are (p − 1)/2 nonzero square outputs. Composites break the pairing: mod 8 four inputs give 1, mod 9 three give 0, mod 15 four give 1."
discover = "For a prime bundle size every leftover except 0 hides exactly two side lengths; other sizes can hide more."
gem = "Quadratic residues found with counters, and the prime-divides-a-product lemma doing visible work."
concepts = ["square-remainders", "remainders", "primes"]
uses = []
mechanisms = ["every-case", "pair-up", "counterexample"]
bands = ["2-3", "4-5"]
reading = "Short tasks; an adult may read and record."
arithmetic = "Square arrays, supported multiplication and removing equal bundles; later pages print the square products."
materials = ["64 counters or square tiles per pair", "about 16 reusable input cards", "whiteboard"]
prep = "About 10 minutes to count kits and mark cards."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; on October 23, 2026 the guide gained an adult-led K–1 route and a counters picture for the prime pairing (a 2 × 2 corner off a 5 × 5 square leaves 21 = 3 × 7), and Problem 3 and the rules were reworded."
