week = "71"
title = "Can you hear the room?"
hook = "Aim straight shots in rooms with lettered walls, record the bounce word, and ask which rooms can produce which words."
math = "No rectangle produces A, B, A on adjacent walls, because in the unfolded copies both A seams lie on one line, which a straight shot crosses once; a 60° rhombus does produce ABA at its acute corner. Every lettered rectangle has the same set of bounce words, since stretching the unfolded picture by different factors across and up keeps shots straight and crossings in order, in both directions."
discover = "One drawing proves a word possible, ruling a room out needs an argument, and words tell a rhombus from a rectangle but never one rectangle from another."
gem = "The elementary core of \"How to hear the shape of a billiard table\" (Calderon et al.): an obstruction and an equivalence from one unfolding."
concepts = ["reflection", "words"]
uses = []
mechanisms = ["unfold", "invariant", "construct"]
bands = ["4-5"]
reading = "An adult reads p. 1's eight rules and Problem 3's 88 words."
arithmetic = "None beyond counting walls; ruler lines through printed windows."
materials = ["a small safe mirror with a straight bottom edge", "a straightedge", "an opaque folder to hide shots", "spare copies or sleeves of pp. 1, 4 and 5"]
prep = "Print at actual size and try the mirror check on the printed rooms; mirror handling is unrehearsed."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must. The should-fixes and most coulds were made October 23, 2026 in the new problem files (v2): the guide's Problem 3 key names every family of rule-out words, including square words the rhombus cannot make, and page 5 and Problems 1 and 3 lost repeated rules; could 5 is left for the organizer."
app = "Bounce words in Mirror Couriers"
app_decision = "in app"

