week = "44"
title = "The bag that copies"
hook = "Draw a counter from a bag that starts with one red and one blue, put it back with a copy of its colour, and see which bags you can end with."
math = "In Pólya's urn (start with one red and one blue; each drawn counter goes back with a copy of its colour), the number of red draws after n draws is uniform on 0 to n, and neither colour ever vanishes. A colour word's chance depends only on its counts (exchangeability), though successive draws are dependent; labelling each copy by the step that added it makes all (n + 1)! marked histories equally likely, so the theorem is a count (two histories per total at two draws, six at three)."
discover = "A lopsided bag is exactly as likely as a balanced one, and reordering a word of draws doesn't change its chance."
gem = "Reinforcement produces a perfectly uniform law, proved by labelling each copy with the step that made it."
concepts = ["urns", "equally-likely", "listing-cases"]
mechanisms = ["every-case", "invariant", "work-backward"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs an adult reading the questions; 2–3 tracks two draws and identity labels; 4–5 reads short prompts."
arithmetic = "K–1 counts to six; 2–3 counts marked stories; 4–5 uses branching counts and small products, with factorials optional."
materials = ["an opaque bag or cup per pair", "six red and six blue same-feel counters per pair", "removable identity labels (paper slips and a marker)"]
prep = "Gather counters and label slips; light."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; on October 23, 2026 all nine shoulds and four coulds were fixed in the new problem files and the guides (v3 packets): K–1 asks about color stories with spare story rows, Grades 2–3 asks for every four-draw story and adds a four-draw comparison (both bags 1/5), the first route pools random games on a chart, and the guide asks for eleven children's materials. Three coulds are deferred."
app = "Copying bags"
app_decision = "in app"

