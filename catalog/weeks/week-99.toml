verdict_note = "Kept. On October 23, 2026 the card's shoulds were fixed: week-99-materials.pdf prints the line mat and star board the guide asks for (physically unrehearsed); in the new problem files (v2) Problem 1 drops its copied second record; the guide adds a K–1 route and corrects its plans paragraph."
