week = "85"
title = "Drawing machines"
hook = "Trace a path with one point of a hinged bar machine and watch the other pencil draw a copy twice as big."
math = "In the pantograph, rigid bars O–X–Q and Q–Y–P with equal half-lengths and a parallelogram XQYT force P = O + 2(T − O) in every permitted pose, a dilation by 2 about the anchor O. So every length doubles, angles and orientation are kept and areas multiply by 4; swapping tracer and pen halves instead, and moving the anchor by d moves the copy by −d."
discover = "The copy is always the same shape, twice as long in every direction and four times the area."
gem = "A flexible frame that computes a dilation exactly, proved by adding two equal half-bars."
concepts = ["scaling", "area"]
uses = []
mechanisms = ["invariant", "work-backward"]
bands = ["2-3", "4-5"]
reading = "Adult reading or scribing is welcome; Grades 2–3 trace and steer, Grades 4–5 read the upper packet's explanation tasks."
arithmetic = "Compare millimetre lengths; the upper area problem counts unit squares and half-squares."
materials = ["an adult-built pantograph: 5 mm foam-board strips (two 160 mm and two 80 mm between end holes), brass fasteners 20–25 mm long at X, Q and Y, a pushpin at O, two round coloured pencils as the T and P axles, P's held in two layers by a glued offcut (or a bought pantograph set to 2)", "a 20 × 30 inch foam-board base (at least 450 × 400 mm)", "joined two-sheet mat, tracing-paper overlays and inserts A–M", "ruler and straightedge"]
prep = "Heavy: about 30 minutes to build a first foam-board machine and 30–60 minutes to rehearse it, then about 20 minutes per extra machine and $25–40 for three (untested estimates; nobody has built it); postpone the student tasks if the hardware fails."
status = "unpiloted"
verdict = "revised"
verdict_note = "Revised October 23, 2026: one named foam-board build with a bought-pantograph fallback, a K–1 route, a new Problem 4 and tracing-paper overlays. A critic's same-day follow-up holds the P pencil in two layers with a glued offcut and adds a sideways-push rehearsal check. The build is unbuilt and unrehearsed; the mathematics and answers check."
app = "Drawing machines"
app_decision = "in app"

