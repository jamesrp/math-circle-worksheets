week = "20"
title = "Averaging"
hook = "Put cube stacks on circles so that every circle holds the average of the places it is joined to, while the squares' stacks stay fixed."
math = "Squares hold fixed values and every circle must equal the average of its neighbours at once, a discrete harmonic function. If every circle can reach a square, each circle lies between the smallest and largest square values, a circle ties an extreme only if its whole group and the adjacent squares share it, and the filling is unique; a group with no square takes any constant value, and whole-number squares can force fractions."
discover = "No circle can be higher than every square, because the biggest value spreads until it reaches a square."
gem = "Chasing the biggest value to a square is a genuine proof of the maximum principle that a nine-year-old can give."
concepts = ["averaging", "graphs"]
mechanisms = ["extremal", "construct", "every-case"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none with one or two sentences read aloud; 2–3 reads short tasks; 4–5 reads some formal phrasing with the organizer at the table."
arithmetic = "K–1 shares up to 10 cubes into two or three piles; 2–3 adds and divides by 2 or 3; 4–5 averages up to four neighbours, with signed differences and thirds optional."
materials = ["counters or connecting cubes (about 80 per table)", "small stack mats", "blank number cards", "small whiteboards"]
prep = "About 15 minutes: print selected pages and set out cubes, mats and number cards."
status = "unpiloted"
verdict = "keep"
app = "Sharing circles"
app_decision = "in app"

