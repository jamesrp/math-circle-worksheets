week = "84"
title = "Public knowledge"
hook = "Coach three dolls who see each other's headbands but not their own, removing possibility cards round by round until a doll can prove its colour."
math = "A player knows a fact when every possibility compatible with their private view agrees on it. In the café, a first 'not sure' to 'Does everyone want a cup?' proves the first speaker wants one; with three hidden-to-self headbands and the public announcement 'at least one is blue', ideal reasoners answering simultaneously have exactly the k blue dolls declare on round k, by induction on k. Without the announcement no doll can ever declare."
discover = "An announcement can change what can be deduced even when each doll could already see a blue headband, and silence is information."
gem = "The muddy-children induction on eight cards: what matters is that everyone knows that everyone heard."
concepts = ["common-knowledge", "deduction"]
uses = []
mechanisms = ["every-case", "smaller-cases"]
bands = ["2-3", "4-5"]
reading = "Grades 2–3 enter through the café with adult reading; possibility cards carry the information. Adult reading and recording are routine."
arithmetic = "None; keep track of eight configuration cards."
materials = ["one set of pages 4–8 per pair: café deal cards, eight headband possibility cards, reply cards, table labels and three doll slots (printed, cut)", "optional: any three toys as dolls, with a headband card leaned against each"]
prep = "Cut the configuration and reply cards and lay out a large tabletop display."
status = "unpiloted"
verdict = "revised"
verdict_note = "Original verdict revise. The must, Problem 3's second reading (which replies appear, under which the answer is no), was fixed on October 23, 2026 in the new problem files: Problem 3 now groups deals in which each doll gives the same reply, and the guide key also tells adults to accept no from the other reading. The shoulds were taken too: a two-doll worked round with a removal, plainer rules, taller deal boxes, the announcement's role in the overview, coaching with the doll's own headband covered, card states per round and hints, a corrected print list, and a K–1 café route."
app = "Who knows"
app_decision = "in app"

