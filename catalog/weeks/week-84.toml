week = "84"
title = "Public knowledge"
hook = "Coach three dolls who see each other's headbands but not their own, removing possibility cards round by round until a doll can prove its colour."
math = "A player knows a fact when every possibility compatible with their private view agrees on it. In the café, a first 'not sure' to 'Does everyone want a drink?' proves the first speaker wants one; with three hidden-to-self headbands and the public announcement 'at least one is blue', ideal reasoners answering simultaneously have exactly the k blue dolls declare on round k, by induction on k. Without the announcement no doll can ever declare."
discover = "An announcement can change what can be deduced even when each doll could already see a blue headband, and silence is information."
gem = "The muddy-children induction on eight cards: what matters is that everyone knows that everyone heard."
concepts = ["common-knowledge", "deduction"]
uses = []
mechanisms = ["every-case", "smaller-cases"]
bands = ["2-3", "4-5"]
reading = "Grades 2–3 enter through the café with adult reading; possibility cards carry the information. Adult reading and recording are routine."
arithmetic = "None; keep track of eight configuration cards."
materials = ["three named dolls with blue and red headbands", "café YES/NO cards, reply cards and eight configuration cards (printed, cut)", "staging labels and three response slots (page 8)"]
prep = "Cut the configuration and reply cards and lay out a large tabletop display."
