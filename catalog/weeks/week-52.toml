week = "52"
title = "Hinged frames and braces"
hook = "Push hinged bar frames flat on the table, fit diagonal braces into chosen cells, and find which brace patterns stop a grid from shearing."
math = "A hinged triangle is rigid and a hinged square shears. For a complete m-by-n grid of square cells with at most one brace per cell, draw a dot for each row and each column and a link Ri–Cj for each braced cell: the grid holds its shape exactly when this row–column graph is connected (Bolker–Crapo). So m + n − 1 braces is the minimum, a brace in a rigid frame is removable exactly when its link lies on a loop, and a brace in every row and column is not enough in general."
discover = "Where the braces go matters more than how many, and a frame holds when its braces link every row to every column."
gem = "Physical rigidity becomes graph connectivity, because bar directions propagate along the links."
concepts = ["rigidity", "trees", "graphs"]
uses = []
mechanisms = ["construct", "certificate", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 adult reads the short pages; upper pages are brief statements, with the row–column link picture introduced by a worked visual."
arithmetic = "Counting braces to about ten; Grades 4–5 compare a design with m + n − 1. No algebra."
materials = ["hinged bar-and-pin kits: a triangle and square for K–1, 2-by-2 grids for 2–3, 2-by-3 grids for 4–5 (84 side bars, 27 braces, 72 pins in all)", "blue and red markers", "removable row and column label tabs"]
prep = "Cut, punch and assemble the bar kits on an earlier evening, forecast 45–60 minutes with stock in hand; pin fit is unrehearsed."
status = "unpiloted"
verdict = "revise"
verdict_note = "The K–1 route is three problems the guide finishes by minute 30, and Problem 13's \"Yes\" rests on a one-brace-per-cell rule no upper page states."
