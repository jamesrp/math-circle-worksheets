week = "52"
title = "Hinged frames and braces"
hook = "Push hinged bar frames flat on the table, fit diagonal braces into chosen cells, and find which brace patterns stop a grid from shearing."
math = "A hinged triangle is rigid and a hinged square shears. For a complete m-by-n grid of square cells with at most one brace per cell, draw a dot for each row and each column and a link Ri–Cj for each braced cell: the grid holds its shape exactly when this row–column graph is connected (Bolker–Crapo). So m + n − 1 braces is the minimum, a brace in a rigid frame is removable exactly when its link lies on a loop, and a brace in every row and column is not enough in general."
discover = "Where the braces go matters more than how many, and a frame holds when its braces link every row to every column."
gem = "Physical rigidity becomes graph connectivity, because bar directions propagate along the links."
concepts = ["rigidity", "trees", "graphs"]
uses = []
mechanisms = ["construct", "certificate", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 adult reads pages 1–4 and may draw a shape a child shows; upper pages are brief statements, with the row–column link picture introduced by a worked visual."
arithmetic = "Counting braces to about ten; Grades 4–5 compare a design with m + n − 1. No algebra."
materials = ["hinged bar-and-pin kits: a triangle and square and a 2-by-2 grid for each K–1 pair, 2-by-2 grids for 2–3, 2-by-3 grids for 4–5 (108 side bars, 35 braces, 90 pins in all, with spares)", "blue and red markers", "removable row and column label tabs"]
prep = "Build and push-test one 2-by-3 first, then cut, punch and assemble the rest on an earlier evening, forecast 70–90 minutes with stock in hand; pin fit is unrehearsed."
status = "unpiloted"
verdict = "revised"
verdict_note = "Original verdict revise. Both musts were fixed on October 23, 2026 after the problem-file conversion: each K–1 pair has its own 2-by-2 kit and continues through Problems 4–5 on pages 3–4, now headed Grades K–3, with the adult reading; Problem 13 now says \"braces in six different cells\". The frame rules open pages 3, 5 and 10, the page 1 square uses the triangle's bar, Problem 14 has two boards, and the guide's launch, stock test and handoff were revised. After an independent critic's review the same day, the handoff asks for a test (\"Use three braces so that every row and every column has one. Does it hold?\") instead of Problem 8's question (F52-FAC-v4). Unpiloted; the kits are physically unrehearsed."
app = "Bracing frames"
app_decision = "in app"

