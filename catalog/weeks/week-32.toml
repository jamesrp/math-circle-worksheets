week = "32"
title = "Squares inside rectangles"
hook = "Cut the biggest possible square off a grid rectangle again and again, and compare the last square with the biggest equal tile that covers the rectangle."
math = "Replacing an a-by-b rectangle (a > b) by (a − b, b) keeps every common divisor of the sides while the sides shrink, so the biggest-square rule stops and its last square has side gcd(a, b). Identical grid squares of side s tile the rectangle exactly when s divides both sides, so the last side is also the largest equal tile; the number of different square sizes counts Euclid's division steps, which peak at consecutive Fibonacci numbers (13 by 8 within side 15)."
discover = "The last square of the cutting rule is the biggest square that tiles the rectangle evenly, because a cut never changes which squares fit both sides."
gem = "Euclid's algorithm drawn, with its invariant visible in one cut and its slowest case given by Fibonacci rectangles."
concepts = ["euclid", "gcd", "dissection"]
mechanisms = ["invariant", "monovariant", "every-case"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 hears short read-aloud problems; upper bands read short tasks."
arithmetic = "K–1 counts side lengths to 12; 2–3 skip-counts and multiplies for equal tilings; 4–5 uses factors, subtraction and organised casework."
materials = ["1 cm graph paper and scissors", "rulers and two coloured pencils", "the K–1 square sheet week-32-materials.pdf on card stock: per pair one square each of sides 6 and 5, two of 4 and 2, six of 3 (four for the four-square problem) and three of 1"]
prep = "Print packets and one square sheet per two K–1 pairs on card stock at 100%, and cut it (30 squares per page; a second page gives every child four 3-by-3 squares); drawing square outlines is the low-prep option. The square sheet is physically unrehearsed."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must-fix. The should-fixes and coulds were made October 23, 2026 in the new problem files (v3 packets): Grades 2–3 Problem 6 has its own 12 by 18 grid, Grades 4–5 Problem 6 asks whether any rectangle ties with 13 by 8, K–1 Problem 4 uses a board met under the rule, and a K–1 square sheet lets children try each size against the boards; the guide gives a 35–40 minute plan and the reason 13 by 8 is alone."
app = "Squares in Tile gardens"
app_decision = "in app"

