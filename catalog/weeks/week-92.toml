week = "92"
title = "Fold-and-stretch predictions"
hook = "Move a marker by doubling its distance to the nearer end of a 0–16 track, then move a whole strip of possible starting places and watch it spread."
math = "Under the tent map T(x) = 2·min(x, 16 − x) on [0, 16], two points on one half double their distance and mirror points merge, but an interval's width never decreases, and its image must include the image of 8, not just of its ends. Each dyadic piece of width 16/2^n covers the whole track after n moves, so every band of positive width eventually fills the track. For any named number of moves n the band [0, 2/2^n] stays within [0, 2], but no positive band works forever."
discover = "Any uncertainty about the start, however small, eventually makes every position possible."
gem = "Sensitive dependence made exact, with a quantifier swap at its heart: a prediction horizon for every n, but no band that survives all n."
concepts = ["chaos", "iteration", "measurement-error"]
uses = []
mechanisms = ["limit", "smaller-cases", "counterexample"]
bands = ["2-3", "4-5"]
reading = "Rules can be read aloud; the reusable maps on pages 1–2 stay in view."
arithmetic = "Counting, distance on a track and doubling; the upper route uses halves and repeated halving."
materials = ["two 0–16 tracks and two small markers per pair", "pencils for shading bands; optional 5 cm tracing-paper strips", "ruler and whiteboard"]
prep = "Print at actual size; tracing-paper strips are optional."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must-fix. The should-fixes (Problem 3's answer-sized board, the undescribed K–1 demonstration, band slices missing shared pages) were fixed October 23, 2026, with small coulds."
