week = "75"
title = "Twists on a cylinder"
hook = "Tape yarn from a mark on the bottom rim of a paper cylinder to a mark on the top, count its signed seam crossings, then twist the whole cylinder."
math = "Simple arcs on an annulus between fixed rim points are classified, up to sliding with the ends fixed, by an integer winding: signed seam crossings, or which copy of B a lift reaches. A full twist fixes both rims and adds 1 to every winding, and twists compose by adding. Arcs of windings a and b cross at least max(|a − b| − 1, 0) times away from their ends, and straight lifts attain this."
discover = "Winding is a record sliding cannot change, twists add, and the difference of two windings forces unavoidable crossings."
gem = "The annulus's mapping class group, generated by one Dehn twist, and a first intersection-number theorem, done with yarn."
concepts = ["winding", "surfaces", "composition"]
uses = []
mechanisms = ["unfold", "invariant", "certificate"]
bands = ["4-5"]
reading = "About 120 words of rules before Problem 1; an adult may read or record."
arithmetic = "Signed counting of seam crossings and differences of windings."
materials = ["an extra page 1 cut and taped into a cylinder", "two contrasting yarns about 60 in long", "removable tape", "scissors"]
prep = "Print at actual size and rehearse taping and feeding the yarn, and whether laid yarn stays put; the sleeve handling is unrehearsed."
status = "unpiloted"
verdict = "revised"
verdict_note = "Original verdict revise. Both musts were fixed on October 23, 2026 in the new problem files: Problems 6–7 say strand crossings (places where the two strands cross each other), and Problem 4 has a strip with B copies −4 to 4 for the twisted routes. Shoulds 3–7 (taller sketch rows, Problem 1 sketch boxes, page 1–2 wording that leaves taping and method to the adult) and the guide's rehearsal note were taken too; should 8 (Problem 5 is thin) is left for the organizer. After a critic's review the same day, page 2's labels print a true minus (GGT75-S-v4)."
app = "Strands"
app_decision = "in app"

