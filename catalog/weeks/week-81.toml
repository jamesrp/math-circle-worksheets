week = "81"
title = "Buckets of Fish"
hook = "Take one fish from a bucket and refill buckets to its left, playing a partner to see who takes the last fish."
math = "A move removes one counter from a bucket and may add counters only to buckets on its left. Whether refills are capped at one per bucket or not, the second player wins exactly when every bucket is even: a move from all-even leaves an odd bucket, and otherwise taking from the rightmost odd bucket and adding one to each odd bucket on its left restores all-even. Every play ends because the rightmost bucket never refills, yet from (0, 1) a refill of M gives exactly M + 1 moves, so no single bound covers all plays."
discover = "All-even positions lose, and a game that always ends can still be made as long as you like."
gem = "Hamkins's game: a one-line parity invariant in a game whose positions grow, and the gap between 'every play is finite' and 'every play is shorter than some N'."
concepts = ["infinite-games", "parity", "backward-induction"]
uses = []
mechanisms = ["invariant", "monovariant"]
bands = ["2-3", "4-5"]
reading = "An adult reads the three-sentence rule if needed."
arithmetic = "Take away one; small counts, at most 8 per bucket; pair counters to check evenness. Large finite counts are written on scrap paper at Grades 4–5."
materials = ["about 30 counters per pair", "printed bucket board", "16 sorting cards cut in advance"]
prep = "Print the board and cut the sorting cards."
status = "organizer-approved"
verdict = "keep"
verdict_note = "The organizer approved the five-page packet (draft-v1) on October 17; there was no must. The October 23 revision (v2) post-dates that approval and has not been re-approved: it made the shoulds and coulds, the guide's repair move now adding 1 to each earlier odd bucket, the two-bucket start (0, 3) in Problem 5, (2, 0, 2) in Problem 3, and a Grades 4–5 route, a K–1 route and a capped longest-game return visit in the guide. A critic's follow-up the same day made v3 (Problem 5's two-bucket picture redrawn) and gave the guide the id W81-FAC-v2 with a K–1 rule that allows no do-nothing move. The approved draft-v1 PDFs are archived; show v3 to the organizer before printing it as the approved packet."
app = "Buckets in Pebble Duel"
app_decision = "in app"

