week = "1"
title = "Tiling lab"
hook = "Lay blue rhombus blocks on one-inch triangle boards to fill an outline or leave as few gaps as you can, and (4–5) record and flip every tiling of a small hexagon."
math = "A grid-aligned rhombus covers one up and one down triangle, so a region with u up and d down triangles leaves at least |u − d| gaps (exactly n on the side-n triangle); equal counts are necessary but not sufficient, and since a purple chevron is two blues, blues never pack worse. The six rhombus tilings of the 1-2-2 hexagon match the six words with two L's and two R's, a flip swaps one adjacent LR, and the flip map is connected with no odd cycles."
discover = "Counting up and down triangles predicts the fewest gaps, even area is not enough, and flips connect every tiling of a hexagon."
gem = "Blue packings are matchings of up and down triangles, so the colour count is the first case of Hall's theorem, and every rhombus tiling is also a picture of stacked cubes."
concepts = ["tilings", "matchings", "bijection", "bipartite"]
mechanisms = ["colouring", "construct", "invariant"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none with an adult reading aloud; 2–3 and 4–5 read one- or two-sentence tasks, and 4–5 follows a centre-line recording convention shown by example."
arithmetic = "K–1 none; 2–3 counts spaces to 25 and compares up and down counts; 4–5 uses small sums for ribbon codes and odd/even reasoning."
materials = ["1× pattern blocks: blue rhombi, green triangles, purple chevrons (about 56 blues for the group)", "optional string for 4–5 ribbons"]
prep = "Sort blocks into trays and check that a real block matches a printed one-inch cell; print at 100%."
status = "piloted"
verdict = "keep"
app = "Rhombus gardens"
app_decision = "in app"

