week = "58"
title = "Fair division"
hook = "Split picture cards into two trays, let your partner choose first, and check with each person's own dot card whether anyone would rather swap."
math = "With additive, nonnegative values and every item given out, envy-free implies proportional, by adding one person's comparisons over all n bundles; for two people the two coincide, but for three a proportional division can leave everyone envious. Identical whole items can make both impossible until one is split, and cut-and-choose on a divisible strip guarantees both when the cutter makes two pieces of equal value to themselves."
discover = "Different tastes can make both trays look better, and cutting can remove an obstruction whole cards create."
gem = "The three-person rows (4, 8, 0), (0, 4, 8), (8, 0, 4) give everyone a third while each person envies someone."
concepts = ["fair-division"]
uses = []
mechanisms = ["every-case", "counterexample", "construct"]
bands = ["K-1", "2-3", "4-5"]
reading = "An adult reads p. 2's two new terms, envy-free and proportional; prompts are short. K–1 pairs work pp. 1 and 5 (and p. 2's two color splits) orally, with an adult reading the dot cards."
arithmetic = "Sums to 10 on pp. 1–2; p. 3 measures strip lengths in millimetres; pp. 6–7 use sums to 12 and a third of 12."
materials = ["printed goods cards and preference cards from the materials PDF, the goods mounted on stiff card", "whole printed 240 mm two-colour paper strips and adult-held scissors", "two trays per pair"]
prep = "Print the materials pages, mount and cut the goods cards and cut out the whole strips (no taping); the smaller first-route stock is 27 sheets."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must. The shoulds were fixed on October 23, 2026: pages 1 and 5 are headed Grades K–5 with an adult-led K–1 route and plain-words key in the guide, Problem 2 states who gets the cards, Visit A names the tied partition, the printed tables and Problem 7's observer boxes are gone, and the strips print whole at 240 mm. Reordering and relabelling coulds are deferred. Unpiloted."
app = "Fair shares"
app_decision = "in app"

