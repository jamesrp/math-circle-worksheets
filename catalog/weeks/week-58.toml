week = "58"
title = "Fair division"
hook = "Split picture cards into two trays, let your partner choose first, and check with each person's own dot card whether anyone would rather swap."
math = "With additive, nonnegative values and every item given out, envy-free implies proportional, by adding one person's comparisons over all n bundles; for two people the two coincide, but for three a proportional division can leave everyone envious. Identical whole items can make both impossible until one is split, and cut-and-choose on a divisible strip guarantees both when the cutter makes two pieces of equal value to themselves."
discover = "Different tastes can make both trays look better, and cutting can remove an obstruction whole cards create."
gem = "The three-person rows (4, 8, 0), (0, 4, 8), (8, 0, 4) give everyone a third while each person envies someone."
concepts = ["fair-division"]
uses = []
mechanisms = ["every-case", "counterexample", "construct"]
bands = ["2-3", "4-5"]
reading = "An adult reads p. 2's two new terms, envy-free and proportional; prompts are short."
arithmetic = "Sums to 10 on pp. 1–2; p. 3 measures strip lengths in millimetres; pp. 6–7 use sums to 12 and a third of 12."
materials = ["printed goods cards and preference cards from the materials PDF, the goods mounted on stiff card", "two-colour paper strips (taped from halves) and scissors", "two trays per pair"]
prep = "Print the materials pages, mount and cut the goods cards and tape strip halves; the smaller first-route stock is 27 sheets."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; the thin K–1 route is a should, and a guide sentence points to a partition with no tie."
app = "Fair shares"
app_decision = "in app"

