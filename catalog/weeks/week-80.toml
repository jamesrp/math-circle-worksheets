week = "80"
title = "Midnight laboratory"
hook = "Fold a paper timeline to mark switches halfway to midnight, flip an ON/OFF card at each, and move a counter halfway to END each time."
math = "Switches at times 1 − 2⁻ⁿ of the hour have no last one, and the card's states alternate with no limit, while a counter moving halfway to END converges to it. The rule for times before midnight leaves the state at midnight undetermined: ON and OFF are both consistent, and 'use the state the earlier states approach' decides the counter but not the card (Thomson's lamp)."
discover = "Times can approach midnight while the light never settles, and the rule says nothing about midnight itself."
gem = "Thomson's lamp with Benacerraf's answer, beside a convergent counter that makes the contrast visible."
concepts = ["infinite-processes", "limits"]
uses = []
mechanisms = ["limit", "extremal"]
bands = ["2-3", "4-5"]
reading = "An adult reads the story and rules; no clock reading needed."
arithmetic = "None; folding finds halfway. Fraction notation is optional."
materials = ["printed time strip and START–END strip per pair", "an ON/OFF card made by gluing two printed panels back to back", "a small counter and a ruler", "scissors and glue"]
prep = "Cut and glue the ON/OFF cards and print the strips."
status = "organizer-approved"
verdict = "keep"
verdict_note = "Grades 2–3 get only two problems, and Problem 2 asks what place the counter approaches, assuming it approaches one."
app = ""
app_decision = "not porting"

