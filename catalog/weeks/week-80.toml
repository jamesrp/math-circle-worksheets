week = "80"
title = "Midnight laboratory"
hook = "Fold a paper timeline to mark switches halfway to midnight, flip an ON/OFF card at each, and move a counter halfway to END each time."
math = "Switches at times 1 − 2⁻ⁿ of the hour have no last one, and the card's states alternate with no limit, while a counter moving halfway to END converges to it. The rule for times before midnight leaves the state at midnight undetermined: ON and OFF are both consistent, and 'use the state the earlier states approach' decides the counter but not the card (Thomson's lamp). A card settles exactly when it flips at only finitely many marks, and a counter whose moves stay long cannot approach one place."
discover = "Times can approach midnight while the light never settles, and the rule says nothing about midnight itself."
gem = "Thomson's lamp with Benacerraf's answer, beside a convergent counter that makes the contrast visible."
concepts = ["infinite-processes", "limits"]
uses = []
mechanisms = ["limit", "extremal"]
bands = ["2-3", "4-5"]
reading = "An adult reads the story and rules; no clock reading needed."
arithmetic = "None; folding finds halfway. Fraction notation is optional."
materials = ["printed time strip and START–END strip per pair", "an ON/OFF card made by gluing two printed panels back to back", "a counter at most 15 mm across and a ruler", "scissors and glue"]
prep = "Cut and glue the ON/OFF cards and print the strips."
status = "organizer-approved"
verdict = "keep"
verdict_note = "The organizer approved the five-page packet (v1) on October 17; there was no must. The October 23 revision (v2) post-dates that approval and has not been re-approved: it made the shoulds and coulds, a new Grades 2–5 Problem 3 asking for a card that settles and a counter that does not, Problem 2 no longer assuming the counter approaches a place, and the guide's 'flip once more' obstacle, Problem 4's answer and a K–1 route. The approved v1 PDFs are archived; show v2 to the organizer before printing it as the approved packet."
app = ""
app_decision = "not porting"

