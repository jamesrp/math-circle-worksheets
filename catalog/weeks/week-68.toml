week = "68"
title = "How many ways out"
hook = "Cover dots on endless line, ladder, grid and branching-tree maps with blockers and count the pieces that still go on forever."
math = "Removing finitely many vertices leaves at most as many infinite components as the graph has ends: the line and the two-rail ladder have 2, the square grid 1, and the 3-regular tree infinitely many, since removing every dot within r roads of the centre leaves 3·2^r infinite pieces. On the line and ladder all blockers lie between two tails; on the grid they fit in a box whose outside stays connected."
discover = "Blockers can trap finite pockets without changing the number of ways to escape forever, and on the tree that number has no limit."
gem = "The ladder behaves like the line: ends are a quasi-isometry invariant, seen with counters."
concepts = ["infinite-graphs", "trees"]
uses = ["graphs"]
mechanisms = ["extremal", "limit", "construct"]
bands = ["2-3", "4-5"]
reading = "Adults may read and scribe; each map has one continuation sentence."
arithmetic = "Counting pieces and blockers to 12; Problem 8 asks for a doubling pattern."
materials = ["ten opaque blockers 6–8 mm across per pair"]
prep = "Print single-sided and rehearse a blocker on the 10 mm grid without hiding neighbouring dots."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; Problem 3's wording and key, the X rule, a wall that never sends a route off the page and a short first route are shoulds."
app = "Ways out"
app_decision = "in app"

