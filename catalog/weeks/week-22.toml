week = "22"
title = "Meeting regions"
hook = "Split four labelled dots into two groups, draw the smallest stretched-band region around each group, and find the splits whose regions touch."
math = "Any four labelled points in the plane can be split into two groups whose convex hulls meet (Radon's theorem), while three noncollinear points cannot, so four is sharp. If no three of four distinct points are collinear, exactly one of the seven splits works, the crossing diagonals of a convex quadrilateral or an inside point against its triangle; collinear and coincident placements allow two, four or more, and two hulls from four points never share area."
discover = "Every placement of four dots has a split whose regions meet, and in general position there is exactly one."
gem = "A real theorem of convex geometry with a three-case proof and a sharp threshold, reached by placing points and listing all seven splits."
concepts = ["convexity", "listing-cases"]
mechanisms = ["every-case", "counterexample", "construct"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none, but five rule sentences are read aloud once; 2–3 and 4–5 read short tasks."
arithmetic = "Counting to four; no coordinates, fractions or algebra."
materials = ["two sets of A–D markers per table", "tracing paper", "pencils or crayons in two colours", "a ruler"]
prep = "About 15 minutes: set out markers and tracing paper, and try a filled triangle containing a single point."
