week = "38"
title = "Seams"
hook = "Join a paper strip's ends matching or reversed, trace each edge with a finger until it returns to its start dot, and predict what a cut down the middle will make."
math = "A strip joined with matching ends is an annulus with two boundary circles; joined reversed, it is a Möbius band with one. A cut along the middle splits it into halves U and L, and the seam's action on them decides the pieces: U→U, L→L gives two annuli, while U↔L gives one annulus with two edges. An arrow carried once round the Möbius band returns reversed, and with b boundary circles four edge dots can group exactly as the partitions of 4 into at most b parts."
discover = "The reversed band has only one edge, its middle cut stays in one piece, and the seam's U/L swap explains both."
gem = "The famous one-piece Möbius cut explained by a two-element seam permutation rather than left as a magic trick."
concepts = ["mobius", "surfaces"]
mechanisms = ["unfold", "invariant", "pigeonhole"]
bands = ["K-1", "2-3", "4-5"]
reading = "None needed at K–1 (trace, colour, place dots); reading is adult-supported in the upper bands."
arithmetic = "Counting to four."
materials = ["printed strips week-38-materials.pdf: a sheet per child of A, B and a spare A and B, 260 × 45 mm, with centre line, U/L and corner marks; a one-third B for each K–3 child", "clear tape, washable markers and four removable dots per child", "adult scissors and a removable arrow"]
prep = "Print and cut 14 strip sheets and 3 one-third sheets, write U and L on the backs and tape the joins; pretest the joins, middle cuts, one-third cut and arrow before class. All cutting is done by an adult. The strips are physically unrehearsed."
status = "unpiloted"
verdict = "keep"
verdict_note = "Keep. The card's shoulds and coulds were made October 23 (v4): printed strips, the washer above Problem 3, a one-third cut of B as K–1 and 2–3 Problem 7, 4–5 Problem 7 on its own page, one-sidedness in the guide, and the bonus R seam drawn as dot to square."
app = "Seams"
app_decision = "in app"

