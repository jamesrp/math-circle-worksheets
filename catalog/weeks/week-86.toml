week = "86"
title = "Pursuit and escape"
hook = "Move a cop and a robber counter one road at a time on drawn maps, and find maps where the cop always catches the robber and maps where the robber escapes forever."
math = "On a finite connected graph where both players see everything, may stay or cross one road, and the cop moves first, every tree is cop-win: chasing along the unique path strictly shrinks the robber's region once the cop's dot is removed. A bare cycle of four or more dots is robber-win, since the robber can always stay outside the cop's closed neighbourhood, while a triangle is cop-win. Deleting a dominated dot (N[v] ⊆ N[u]) preserves cop-win, and a graph is cop-win exactly when such folds reduce it to one dot."
discover = "On trees the cop always wins; on rings of four or more dots the robber can escape forever."
gem = "A chase game whose winners are exactly the graphs that fold down to a point (Nowakowski–Winkler, Quilliot)."
concepts = ["cops-and-robbers", "trees", "graph-distance"]
uses = ["graphs"]
mechanisms = ["monovariant", "copying", "smaller-cases"]
bands = ["2-3", "4-5"]
reading = "None for the basic game; adults may read and record while children make every move."
arithmetic = "None for play; counting cop moves on paths."
materials = ["C and R counters 14–18 mm and a two-sided turn tile per pair", "sleeved boards with a dry-erase marker", "opaque covering pieces for folds; a third cop counter for the two-cop visit"]
prep = "10–15 minutes to print, sleeve and label counters, and 10 more to test a move, a stay, a capture and a reset."
status = "unpiloted"
verdict = "keep"
app = ""
app_decision = "open"

