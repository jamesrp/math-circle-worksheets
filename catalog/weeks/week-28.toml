week = "28"
title = "Flat folds"
hook = "Refold a paper disk along creases from its centre, marking each crease mountain or valley, and see which choices let it collapse flat."
math = "Creases from one point fold flat only if there is an even number of them, since each crease turns the paper over, and each alternating set of sectors sums to 180° (Kawasaki); with labels free, these conditions are also sufficient. In any flat fold the mountains and valleys differ by exactly two (Maekawa), so four right angles fold in exactly the 8 of 16 labellings with three of one letter; count and angles together still do not certify a given labelling (VVVM fails on 30°, 60°, 150°, 120°)."
discover = "Which labels and angles let a disk fold flat, and why an odd number of creases or a lopsided half-turn can never close."
gem = "A parity certificate a kindergartner can hold, each crease flips the paper, leads straight to Kawasaki's and Maekawa's theorems of origami."
concepts = ["folding", "angles", "parity"]
mechanisms = ["invariant", "every-case", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 reads only M and V with an adult reading aloud; 2–3 reads letters and clockwise orders; 4–5 reads short tasks."
arithmetic = "K–1 counts to eight with no degrees; 2–3 matches wedges against a half-turn, with degree sums optional; 4–5 adds angles to 360°."
materials = ["18 cm paper disks with pre-made creases, numbered rays and a marked front (adult-made)", "loose angle wedges and half-turn templates", "M/V tabs and A–H cards for K–1"]
prep = "Heavy: nothing prints the disks, wedges or tabs, so an adult cuts and marks disks with a protractor and pretests each fold on the actual paper."
status = "unpiloted"
verdict = "revise"
verdict_note = "Every band folds 18 cm disks the guide says to cut and mark with a protractor, and wedge sets traced by hand, and nothing prints them."
app = "Flat folds"
app_decision = "in app"

