week = "50"
title = "Staircases and lengths"
hook = "Draw right-and-up staircases between two corners of a rectangle, lay string along each, and compare their lengths with the straight diagonal."
math = "Every right-and-up path across a 160 by 120 mm rectangle is 280 mm long, because its right pieces add to the width and its up pieces to the height; staircases can stay as close as you like to the 200 mm diagonal and still measure 280 mm, so curves can be close while their lengths are not. In the strip within 15 mm of the diagonal (measured vertically) a horizontal piece spans at most 40 mm and an end piece at most 20 mm, so 8 turns are needed and 8 suffice; with left moves allowed a path measures 280 + 2L, where L is the total distance moved left."
discover = "Every staircase has the same length however tightly it hugs the diagonal, and a narrow strip forces a least number of turns."
gem = "The '√2 = 2' paradox done with string, beside a turn bound that has a matching construction."
concepts = ["length", "limits", "optimization"]
mechanisms = ["invariant", "certificate", "limit"]
bands = ["K-1", "2-3", "4-5"]
reading = "None needed at K–1, where an adult reads; upper bands read short tasks."
arithmetic = "K–1 compares lengths side by side; 2–3 adds lengths up to 360; 4–5 reasons about a vertical-gap bound."
materials = ["two non-stretch strings at least 40 cm long per pair", "a ruler and removable tape", "optional: a 30 cm pipe cleaner per K–1 child"]
prep = "Print at actual size, check the 100 mm calibration bar, and cut string."
status = "unpiloted"
verdict = "keep"
verdict_note = "The review card's shoulds and coulds were made on October 23, 2026 after the problem-file conversion: page 1's example is one 70 mm bar lettered in path order, older Problem 2 asks for each staircase's exact length, Grades 4-5 Problem 5 has a 7.5 mm strip and a fewest-turns question (16), the wording of Problems 3 and 7 and Grades 2-3 Problem 5 is plainer, and the guide states the turn optimum and gives one first-visit hour. Unpiloted; the K-1 pipe cleaner is untried."
app = "Staircases in Memory robot"
