week = "78"
title = "Three-armed lines"
hook = "Draw three-armed lines on a grid, slide them without turning, and mark what two lines share or where a junction must go to pass through two dots."
math = "A tropical line is three closed rays from a junction pointing east, north and southwest, the set where the least of x − a, y − b and 0 is attained at least twice. Any two such lines meet, in exactly one point unless their junctions share a row, a column or a rising diagonal, when they share a whole ray. Dually, two points lie on exactly one line unless aligned in one of those ways, when the possible junctions fill a ray."
discover = "Two lines always meet and two points fix one line, with exceptions you can draw and no parallels."
gem = "Euclid's first incidence facts survive in a geometry where plus becomes minimum, with honest exceptions."
concepts = ["tropical-geometry"]
uses = ["coordinates"]
mechanisms = ["construct", "every-case"]
bands = ["4-5"]
reading = "Short tasks; children plot points on a square grid, and (x, y) appears only on page 1 and in Problem 6."
arithmetic = "Compare small whole numbers; no signed arithmetic. The min rule appears only in the worked example."
materials = ["two coloured pencils, a ruler and two junction counters per pair", "large 1 cm grid sheets marked 0–12", "one traced three-arm shape per pair, on tracing paper"]
prep = "Print, mark axes on the extra grid sheets and trace three three-arm shapes (12 cm arms); no cutting."
status = "organizer-approved"
verdict = "keep"
verdict_note = "The organizer approved the five-page packet (v2) on October 17. The October 23 revision (v3) post-dates that approval and has not been re-approved: it made the review card's shoulds, so Problem 5 no longer prints its discovery and the guide adds an adult-led younger entry on page 4. The approved v2 PDFs are archived; show v3 to the organizer before printing it as the approved packet."
app = "Three-arm lines"
app_decision = "in app"

