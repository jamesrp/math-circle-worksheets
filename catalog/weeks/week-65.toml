week = "65"
title = "Hyperbolic octagon streets"
hook = "Walk an arrow along streets of right-angled octagons, four meeting at every corner, turning left at each corner, and count the moves until it is home facing the same way."
math = "In the hyperbolic tiling {8, 4}, drawn in the Poincaré disk, moving one edge and turning left returns home after 8 moves, not 4, and the outside of two rooms takes 12 quarter-turns where two squares take 4; around n rooms the net turning is 4 + 4n quarter-turns, always 4 on squares (a discrete Gauss–Bonnet). Two complete straight streets through a point P both miss a third street R, so the parallel postulate fails."
discover = "The left-turn walk that closes a square takes eight moves here, and several straight streets through one point can miss a given street."
gem = "A turtle walk exposes negative curvature: the extra turning around a block is the angle deficit of hyperbolic geometry."
concepts = ["hyperbolic-geometry", "curvature", "tilings"]
uses = []
mechanisms = ["counterexample", "every-case", "construct"]
bands = ["2-3", "4-5"]
reading = "Reading can be shared; p. 4 is nine sentences for one problem."
arithmetic = "Counting to twelve; no degrees, multiplication or formal geometry."
materials = ["a slim arrow marker about 10 mm long", "a second counter or coin"]
prep = "Print at actual size and check the arrow on both octagon boards; no cutting."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; the turning problems stop one case short of their rule, and K–1 has no route by design."
app = "Octagon streets"
app_decision = "in app"

