week = "62"
title = "Conflict networks and scheduling"
hook = "Place activity cards into numbered time slots so that no two linked activities share a slot, using as few slots as possible."
math = "A schedule is a proper colouring of the conflict graph. A clique of r activities needs r slots, but the bound can fail: a five-cycle with a leaf has no triangle yet needs 3. Two slots suffice exactly when there is no odd cycle, and first-fit in any order gives a legal schedule with at most Δ + 1 slots, yet a bad order wastes slots, 3 on a four-dot path and 4 on an eight-dot tree that needs only 2."
discover = "A fewest-slots answer needs a schedule plus a reason fewer slots fail, and an odd ring is what forces a third slot."
gem = "The odd-cycle criterion turns an impossibility into something you can point at, and first-fit's waste on a tree must be planned backwards."
concepts = ["graph-colouring", "bipartite", "algorithms", "multiplying-choices"]
uses = []
mechanisms = ["certificate", "greedy", "counterexample"]
bands = ["2-3", "4-5"]
reading = "An adult reads; children match letters A–H along printed lines."
arithmetic = "Counting to eight and checking pairs; p. 9 counts schedules with small products such as k(k − 1)^3."
materials = ["lettered activity cards A–H and slot headers 1–4 per kit", "small coloured counters (no assigned meaning yet; see the card)", "sleeves and dry-erase markers"]
prep = "Cut and letter the cards and headers, forecast 15–20 minutes; the handling pretest is not run."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; the missing K–1 band is a should, and the p. 9 visual prints a counting method."
app = "First fit in Neighbor Lanterns"
app_decision = "in app"

