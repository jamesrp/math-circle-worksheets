week = "96"
title = "Prime bags"
hook = "Split number cards into smaller factor cards until only primes are left, then choose some of the prime tokens to build every divisor."
math = "Every whole number above 1 is one bag of primes whatever splitting route is taken, by unique factorization (a prime dividing a product divides a factor). The divisors of p₁^e₁ ⋯ p_r^e_r are exactly its sub-bags, the empty bag giving 1, so there are (e₁ + 1)⋯(e_r + 1) of them. The least number with a given divisor count puts the largest counts on the smallest primes: 6, 12, 24, 36, 48 and 60 for 4, 6, 8, 9, 10 and 12 divisors."
discover = "Every route ends in the same prime bag, and choosing how many of each prime counts all the divisors."
gem = "Unique factorization turns divisors into sub-bags, so 2⁷·3⁴ = 10,368 has its 40 divisors counted without listing one."
concepts = ["prime-factorization", "multiplying-choices", "divisibility"]
uses = []
mechanisms = ["every-case", "construct", "certificate"]
bands = ["2-3", "4-5"]
reading = "Short prompts; an adult may read and write explanations."
arithmetic = "Equal groups and supported multiplication; keep a multiplication reference at hand."
materials = ["36 counters or linking cubes per pair", "prime tokens 2, 3, 5, 7 (eight 2s, six 3s, four 5s, two 7s)", "about 20 blank reusable number cards", "whiteboard"]
prep = "10–15 minutes to mark cards and sort kits; no cutout deck."
status = "unpiloted"
verdict = "keep"
app = ""
app_decision = "open"

