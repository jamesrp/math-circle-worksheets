week = "53"
title = "Cheapest connected networks"
hook = "Pay counters for whole roads until a pawn can reach every circled place, then look for a cheaper purchase by returning one road and buying another."
math = "With strictly positive link prices, every cheapest connected purchase is a spanning tree with n − 1 links. A link uniquely cheapest across a split of the places is in every optimum, a link uniquely dearest on a loop is in none, a tree is cheapest exactly when no one-link swap lowers its cost, and distinct prices force a single optimum."
discover = "A cheapest network never contains a loop, the three cheapest links can make a loop and leave a place out, and a tree no swap can improve is truly cheapest."
gem = "A purely local test, no improving swap, certifies a global optimum: the exchange property behind minimum spanning trees."
concepts = ["cheapest-networks", "trees", "optimization"]
uses = ["graphs"]
mechanisms = ["greedy", "certificate", "counterexample"]
bands = ["K-1", "2-3", "4-5"]
reading = "Labels and short prompts, read aloud as needed; K–1 pairs work pages 1–4 with an adult reading and paying while children choose links."
arithmetic = "Counting the dots beside prices 1–6 on pages 1–4, then numerals, with totals up to 26."
materials = ["about 30 equal counters per kit", "ten removable bought-link markers per kit", "a small pawn", "a sleeve and dry-erase pen", "an off-map payment tray"]
prep = "Print the chosen pages, count kits and sleeve the maps; forecast 10–15 minutes."
status = "unpiloted"
verdict = "revised"
verdict_note = "Original verdict revise. Both musts were fixed on October 23, 2026 after the problem-file conversion: the CD, DE and BD prices on pages 6 and 8 now sit on their own links, and every price on pages 1–4 has dots, those pages are headed Grades K–5 and the guide routes K–1 through them. Problems 2 and 4 print five record maps and Problem 6's answer areas name every and no cheapest purchase. Unpiloted; counters and markers are physically unrehearsed."
app = "Cheapest networks"
app_decision = "in app"

