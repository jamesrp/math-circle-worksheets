week = "11"
title = "Chip-firing with a sink"
hook = "Pile chips on circles joined by lines; a circle with at least one chip per line shares one along each line, and the sink square only collects."
math = "On a finite graph in which every circle can reach the sink, every legal run of shares stops, and all complete runs from a start end with the same piles and the same number of shares at each circle (the abelian property, proved by a least-action argument). On the four-cycle the score 3A + 4B + 3C drops by 2 at every share, a child-sized termination proof. Adding one chip at a time and settling can cycle and merge: on the triangle the empty board never returns while three still boards form a cycle."
discover = "Whatever order you choose, the run stops with the same final piles and the same share counts."
gem = "This is the abelian sandpile, with the sandpile group showing up as the add-one cycle on a triangle."
concepts = ["chip-firing", "algorithms", "iteration"]
mechanisms = ["monovariant", "invariant", "every-case"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none, with an adult reading and recording; 2–3 records one running sharing word; 4–5 reads proof questions."
arithmetic = "K–1 counts small piles; 2–3 keeps totals to 12 and counts letters afterwards; 4–5 reads ordered pairs and checks a weighted score."
materials = ["identical counters no wider than 20 mm (about 24 per child)", "small whiteboards or spare paper"]
prep = "Count counters and check that a pile fits a 44 mm printed circle; nothing to cut."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must. The card's six should-fixes and three of its coulds were made on October 23, 2026, in the new problem files (v4 packets): each K–1 order start printed twice, ten rows for K–1 Problem 4, \"both circles\" in K–1 Problem 6, the order question in 2–3 Problem 4, a Timing column in 2–3 Problem 5, a partner routine in the guide launch. Coulds 9, 10 and 12 are deferred."
app = "Chip firing"
app_decision = "in app"

