week = "98"
title = "Growing from a few seeds"
hook = "Place a few seed counters on a grid and keep filling any square that touches two filled squares, looking for the fewest seeds that fill the whole board."
math = "On an n × n grid where an empty cell fills once two of its side-neighbours are filled, every complete run from the same seeds ends in the same set, the least closed set containing them. Filling a cell with k ≥ 2 filled neighbours changes the exposed perimeter by 4 − 2k ≤ 0, and the full board has perimeter 4n, so at least n seeds are needed, and the n diagonal cells suffice. A start can have every seed indispensable without being smallest: four such seeds on 3 × 3, against three diagonal ones."
discover = "An n-by-n board needs exactly n seeds, because the outline of the filled region can never grow."
gem = "A perimeter monovariant gives a sharp lower bound in one line, matched by the diagonal."
concepts = ["percolation", "polyominoes", "optimization"]
uses = []
mechanisms = ["monovariant", "certificate", "counterexample"]
bands = ["2-3", "4-5"]
reading = "Reading can be supported; children keep the choice of seeds and of legal additions."
arithmetic = "Counting small sets; Grades 4–5 count exposed edges."
materials = ["16 counters or square tiles in two colours per pair, no wider than 25 mm (seeds and added squares)", "the packets' printed 30 mm boards as workboards", "short sticks to mark exposed edges"]
prep = "About 10 minutes to count counters for three pairs and a demonstration set, beyond printing."
status = "unpiloted"
verdict = "keep"
verdict_note = "Kept. On October 23, 2026 the card's shoulds were fixed in the new problem files (v2): Grades 2–3 Problem 3 asks whether other totals occur and Problem 4 numbers the additions; the guide adds a K–1 route, the order question for Grades 4–5, a child's explanation of one finish, and names the printed boards as workboards. A critic's same-day follow-up (W98-FAC-v3) gave the order question seeds that stop early after a choice of first move."
app = "Seed plots"
app_decision = "in app"

