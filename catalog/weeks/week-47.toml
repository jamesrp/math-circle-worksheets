week = "47"
title = "Gentle-step landscapes"
hook = "Place markers in a row of columns so neighbouring heights differ by at most one, around a few fixed clue heights, and find the lowest and highest landscapes."
math = "A landscape is a row of whole-number heights with neighbours at most 1 apart, some fixed as clues; the clues can be completed exactly when every two of them differ by at most their distance apart. Then the pointwise lowest and highest completions L(i) = max(0, max_c(a_c − |i − c|)) and U(i) = min_c(a_c + |i − c|) are themselves landscapes, bound every completion and give the least and greatest totals (discrete McShane extension). The fewest one-level moves between two landscapes equals the total change, though the order of moves matters."
discover = "Two clues fit together exactly when their heights differ by at most their distance, and one landscape is lowest everywhere at once."
gem = "Lipschitz extension with explicit extremal envelopes, built with markers on a grid."
concepts = ["slope-limits", "optimization"]
mechanisms = ["extremal", "certificate", "construct"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 compares small heights with adult reading; upper bands read one-sentence tasks."
arithmetic = "K–1 uses heights 0–5; 2–3 totals to 16; 4–5 adds and subtracts distances."
materials = ["seven white and three black flat counters per child, about 1.5 cm across"]
prep = "Print boards at actual size and sort counters; light. Physically unrehearsed."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must-fix. The should-fixes were made October 23, 2026 in the new problem files and the guide (v4): record rows with printed clues for Grades 2–3 and 4–5 Problems 1–2, a K–1 Problem 7 page with its own empty board, a Grades 4–5 Problem 6 that has children shade allowed heights around one clue and around two, and a guide that states the envelopes' hypothesis and the move fact, names counters and partner checks, the only forcing pairs and an hour that starts with the run. The bonus companion (v2, same day) says its gray towers count in the budget and states the envelopes' hypothesis."
app = "Gentle hills"
app_decision = "in app"

