week = "21"
title = "The shortest route that touches a line"
hook = "Stretch string from one dot to a line and on to a second dot, find the touching point that uses the least string, and fold the paper to see why."
math = "For A and B strictly on one side of a line, reflect B to B′: every route A–M–B is as long as A–M–B′, hence at least AB′, with equality only where AB′ crosses the line, so the best contact is unique (Heron's problem). It follows that mirrored finishes tie at every contact, the starts with a given best contact form a ray, equal minima and shared contacts are independent, and on a segment of the line the same route stays best only when its contact is allowed."
discover = "Folding the finish across the line straightens the best route, which shows that no other contact can beat it."
gem = "Heron's problem with its equality case and its inverse, proved against routes nobody drew."
concepts = ["reflection", "length", "optimization"]
mechanisms = ["unfold", "certificate"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none; 2–3 reads short sentences; 4–5 reads short proof tasks."
arithmetic = "None required: string, ruler and folds compare lengths, and coordinates are adult checks."
materials = ["non-stretch string, about 60 cm (four pieces per table)", "rulers or straightedges", "tracing paper", "removable tape"]
prep = "Cut twelve 60 cm strings, four per table, and have each adult rehearse pinching a length and reflecting a dot on a blank sheet; about 5 minutes."
status = "unpiloted"
verdict = "keep"
app = "Shortest routes in Mirror Couriers"
app_decision = "in app"

