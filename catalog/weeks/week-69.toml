week = "69"
title = "Thin and fat road triangles"
hook = "Choose a shortest route for each pair of three homes on a tree or a grid, colour the three routes, and find how far a dot on one side can be from the other two."
math = "A road triangle is three homes with one chosen shortest route per pair, and a dot's gap is its road distance to the union of the other two sides. On a tree the routes form a tripod, so every gap is 0; on the grid the homes (0,0), (n,0), (n,n), with the third side up the left and across the top, give gap n at (0,n), so no bound holds for all grid triangles, and the same homes also allow a triangle with every gap 0."
discover = "Trees force thin triangles, grids allow arbitrarily fat ones, and the homes alone do not fix the gap."
gem = "Gromov's thin-triangle condition, the definition of a hyperbolic space, reached with three coloured pencils: trees are 0-hyperbolic and the plane is not hyperbolic at all."
concepts = ["thin-triangles", "graph-distance", "trees", "distance-rules"]
uses = []
mechanisms = ["construct", "counterexample"]
bands = ["4-5"]
reading = "About 85 words of rules; an adult can read the gap definition on p. 2."
arithmetic = "Counting roads to 12."
materials = ["three coloured pencils", "three small home counters marked A, B and C", "spare grid paper"]
prep = "Print single-sided at 100%, with two extra copies of pp. 1 and 3 per pair for repeated tries; routes go in pencil first and are coloured after the partner's check."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must. The shoulds (Problem 3 repeating Problem 2's board, spare copies and pencil before colour, routes for the younger tables) were fixed on October 23, 2026 in GGT69-S-v3 and GGT69-FAC-v3: Problem 3's middle board has new homes with biggest gap 3. After a critic's review the same day, the guide's K–1 route (GGT69-FAC-v4) uses paper strips, one per route on each road, allows the second tree and takes 15–20 minutes."
app = "Gaps in Meeting roads"
app_decision = "in app"

