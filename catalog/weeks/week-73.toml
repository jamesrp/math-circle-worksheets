week = "73"
title = "The gentlest stretch"
hook = "Map a 4-by-1 sheet onto a 2-by-2 square side to side, measure how much pairs of dots get stretched, and look for the map whose worst stretch is smallest."
math = "Every homeomorphism from the 4-by-1 rectangle onto the 2-by-2 square taking each named side to its match stretches some pair by at least 2, because a vertical unit segment joins bottom to top and its ends must land at least 2 apart; the map (x/2, 2y) attains 2. For a W-by-H target the least worst stretch is max(W/4, H). A few pin tests cannot certify a map: every five-pin placement scores 2."
discover = "Good scores on a few test pairs do not prove a map is good, and one unavoidable pair proves no map does better."
gem = "An optimal Lipschitz constant certified by a single pair, alongside a lesson about what sampling can hide."
concepts = ["stretch-maps", "optimization", "scaling"]
uses = ["coordinates"]
mechanisms = ["certificate", "counterexample", "construct"]
bands = ["4-5"]
reading = "An adult can read aloud or record."
arithmetic = "Ruler lengths, halves and comparing a length with twice another; Problems 5–6 use ratios."
materials = ["five small labelled paper dots", "a ruler", "scrap paper strips", "blank grid paper"]
prep = "Print at actual size with two or three spare copies of pp. 1–2; rehearse locating side midpoints."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; Problem 5's two targets are both decided by height, and the guide never says how to get a stretch from two readings."
app = ""
app_decision = "not porting"

