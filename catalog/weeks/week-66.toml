week = "66"
title = "Lamplighter streets"
hook = "Walk a lamplighter along a street, flip the lamp underfoot, and light a target pattern from a dark street in the fewest moves."
math = "A state is the walker's position plus the finite set of lit lamps, and the moves are left, right and flip: the word metric of the lamplighter group. From all lamps off at 0, the fewest moves equal the number of lit lamps plus the shortest walk from 0 that visits every lit lamp and ends at the walker. Lamps −1, 0, 1 lit with the walker at 0 is a dead end: distance 7, while each of its three neighbouring states is at distance 6."
discover = "A target's distance splits into flips plus walking, and a longer move word can describe a state that is easier to reach."
gem = "Dead ends, states from which every move leads back toward the start, are a signature of the lamplighter group."
concepts = ["cayley-graphs", "graph-distance"]
uses = ["parity"]
mechanisms = ["certificate", "counterexample"]
bands = ["2-3", "4-5"]
reading = "An adult reads p. 1's seven short sentences; signed positions are only labels."
arithmetic = "Counting a move word of up to 11 letters."
materials = ["nine two-sided lamp counters about 17 mm or smaller", "a distinct walker pawn"]
prep = "Print single-sided at 100% and test counter fit on the 13 mm lamp circles (19 mm centres); about a dozen cubes per child for a K–1 table."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must. The shoulds and coulds were fixed October 23, 2026, in the new problem files and the guide (GGT66-S-v2, five pages): Problem 5 asks whether every target has a move that makes it harder, a new Problem 6 asks which targets are dead ends (walker at 0, lamp 0 on, a lamp on each side), the start rule is stated once with a home mark at 0, and the guide adds the dead-end proof, a 17 mm counter size, an adult-led K–1 route (no K–1 pages) and a goal example in the launch."
app = "Lamplighter in Lantern Wires"
app_decision = "in app"

