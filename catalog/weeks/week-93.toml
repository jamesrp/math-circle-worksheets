week = "93"
title = "Squaring a rectangle"
hook = "Build rectangles from 24 tiles, then reshape a rectangle into a more square one with the same area and see how tightly that traps the side of the equal-area square."
math = "For a rectangle with sides a < b and area A, using the average m = (a + b)/2 and h = A/m as new sides keeps the area and gives a < h < √A < m < b, because m² − ab = ((b − a)/2)²: the average-side square holds the rectangle plus one small square. The new gap (b − a)²/(2(a + b)) is less than half the old one, so repeated reshaping traps √A in nested brackets narrower than any tolerance. Yet an unequal rectangle never becomes a square in finitely many moves, even when A = 36."
discover = "Averaging the sides overshoots the area by a small square, and correcting it gives a more square rectangle every time."
gem = "Newton's method for square roots as a geometric reshaping, with a missing-square picture proving the bound."
concepts = ["area", "limits", "dissection"]
uses = []
mechanisms = ["invariant", "limit"]
bands = ["2-3", "4-5"]
reading = "Short tasks; adults may read and record."
arithmetic = "Area as rows times columns, halves, division and comparing supplied fractions; side cards and an optional calculator lighten the arithmetic."
materials = ["24 square tiles per pair", "squared paper, scissors and ruler", "side cards cut from an extra copy of page 4", "optional four-function calculator"]
prep = "Print extra copies of pages 2 and 4 for cutting and keep the originals intact."
