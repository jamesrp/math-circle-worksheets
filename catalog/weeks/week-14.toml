week = "14"
title = "Polygon triangulations and flips"
hook = "Fill a polygon with straight lines between its corners until it is all triangles, find every way, and change one line at a time to walk from one filling to another."
math = "A convex polygon with n labelled corners is filled by n − 3 noncrossing diagonals into n − 2 triangles, with 1, 2, 5 and 14 fillings for n = 3 to 6. A flip swaps the diagonal of the quadrilateral two triangles form, so every filling has n − 3 neighbours; flips connect all fillings, the pentagon's flip map is a five-cycle, and the distance to the fan at corner v is exactly n − 3 − d_v, where d_v diagonals already meet v."
discover = "Every filling of a polygon has the same number of triangles, and single flips lead from any filling to any other."
gem = "The fan rule is an exact corner of flip distance, whose general complexity (the rotation-distance problem) is still open."
concepts = ["catalan", "graph-distance", "listing-cases"]
mechanisms = ["every-case", "certificate", "smaller-cases"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none with an adult reading and possibly tracing; 2–3 and 4–5 read one- or two-sentence tasks."
arithmetic = "K–1 counts triangles; 2–3 organizes collections and counts changes; 4–5 compares a route with a lower bound; no formulas."
materials = ["short straightedges", "tracing paper cut into quarter sheets (about 10 per child)"]
prep = "Cut tracing paper into quarters and try one flip on a traced quadrilateral."
status = "unpiloted"
verdict = "keep"
app = "Polygon cuts"
app_decision = "in app"

