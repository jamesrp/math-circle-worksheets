week = "17"
title = "Machine memory"
hook = "Move a marker along red and blue arrows as cards are turned, and build the machine with the fewest circles that answers yes or no for a rule."
math = "A machine has finitely many circles, each with one R arrow, one B arrow and a fixed yes or no; if two histories leave the marker on the same circle, no shared continuation can separate them, so k histories that are pairwise separable force k circles (the easy half of Myhill–Nerode). With a working machine this gives exact minima: m circles for 'the number of reds is a multiple of m', 3 for 'ends in RB', and 2 for 'the last card is blue' or 'a red has appeared'."
discover = "A machine must keep apart every pair of histories that some ending could separate, and counting such histories gives the fewest circles."
gem = "A two-sided certificate for the fewest states: a working machine from above, pairwise separable histories from below."
concepts = ["automata", "remainders", "words"]
mechanisms = ["certificate", "pigeonhole", "construct"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 matches R and B and follows arrows while an adult reads; 2–3 reads moderate amounts; 4–5 reads short tasks."
arithmetic = "Counting four or six cards and groups of three; no long division or algebra."
materials = ["blank state discs about 4 cm across", "R and B cards (about 24 per table)", "marker tokens (four per table)", "small whiteboards"]
prep = "Make card sets and state discs: about 15 minutes with existing cards, 25 from scratch."
status = "unpiloted"
verdict = "keep"
app = "Card machines"
app_decision = "in app"

