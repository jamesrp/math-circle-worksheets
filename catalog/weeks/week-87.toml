week = "87"
title = "Voting and agendas"
hook = "Vote with fixed ranking cards on two options at a time, then choose which option waits for the final and watch the winner change."
math = "Three consistent rankings ABC, BCA and CAB give a majority cycle, A beats B beats C beats A, each 2–1, so in a two-round knockout the option that waits always wins and the agenda decides the result; an option that beats both others wins every agenda. With five voters who each prefer the location nearer their favourite on a line, the middle favourite beats every other location, because three voters on its side always outvote. The cycle cannot come from such line preferences, since the middle of three candidates is never anyone's strict worst."
discover = "Who waits decides who wins, unless one option beats all others, as the middle favourite on a line does."
gem = "Condorcet's paradox beside Black's median-voter theorem: a cycle that one-dimensional geometry forbids."
concepts = ["voting", "nontransitive"]
uses = []
mechanisms = ["construct", "every-case", "extremal"]
bands = ["2-3", "4-5"]
reading = "Rankings read with adult help; the separate line visit suits Grades 3–5."
arithmetic = "Tally up to five votes; the line visit compares distances on a 0–10 line and handles ties."
materials = ["three ranking cards, option tiles, voter tokens, tally and knockout mats (printed, cut)", "six blank erasable ranking cards", "for the line visit: a 0–10 board, five favourite markers, X/Y proposal markers and V1–V5 tokens"]
prep = "15–25 minutes for one ranking visit with existing counters; 35–50 minutes to cut all three complete kits."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must-fix. The should-fixes were made October 23, 2026 in the new problem files and the guide: equal favorite stems on the line pages with one set numbered out of order, line Problem 3 asks how to tell the winner without trying every vote, upper Problem 1 named as the agenda visit's continuation, an adult-led K–1 route and a corrected Problem 3 key."
app = "Voting and agendas"
app_decision = "in app"

