week = "2"
title = "Lamp lab"
hook = "Press a line between two lamps to flip both, and try to turn a start picture into a target picture on rings, trees, grids and separate islands."
math = "A press flips the lamps at both ends of a line, so a target is reachable exactly when every connected piece has an even number of lamps that must change; pressing a path changes only its two ends, and presses cancel in pairs, so each puzzle is linear algebra over the two-element field. On a ring the solutions are one set of lines and its complement, so the hardest target needs ⌊n/2⌋ presses, and on a tree a reachable target has exactly one set of lines."
discover = "Which targets can be made depends on an even number of changed lamps in each piece, and some networks have one solution while a ring has two."
gem = "Solvability is a parity condition on components, and the solutions form a coset of the cycle space: complements on a ring, a single set on a tree."
concepts = ["linear-algebra-f2", "parity", "graphs", "trees"]
mechanisms = ["invariant", "construct", "certificate"]
bands = ["K-1", "2-3", "4-5"]
reading = "Compact catalog problems are one sentence an adult can read aloud; the upper catalog has one- or two-line prompts."
arithmetic = "None for the compact catalog; the upper catalog counts to about eight and uses odd and even by pairing."
materials = ["two-sided counters on a large blank board, so a press flips both lamps (recommended)", "small whiteboards and markers"]
prep = "Print the compact or upper catalog; nothing to cut. Only the upper catalog has current adult notes (plans/week-02-catalog-upper.md)."
status = "piloted"
verdict = "revise"
verdict_note = "The compact catalog gives no board on which a printed ON lamp can be turned off and has no current adult guide; the upper catalog is at the bar."
app = "Lantern Wires"
app_decision = "in app"

