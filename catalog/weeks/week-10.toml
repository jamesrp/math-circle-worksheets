week = "10"
title = "Bridges"
hook = "Walk a token across bridges between islands, picking up the counter on each bridge you cross, and find where a walk over every bridge can start."
math = "For a town in one piece, a walk over every bridge exactly once exists exactly when zero or two islands have an odd number of bridges; with zero it starts anywhere and returns, with two it runs from one odd island to the other. So the start set is never a single island, one new bridge fixes two odd islands, a drawing needs half its odd points as strokes, and the fewest repeated bridges pair the odd islands by paths, which makes the three-arm star need 3 repeats, not 2."
discover = "Only the number of bridges at each island matters: odd islands must be where a walk starts or ends."
gem = "Euler's two-way theorem, reached by walking and getting stuck, with route inspection showing where the naive count of repeats fails."
concepts = ["euler-trails", "parity", "graphs"]
mechanisms = ["pair-up", "construct", "certificate"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none with one or two sentences read aloud; 2–3 writes walks as letter words and one longer explanation; 4–5 writes a few explanations and one proof."
arithmetic = "K–1 counts to 6; 2–3 counts bridges at each island and sorts odd from even; 4–5 halves the number of odd islands."
materials = ["counters about 1 inch or smaller (about 150)", "tokens such as pattern-block triangles", "yellow hexagons and 4.5-inch craft sticks for building towns", "small sticky notes", "masking tape for an optional floor town"]
prep = "Tape the optional floor town and check that counters fit the tightest printed town; nothing to cut."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; the guide's K–1 legend and missing \"connected\" hypotheses were corrected on October 23, 2026. After the problem-file conversion the same day, 2–3 Problem 6 starts on a fresh page (13 pages). A critic's follow-up the same day labelled grades 2–3 pages 8 and 10 as continuations of Problems 5 and 7 (F10-M-v6)."
app = "Bridge Courier"
app_decision = "in app"

