week = "12"
title = "Catalan bijections"
hook = "Join dots around a circle in pairs with strings that never cross, then turn each pairing into a mountain path of up and down steps or into a tree."
math = "Noncrossing pairings of 2n points on a circle, up–down paths of n ups and n downs that never dip below the start, and ordered rooted trees with n edges correspond one to one, and each inverse is forced (close the most recent open string; at U add a rightmost child, at D return to the parent). So all three are counted by 1, 2, 5, 14, 42, 132 through the first-return split C(n) = Σ C(i)C(n − 1 − i). A fixed chord can be completed exactly when it leaves an even number of dots on each side, and every noncrossing pairing joins two neighbours."
discover = "Pairings, paths and trees carry the same information, so they come in the same numbers."
gem = "Three Catalan families matched by reversible codes, with the recurrence visible as the first-return split."
concepts = ["catalan", "bijection", "recurrence", "trees"]
mechanisms = ["every-case", "smaller-cases", "extremal"]
bands = ["K-1", "2-3", "4-5"]
reading = "K–1 needs none, but five rule sentences are read aloud once; 2–3 reads little until Problems 4–5; 4–5 reads seven sentences of tree rules shown by an example."
arithmetic = "K–1 uses small counts; 2–3 tracks one-step rises and falls; 4–5 adds and multiplies for counts up to 132."
materials = ["short flexible strings (about 20 cm)", "paper endpoint discs", "U and D direction cards"]
prep = "Cut strings and discs, make U/D cards, and rehearse one eight-dot mat."
status = "unpiloted"
verdict = "revise"
verdict_note = "The guide hint for K–1 Problem 4 says comparing the partners of one dot detects duplicates, so an adult may call a new pairing a repeat."
app = "Circle strings"
app_decision = "in app"

