week = "95"
title = "Count the unseen"
hook = "Catch some counters from a bag, mark and return them, catch again, and use the marked ones you catch to guess how many are hiding."
math = "If a first catch of M objects is marked and returned and a second catch of n holds R marked ones, at least M + n − R objects exist and any larger total fits the record, so the data alone give no upper bound. If the second catch is a uniform sample, the expected overlap is Mn/N, which motivates the estimate Mn/R; it varies from round to round and is not an exact recovery. For a fixed budget M + n, equal catches maximise the expected overlap."
discover = "A record proves a lower bound but never an upper one; the overlap only supports a guess."
gem = "The line between certainty and inference drawn with counters: the union bound is a proof, the Lincoln–Petersen estimate is a model."
concepts = ["inference", "expected-value"]
uses = []
mechanisms = ["construct", "simulate"]
bands = ["2-3", "4-5"]
reading = "Grades 2–3 with adult reading; letters on the objects carry identities."
arithmetic = "Grades 2–3 count and add or subtract within 20; Grades 4–5 multiply, divide and use equivalent fractions."
materials = ["24 identical flat counters or stiff cards lettered A–X per kit", "two opaque bags, two catch trays and a screen", "an erasable marker whose dots cannot be felt, and a cloth"]
prep = "15–20 minutes to letter three kits and test that marks survive handling, erase, and cannot be felt."
status = "unpiloted"
verdict = "keep"
verdict_note = "No must; on October 23, 2026 the live game's keeper became the adult, who fills the bag from the mixed kit, Grades 4–5 Problem 5 became a forced-overlap design question, and the guide gained a K–1 route, with small wording fixes. Marks and filling are physically unrehearsed."
app = ""
app_decision = "open"

