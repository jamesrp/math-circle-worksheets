# A six-year path for returning children: a proposal for the organizer, unpiloted.
#
# One room, three levels (K–1, 2–3, 4–5), twenty one-hour sessions a year for six years,
# starting with the current year 2026–27. Year 1's first ten sessions are the fall Weeks 1–10
# as planned; only Weeks 1 and 2 have been taught. The plan and its reasoning are in
# plans/six-year-path.md; catalog/check_path.py checks this file and the builder shows it as
# the explorer's Path view.
#
# A session is one meeting of about an hour. An entry names what the whole room does:
#   id        a week id ("3", "1e"), a return visit ("rv-3": the week's return-visit or bonus
#             companion) or an atlas family ("AD-21")
#   hours     2 for a rich, heavy-kit theme run on two consecutive meetings (default 1)
#   move      the main reasoning move, a mechanism id from concepts.toml (for a week or an
#             atlas family, one its record lists)
#   kit       light (under about 15 minutes, nothing much to cut), medium (a print-and-cut kit
#             or a set to make, about 15–45 minutes) or heavy (an evening, a build or a long cut)
#   kit_note  what the volunteer prepares, short
#   revisits  earlier entries this one returns to; each needs a catalog link (a return visit's
#             own week, or a related link between the two records)
#   note      what it revisits or prepares, short
#   k1        how the K–1 table enters when the week has no K–1 pages
#
# The check fails on unknown ids, a concept before a concept it requires (root concepts count
# as everyday background; [[waiver]] lists the exceptions), the same theme twice in a year,
# more than two sessions in a row from one area, a year with fewer than five areas, a revisit
# closer than one year (twenty sessions), and three heavy kits in a row.

title = "A six-year path for returning children"
status = "Proposal for the organizer, October 24, 2026. Unpiloted beyond Weeks 1 and 2."
sessions_per_year = 20

[[year]]
