# Week 3 (Shuffle machines) as problem files: the worked example of layout = "flow".
# An example only: lowell-math-circle-year-2/source/week-03/ stays the source of
# the print packets until Week 3 is next revised. Problems are the files in
# problems/, in packet order.
week = 3
topic = "Shuffle machines"
packet = "F03"              # footer ids F03-K-v5, F03-M-v5, F03-U-v5
version = "v5"
layout = "flow"
template = "template.tex"   # the whole document, with <<body>> where the problems go
inputs = ["../../../lowell-math-circle-year-2/source/week-03/src"]   # its preamble.tex and fig/*.tex
# The week's \problem macro numbers with a counter. Setting the counter first keeps
# the packet's numbers in first-route and return packets.
prompt = '\setcounter{prob}{<<n>>}\addtocounter{prob}{-1}\problem{<<body>>}'
status = "Unpiloted."

[bands."K-1"]
header = "K–1"
tag = "K"
size = "14pt"
extra = '\renewcommand{\labelfont}{\large}'

[bands."2-3"]
header = "Grades 2–3"
tag = "M"
size = "12pt"
extra = ""

[bands."4-5"]
header = "Grades 4–5"
tag = "U"
size = "12pt"
extra = ""
